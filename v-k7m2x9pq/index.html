<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C62828">
<meta name="robots" content="noindex, nofollow">
<title>ハッピートマトファーム 実績</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23C62828'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%232E6B33' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<script>
window.__log = [];
window.onerror = function(msg, src, line, col){
  window.__log.push("エラー: " + msg + "  (" + line + "行)");
  var b = document.body;
  if(!b) return;
  var d = document.createElement("div");
  d.style.cssText = "margin:14px;padding:14px;border:2px solid #C62828;background:#fff;font-size:13px;white-space:pre-wrap;word-break:break-all";
  d.textContent = window.__log.join("\n");
  b.appendChild(d);
};
</script>
<style>
:root{
  --paper:#FFF; --ink:#12180F; --muted:#5C6857; --rule:#DCE3D7;
  --tomato:#C62828; --leaf:#2E6B33; --tint:#F5F8F2;
  --y0:#3F7CAC; --y1:#E09B2D; --y2:#C62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--tint); color:var(--ink);
  font-family:-apple-system,"Segoe UI","Noto Sans JP",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
  padding:0 0 40px; max-width:680px; margin:0 auto;
}
header{
  background:var(--paper); padding:16px 16px 0;
  border-bottom:1px solid var(--rule);
  position:sticky; top:0; z-index:20;
}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.02em}
header .sub{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:0;-webkit-overflow-scrolling:touch}
nav button{
  flex:none;padding:9px 15px;font-size:14.5px;font-weight:700;font-family:inherit;
  background:none;border:none;border-bottom:3px solid transparent;
  color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px;
}
nav button.sel{color:var(--tomato);border-bottom-color:var(--tomato)}

main{padding:16px 12px}
.card{background:var(--paper);border:1px solid var(--rule);margin-bottom:14px;overflow:hidden}
.card h2{
  font-size:14px;font-weight:700;margin:0;padding:12px 15px;
  border-bottom:1px solid var(--rule);letter-spacing:.03em;
}
.card .body{padding:14px 12px}

.big{display:flex;gap:10px;padding:14px 12px}
.big > div{
  flex:1;text-align:center;padding:12px 4px;background:var(--tint);
  border:1px solid var(--rule);
}
.big .lab{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.big .val{font-size:23px;font-weight:800;font-family:ui-monospace,monospace;line-height:1.25;margin-top:3px}
.big .un{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.big .cmp{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--leaf)} .down{color:var(--tomato)} .flat{color:var(--muted)}

canvas{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin-top:12px;color:var(--muted);padding:0 3px}
.legend i{display:inline-block;width:16px;height:4px;vertical-align:middle;margin-right:6px}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--rule)}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--tint)}
th:first-child,td:first-child{text-align:left;padding-left:10px;font-weight:700}
td{font-family:ui-monospace,monospace}
tr:last-child td{border-bottom:none}
tr.sum td{background:var(--tint);font-weight:800;border-top:2px solid var(--ink)}

.bars{padding:2px 3px}
.bar{margin-bottom:11px}
.bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .top b{font-family:ui-monospace,monospace;font-weight:700}
.bar .track{height:10px;background:var(--tint);border:1px solid var(--rule)}
.bar .fill{height:100%;background:var(--leaf)}
.bar.g1 .fill{background:#2E6B33}
.bar.g2 .fill{background:#6E9A5E}
.bar.g3 .fill{background:#A9BE96}
.bar.g4 .fill{background:#D2D9C6}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.scroll::-webkit-scrollbar{height:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
.scroll table{min-width:400px}
table td.n{font-size:12.5px}
table.pct th:first-child,table.pct td:first-child{width:52px}
table.pct th,table.pct td{padding:6px 2px;font-size:12px}
table.pct td.hi{background:var(--tint);font-weight:800}
.swatch{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.pick{display:flex;gap:6px;padding:0 12px 10px}
.pick button{
  flex:1;padding:8px 4px;font-size:13px;font-weight:700;font-family:inherit;
  border:2px solid var(--rule);background:var(--paper);color:var(--muted);cursor:pointer;
}
.pick button.sel{border-color:var(--ink);color:var(--ink);background:var(--tint)}
.note{font-size:12.5px;color:var(--muted);padding:0 4px;margin:10px 0 0}
.only-narrow{display:none}
@media (max-width:520px){ .only-narrow{display:block} }

footer{text-align:center;font-size:12px;color:var(--muted);padding:18px 16px 0}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 12px}
</style>
</head>
<body>

<header>
  <h1>ハッピートマトファーム</h1>
  <div class="sub" id="sub">実績</div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
(function(){
 try{
  var D = window.DATA;
  var host = document.getElementById("main");
  if(!D || !D.seasons || !D.seasons.length){
    var why = !D
      ? "data.js を読み込めませんでした。"
      : "data.js の中身が空です。";
    host.innerHTML =
      '<div class="card"><h2>表示できません</h2><div class="body">' +
      '<p style="margin:0 0 12px;font-size:14.5px">' + why + '</p>' +
      '<p style="margin:0 0 8px;font-size:13.5px;color:#5C6857">' +
      'このページと同じフォルダに data.js があるか確認してください。' +
      '次のアドレスを開いて中身が表示されれば、ファイルは届いています。</p>' +
      '<p style="margin:0;font-family:ui-monospace,monospace;font-size:12.5px;' +
      'background:#F5F8F2;border:1px solid #DCE3D7;padding:9px;word-break:break-all">' +
      location.href.replace(/[^/]*$/, "") + 'data.js</p>' +
      '</div></div>';
    return;
  }

  var HOUSES = ["全体","中央","東","西","南"];
  var cur = "全体";
  var seasons = D.seasons;
  var last = seasons[seasons.length-1];
  var prev = seasons.length > 1 ? seasons[seasons.length-2] : null;
  /* 年度ごとの棒・線の色。
     以前はCSSの変数（--y0 など）から読み取っていたが、
     ブラウザによっては値を取得できず、全部が同じ色で描かれることがあった。
     ここで直接指定して、確実に色が分かれるようにしている。
     隣り合う年度どうしで色味がはっきり離れるよう並べてある。 */
  var YEAR_COLORS = ["#2F6FB2", "#E8863C", "#7B4EA8", "#1E9E76", "#B5306B"];

  document.getElementById("sub").textContent =
    last.label + "　最終更新 " + (D.generated || "").slice(0,10);
  document.getElementById("foot").textContent =
    "このページは関係者向けです。転送はご遠慮ください。";

  document.getElementById("tabs").innerHTML = HOUSES.map(function(h){
    return '<button data-h="'+h+'"'+(h===cur?' class="sel"':'')+'>'+h+'</button>';
  }).join("");

  document.getElementById("tabs").addEventListener("click", function(e){
    var h = e.target.getAttribute("data-h");
    if(!h) return;
    cur = h;
    Array.prototype.forEach.call(this.children, function(b){
      b.classList.toggle("sel", b.getAttribute("data-h") === h);
    });
    render();
    window.scrollTo(0,0);
  });

  function sum(a){ return a.reduce(function(x,y){ return x + (y||0); }, 0); }

  /* 背景色に対して読みやすい文字色（黒か白）を返す。
     明るい色の上に白文字を置くと読めなくなるのを防ぐ。
     0.299/0.587/0.114 は、人の目の感度に合わせた明るさの重み付け。 */
  function onColor(hex){
    var r = parseInt(hex.substr(1,2),16),
        g = parseInt(hex.substr(3,2),16),
        b = parseInt(hex.substr(5,2),16);
    return (r*299 + g*587 + b*114) / 1000 > 150 ? "#12180F" : "#FFFFFF";
  }
  function fmt(n, d){
    return (+n).toLocaleString("ja-JP", {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
  }

  /* 実績のある最新の年度。今年度がまだ空でも表示できるようにする。 */
  function latestWithData(){
    for(var k = seasons.length-1; k >= 0; k--){
      if(sum((seasons[k].houses[cur] || {}).kg || []) > 0) return seasons[k];
    }
    return last;
  }

  function ratioTag(now, before){
    if(!before) return '<div class="cmp flat">前年 —</div>';
    var r = now / before * 100;
    var cls = r >= 102 ? "up" : (r <= 98 ? "down" : "flat");
    var sign = r >= 100 ? "+" : "";
    return '<div class="cmp '+cls+'">前年比 '+sign+fmt(r-100,1)+'%</div>';
  }

  /* ---------- 棒グラフ ---------- */
  function barChart(cv, series){
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height, L = 48, R = 10, T = 12, B = 30;
    ctx.clearRect(0,0,W,H);

    var max = 0;
    series.forEach(function(s){ s.data.forEach(function(v){ if(v > max) max = v; }); });
    if(max <= 0) max = 1;
    var step = Math.pow(10, Math.floor(Math.log(max)/Math.LN10));
    if(max/step < 2) step /= 2; else if(max/step > 5) step *= 2;
    max = Math.ceil(max/step)*step;

    var n = D.months.length;
    var slot = (W-L-R) / n;
    var gap = slot * 0.22;
    var bw = (slot - gap) / series.length;
    var y = function(v){ return H-B - (H-T-B) * (v/max); };

    ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
    for(var v = 0; v <= max + 1e-9; v += step){
      ctx.strokeStyle = "#E8EDE3";
      ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(W-R, y(v)); ctx.stroke();
      ctx.fillStyle = "#5C6857";
      ctx.fillText(fmt(v, 0), L-6, y(v)+3.5);
    }

    series.forEach(function(s, si){
      ctx.fillStyle = s.color;
      s.data.forEach(function(v, i){
        if(!v) return;
        var x0 = L + slot*i + gap/2 + bw*si;
        ctx.fillRect(x0, y(v), bw-1, (H-B) - y(v));
      });
    });

    ctx.fillStyle = "#5C6857"; ctx.textAlign = "center";
    D.months.forEach(function(m,i){
      ctx.fillText(m.replace("月",""), L + slot*i + slot/2, H-11);
    });
  }

  /* ---------- 構成比の推移（積み上げ） ---------- */
  function stackChart(cv, keys, byMonth, labels, palette){
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height, L = 40, R = 10, T = 12, B = 30;
    ctx.clearRect(0,0,W,H);

    var n = D.months.length;
    var tot = [];
    for(var i=0;i<n;i++){
      var t = 0;
      keys.forEach(function(k){ t += (byMonth[k]||[])[i] || 0; });
      tot.push(t);
    }
    var slot = (W-L-R)/n, gap = slot*0.2, bw = slot-gap;
    var y = function(p){ return H-B - (H-T-B)*(p/100); };

    ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
    [0,25,50,75,100].forEach(function(p){
      ctx.strokeStyle = "#E8EDE3";
      ctx.beginPath(); ctx.moveTo(L, y(p)); ctx.lineTo(W-R, y(p)); ctx.stroke();
      ctx.fillStyle = "#5C6857";
      ctx.fillText(p+"%", L-6, y(p)+3.5);
    });

    for(var i=0;i<n;i++){
      if(!tot[i]) continue;
      var acc = 0;
      for(var j=0;j<keys.length;j++){
        var v = (byMonth[keys[j]]||[])[i] || 0;
        if(!v) continue;
        var p = v/tot[i]*100;
        ctx.fillStyle = palette[j % palette.length];
        var yTop = y(acc+p), yBot = y(acc);
        ctx.fillRect(L + slot*i + gap/2, yTop, bw, yBot-yTop);
        acc += p;
      }
    }

    ctx.fillStyle = "#5C6857"; ctx.textAlign = "center";
    D.months.forEach(function(m,i){
      ctx.fillText(m.replace("月",""), L + slot*i + slot/2, H-11);
    });
  }

  /* ---------- 折れ線グラフ ---------- */
  function lineChart(cv, series, unit, digits, floor, tick){
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height, L = 46, R = 10, T = 12, B = 30;
    ctx.clearRect(0,0,W,H);

    var max = 0, min = Infinity;
    series.forEach(function(s){ s.data.forEach(function(v){
      if(!v) return;
      if(v > max) max = v;
      if(v < min) min = v;
    }); });
    if(max <= 0) max = 1;
    if(min === Infinity) min = 0;

    var base = 0, step;
    if(floor !== undefined){
      /* 変動を読み取りやすくするため、下限を切り上げて拡大表示する */
      step = tick || 10;
      base = Math.max(floor, Math.floor(min/step)*step - step);
      max = Math.ceil(max/step)*step;
      if(max <= base) max = base + step;
    } else {
      step = Math.pow(10, Math.floor(Math.log(max)/Math.LN10));
      if(max/step < 2) step /= 2; else if(max/step > 5) step *= 2;
      max = Math.ceil(max/step)*step;
    }

    var n = D.months.length;
    var x = function(i){ return L + (W-L-R) * (i/(n-1)); };
    var y = function(v){ return H-B - (H-T-B) * ((v-base)/(max-base)); };

    ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
    for(var v = base; v <= max + 1e-9; v += step){
      ctx.strokeStyle = "#E8EDE3";
      ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(W-R, y(v)); ctx.stroke();
      ctx.fillStyle = "#5C6857";
      ctx.fillText(fmt(v, digits||0), L-6, y(v)+3.5);
    }
    ctx.textAlign = "center";
    D.months.forEach(function(m,i){ ctx.fillText(m.replace("月",""), x(i), H-11); });

    series.forEach(function(s){
      ctx.strokeStyle = s.color; ctx.lineWidth = s.thick ? 3.2 : 2;
      ctx.beginPath();
      var on = false;
      s.data.forEach(function(v,i){
        if(!v) return;
        if(!on){ ctx.moveTo(x(i), y(v)); on = true; } else ctx.lineTo(x(i), y(v));
      });
      ctx.stroke();
      if(s.thick){
        ctx.fillStyle = s.color;
        s.data.forEach(function(v,i){
          if(!v) return;
          ctx.beginPath(); ctx.arc(x(i), y(v), 3.6, 0, 7); ctx.fill();
        });
      }
    });
  }

  function chartCard(title, field, opt){
    opt = opt || {};
    var series = seasons.map(function(s,i){
      return {
        name: s.label,
        data: (s.houses[cur] || {})[field] || [],
        color: YEAR_COLORS[i % YEAR_COLORS.length],
        thick: i === seasons.length-1
      };
    }).filter(function(s){ return sum(s.data) > 0; });

    if(!series.length) return "";

    var id = "cv_" + field;
    var legend = series.map(function(s){
      return '<span><i style="background:'+s.color+
             ';height:'+(opt.bar?10:(s.thick?4:3))+'px"></i>'+s.name+'</span>';
    }).join("");

    setTimeout(function(){
      var cv = document.getElementById(id);
      if(!cv) return;
      if(opt.bar) barChart(cv, series);
      else lineChart(cv, series, "", opt.digits, opt.floor, opt.tick);
    }, 0);

    return '<div class="card"><h2>'+title+'</h2><div class="body">' +
           '<canvas id="'+id+'" width="660" height="330"></canvas>' +
           '<div class="legend">'+legend+'</div>' +
           (opt.note ? '<p class="note">'+opt.note+'</p>' : '') +
           '</div></div>';
  }

  /* ---------- 構成比の推移カード ---------- */
  /* 隣り合う区分ほど色相を離し、スマホでも見分けられるようにする */
  var SIZE_PALETTE  = ["#8E2F8E","#3F5BC4","#2E9BD6","#3FA857",
                       "#B7C233","#E8A33D","#DB6A2B","#B32424"];
  var GRADE_PALETTE = ["#2E9BD6","#3FA857","#E8A33D","#C62828"];
  var stackYear = null;

  function stackCard(title, key, keys, palette, labelFn){
    var yr = stackYear || latestWithData().label;
    var season = seasons.filter(function(s){ return s.label === yr; })[0] || last;
    var h = season.houses[cur];

    /* 古い data.js には月別内訳が入っていない */
    if(!h || !h[key]){
      return '<div class="card"><h2>'+title+'</h2><div class="body">' +
             '<p style="margin:0;font-size:14px">月別の内訳がデータに含まれていません。</p>' +
             '<p class="note">PCで書き出しをやり直し、新しい data.js に' +
             '差し替えてください。</p></div></div>';
    }

    var byMonth = h[key];
    var any = keys.some(function(k){ return sum(byMonth[k]||[]) > 0; });

    var picker = seasons.map(function(s){
      var on = s.label === yr;
      return '<button data-year="'+s.label+'"'+(on?' class="sel"':'')+'>'+s.label+'</button>';
    }).join("");

    if(!any){
      return '<div class="card"><h2>'+title+'</h2>' +
             '<div class="pick">'+picker+'</div>' +
             '<div class="body" style="padding-top:0"><p style="margin:0;font-size:14px">' +
             yr+'は記録がありません。</p></div></div>';
    }

    var id = "cv_" + key;
    setTimeout(function(){
      var cv = document.getElementById(id);
      if(cv) stackChart(cv, keys, byMonth, keys, palette);
    }, 0);

    var legend = keys.map(function(k,i){
      return '<span><i style="background:'+palette[i%palette.length]+';height:10px"></i>' +
             labelFn(k) + '</span>';
    }).join("");

    /* 月ごとの比率を数値でも見られるようにする */
    var n = D.months.length;
    var tot = [];
    for(var i=0;i<n;i++){
      var t = 0;
      keys.forEach(function(k){ t += (byMonth[k]||[])[i] || 0; });
      tot.push(t);
    }
    var head = '<tr><th></th>' + D.months.map(function(m){
      return '<th>'+m.replace("月","")+'</th>'; }).join("") + '</tr>';
    var body = keys.map(function(k,ki){
      var best = 0;
      for(var i=0;i<n;i++){
        var p = tot[i] ? ((byMonth[k]||[])[i]||0)/tot[i]*100 : 0;
        if(p > best) best = p;
      }
      var cells = "";
      for(var i=0;i<n;i++){
        var p = tot[i] ? ((byMonth[k]||[])[i]||0)/tot[i]*100 : 0;
        cells += '<td'+(p>0 && p===best?' class="hi"':'')+'>' +
                 (tot[i] ? fmt(p,1) : "") + '</td>';
      }
      return '<tr><td><span class="swatch" style="background:' +
             palette[ki%palette.length]+'"></span>'+labelFn(k)+'</td>'+cells+'</tr>';
    }).join("");

    return '<div class="card"><h2>'+title+'</h2>' +
           '<div class="pick">'+picker+'</div>' +
           '<div class="body" style="padding-top:0">' +
           '<canvas id="'+id+'" width="660" height="300"></canvas>' +
           '<div class="legend">'+legend+'</div>' +
           '<div class="scroll" style="margin-top:14px"><table class="pct">' +
           head + body + '</table></div>' +
           '<p class="note">単位 %。各区分でもっとも高い月に色を付けています。</p>' +
           '</div></div>';
  }

  /* ---------- 円グラフ ---------- */
  /* items は {name, value, color} の配列。値の大きさに応じて扇形を描く。 */
  function pieChart(cv, items){
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);

    var tot = items.reduce(function(a,it){ return a + it.value; }, 0);
    if(tot <= 0) return;

    var cx = W/2, cy = H/2;                    /* 円の中心 */
    var r  = Math.min(W,H)/2 - 26;             /* 半径。端に余白を残す */
    var a  = -Math.PI/2;                       /* 12時の位置から時計回りに描き始める */

    /* 1周目: 扇形を塗る */
    items.forEach(function(it){
      if(it.value <= 0) return;
      var ang = it.value / tot * Math.PI * 2;  /* 割合を角度（ラジアン）に換算 */
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a, a + ang);
      ctx.closePath();
      ctx.fillStyle = it.color;
      ctx.fill();
      ctx.strokeStyle = "#FFFFFF";             /* 白い線で区切ると境目が分かりやすい */
      ctx.lineWidth = 3;
      ctx.stroke();
      a += ang;
    });

    /* 2周目: 面積の広い区分だけ、扇形の中に名前と割合を書く
       （狭い扇形に書くとはみ出して読めないため、下の表にゆずる） */
    a = -Math.PI/2;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    items.forEach(function(it){
      if(it.value <= 0) return;
      var ang = it.value / tot * Math.PI * 2;
      var p = it.value / tot * 100;
      if(p >= 7){
        var mid = a + ang/2;                   /* 扇形の中央の向き */
        var lx = cx + Math.cos(mid) * r * 0.62;
        var ly = cy + Math.sin(mid) * r * 0.62;
        ctx.fillStyle = onColor(it.color);
        ctx.font = "bold 25px sans-serif";
        ctx.fillText(it.name, lx, ly - 14);
        ctx.font = "bold 23px monospace";
        ctx.fillText(fmt(p,1) + "%", lx, ly + 14);
      }
      a += ang;
    });
  }

  /* ---------- 年間の構成（円グラフ＋数値の表） ---------- */
  function pieCard(title, key, keys, palette, labelFn){
    var season = latestWithData();
    var h = season.houses[cur];
    if(!h) return "";
    var obj = h[key] || {};
    var tot = keys.reduce(function(a,k){ return a + (obj[k]||0); }, 0);
    if(!tot) return "";

    /* 前年の同じ区分。割合を並べて比べられるようにする */
    var pi = seasons.indexOf(season) - 1;
    var pseason = pi >= 0 ? seasons[pi] : null;
    var pobj = pseason && pseason.houses[cur] ? (pseason.houses[cur][key] || {}) : null;
    var ptot = pobj ? keys.reduce(function(a,k){ return a + (pobj[k]||0); }, 0) : 0;

    /* 色は月別の積み上げグラフと同じ並びを使う。
       ページ全体で「同じ区分＝同じ色」になり、見比べやすい。 */
    var items = keys.map(function(k,i){
      return { name: labelFn(k), value: obj[k] || 0, color: palette[i % palette.length] };
    });

    var id = "pie_" + key;
    setTimeout(function(){
      var cv = document.getElementById(id);
      if(cv) pieChart(cv, items);
    }, 0);

    var rows = items.map(function(it,i){
      var pct  = it.value / tot * 100;
      var ppct = ptot ? (pobj[keys[i]]||0) / ptot * 100 : null;
      return '<tr><td><span class="swatch" style="background:'+it.color+'"></span>' +
             it.name + '</td>' +
             '<td>'+fmt(pct,1)+'%</td>' +
             '<td class="n">'+(ppct === null ? "" : fmt(ppct,1)+"%")+'</td>' +
             '<td class="n">'+fmt(it.value)+'</td></tr>';
    }).join("");

    return '<div class="card"><h2>'+title+'</h2><div class="body">' +
           '<canvas id="'+id+'" width="660" height="470"></canvas>' +
           '<table style="margin-top:12px">' +
           '<tr><th>区分</th><th>割合</th><th>前年</th><th>個数</th></tr>' +
           rows + '</table>' +
           '<p class="note">割合は個数にもとづく数値です。' +
           '円の中には7%以上の区分だけ表示しています。</p>' +
           '</div></div>';
  }

  /* ---------- 月別表 ---------- */
  function monthTable(){
    var h = last.houses[cur];
    var ph = prev ? prev.houses[cur] : null;
    var season = last;
    if(!h || !sum(h.kg)){
      season = latestWithData();
      var k = seasons.indexOf(season);
      h = season.houses[cur];
      ph = k > 0 ? seasons[k-1].houses[cur] : null;
      if(!h || !sum(h.kg)) return "";
    }

    var rows = D.months.map(function(m,i){
      var v = h.kg[i], pv = ph ? ph.kg[i] : 0;
      var r = (pv && v) ? (v/pv*100) : null;
      var cls = r === null ? "flat" : (r >= 102 ? "up" : (r <= 98 ? "down" : "flat"));
      return '<tr><td>'+m+'</td>' +
             '<td>'+(v?fmt(v):"")+'</td>' +
             '<td>'+(h.kg10a[i]?fmt(h.kg10a[i]):"")+'</td>' +
             '<td class="'+cls+'">'+(r===null?"":fmt(r,0)+"%")+'</td>' +
             '<td class="n">'+(h.count[i]?fmt(h.count[i]):"")+'</td>' +
             '<td>'+(h.gpf[i]?fmt(h.gpf[i],1):"")+'</td></tr>';
    }).join("");

    var tot = sum(h.kg), ptot = ph ? sum(ph.kg) : 0;
    var tr = ptot ? fmt(tot/ptot*100,0)+"%" : "";
    var cnt = sum(h.count);
    var avg = cnt ? sum(h.kg)*1000/cnt : 0;

    return '<div class="card"><h2>月別の収量（'+season.label+'）</h2>' +
           '<div class="scroll"><table>' +
           '<tr><th>月</th><th>収量<br>kg</th><th>10a換算<br>kg</th>' +
           '<th>前年比</th><th>個数</th><th>平均果重<br>g</th></tr>' +
           rows +
           '<tr class="sum"><td>合計</td><td>'+fmt(tot)+'</td>' +
           '<td>'+fmt(sum(h.kg10a))+'</td><td>'+tr+'</td>' +
           '<td class="n">'+fmt(cnt)+'</td><td>'+fmt(avg,1)+'</td></tr>' +
           '</table></div>' +
           '<p class="note only-narrow" style="padding:0 12px 12px">' +
           '横にスクロールできます</p></div>';
  }

  /* ---------- 見出しの数字 ---------- */
  function summary(){
    var h = last.houses[cur];
    var ph = prev ? prev.houses[cur] : null;
    if(!h) return "";
    var kg = sum(h.kg), pkg = ph ? sum(ph.kg) : 0;
    var per = sum(h.kg10a), pper = ph ? sum(ph.kg10a) : 0;
    var g = h.gpf.filter(function(v){ return v; });
    var pg = ph ? ph.gpf.filter(function(v){ return v; }) : [];
    var avg = g.length ? sum(g)/g.length : 0;
    var pavg = pg.length ? sum(pg)/pg.length : 0;

    if(!kg) return '<div class="card"><div class="empty">' +
      last.label + 'はまだ記録がありません</div></div>';

    return '<div class="card"><div class="big">' +
      '<div><div class="lab">収量</div><div class="val">'+fmt(kg/1000,1)+
        '<span class="un">t</span></div>'+ratioTag(kg,pkg)+'</div>' +
      '<div><div class="lab">10aあたり</div><div class="val">'+fmt(per)+
        '<span class="un">kg</span></div>'+ratioTag(per,pper)+'</div>' +
      '<div><div class="lab">平均果重</div><div class="val">'+fmt(avg,1)+
        '<span class="un">g</span></div>'+ratioTag(avg,pavg)+'</div>' +
      '</div></div>';
  }

  function render(){
    var area = (last.houses[cur] || {}).area;
    host.innerHTML =
      summary() +
      chartCard("月別の収量（kg）", "kg", {bar:true}) +
      chartCard("10aあたりの収量（kg）", "kg10a", {bar:true}) +
      chartCard("一果実あたりの重量（g）", "gpf",
                {floor:100, tick:10, digits:0,
                 note:"変化を見やすくするため、縦軸は100gから始めています。"}) +
      monthTable() +
      stackCard("等級の構成の推移", "gradesByMonth", D.grades, GRADE_PALETTE,
                function(k){ return k; }) +
      stackCard("サイズの構成の推移", "sizesByMonth", D.sizes, SIZE_PALETTE,
                function(k){ return D.sizeLabel[k] || k; }) +
      pieCard("サイズの構成（"+latestWithData().label+" 年間）", "sizes", D.sizes, SIZE_PALETTE,
              function(k){ return D.sizeLabel[k] || k; }) +
      pieCard("等級の構成（"+latestWithData().label+" 年間）", "grades", D.grades, GRADE_PALETTE,
              function(k){ return k; }) +
      (area ? '<footer style="padding-top:4px">'+cur+'　'+fmt(area*10,0)+'a</footer>' : "");

    /* 構成比の年度切り替え */
    var picks = document.querySelectorAll ? document.querySelectorAll("[data-year]") : [];
    Array.prototype.forEach.call(picks, function(b){
      b.addEventListener("click", function(){
        stackYear = b.getAttribute("data-year");
        render();
        window.scrollTo(0, b.getBoundingClientRect().top + window.pageYOffset - 120);
      });
    });
  }

  render();

  if(!host.innerHTML){
    host.innerHTML = '<div class="card"><div class="body">' +
      '描画結果が空でした。</div></div>';
  }
 }catch(err){
  var h = document.getElementById("main");
  if(h){
    h.innerHTML = '<div class="card"><h2>表示できません</h2><div class="body">' +
      '<div style="font-size:13px;white-space:pre-wrap;word-break:break-all">' +
      (err && err.message ? err.message : String(err)) + '</div></div></div>';
  }
 }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A4A6B">
<title>重油の記録｜ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23EE5340'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
/* ============================================================
   色の設定。夜温設定（yaon.html）と同じ考え方でそろえている。
   :root にふつうの色、暗い画面のときの色を下の2か所で上書きする。
   ============================================================ */
:root{
  --ground:#F2F6F0; --card:#FFFFFF; --card-sub:#F7FAF6;
  --ink:#24291F; --muted:#6D7768; --line:#DFE7DB; --line-soft:#EDF2EA;
  --tomato:#EE5340; --leaf:#4E9A5A; --night:#2A4A6B; --night-soft:#E6EDF5;
  --warn:#B8461F; --warn-soft:#FBEAE2;
  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --r-card:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --tomato:#FF6E5B; --leaf:#6FBB7B; --night:#8FB4DE; --night-soft:#25303B;
    --warn:#FF9A73; --warn-soft:#3A2820;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --tomato:#FF6E5B; --leaf:#6FBB7B; --night:#8FB4DE; --night-soft:#25303B;
  --warn:#FF9A73; --warn-soft:#3A2820;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Zen Maru Gothic",
              "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
[hidden]{display:none !important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 70px}
.num{font-variant-numeric:tabular-nums}
header{padding:24px 0 6px;text-align:center}
h1{font-size:25px;font-weight:800;margin:0;letter-spacing:.02em}
.farm{display:block;margin-top:4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-card);
  padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:800;color:var(--muted);margin:0 0 10px;letter-spacing:.08em}

/* ハウスの切りかえ */
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:50px;border-radius:16px;cursor:pointer;
  border:2px solid var(--line);background:var(--card-sub);color:var(--muted);
  font:inherit;font-size:18px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}

/* 週の切りかえ */
.weeknav{display:flex;align-items:center;gap:8px;margin-top:12px}
.weeknav button{min-width:64px;min-height:50px;border-radius:16px;cursor:pointer;
  border:2px solid var(--line);background:var(--card-sub);color:var(--ink);font:inherit;font-size:15px;font-weight:800}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav .wk{flex:1;text-align:center;font-weight:800;font-size:17px;line-height:1.35}
.weeknav .wk small{display:block;font-size:12px;color:var(--muted);font-weight:700}

/* 入力欄 */
.row{display:flex;gap:10px;margin-top:10px}
.f{flex:1;min-width:0}
.f label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:2px}
.f .box{display:flex;align-items:center;border:2px solid var(--line);border-radius:14px;
  background:var(--card-sub);padding:0 10px}
.f .box:focus-within{border-color:var(--night)}
.f input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
  font:inherit;font-size:22px;font-weight:800;padding:8px 0;outline:none;font-variant-numeric:tabular-nums}
.f .u{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.toggle{margin-top:12px;width:100%;min-height:46px;border-radius:14px;cursor:pointer;
  border:2px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:800}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--night);color:var(--night);background:var(--night-soft)}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.calc{margin-top:12px;padding:12px;border-radius:14px;background:var(--night-soft)}
.calc .big{font-size:26px;font-weight:800}
.calc .big small{font-size:14px;color:var(--muted);font-weight:700}
.calc .sub{font-size:13px;color:var(--muted)}
.eqname{font-weight:800;margin:14px 0 0}
.eqname:first-of-type{margin-top:0}

/* 送る */
.send{display:block;width:100%;min-height:58px;margin-top:16px;border:0;border-radius:18px;cursor:pointer;
  background:var(--tomato);color:#fff;font:inherit;font-size:19px;font-weight:800}
.send:disabled{opacity:.55;cursor:default}
.msg{margin:10px 0 0;font-size:14px}
.ng{color:var(--warn);font-weight:700}
.ok{color:var(--leaf);font-weight:700}

/* 最近の記録 */
.hist{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line-soft)}
.hist li:first-child{border-top:0}
.hist button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 4px;
  font:inherit;color:var(--ink);cursor:pointer}
.hist b{font-size:15px}
.hist span{display:block;font-size:13px;color:var(--muted)}
.hist button[aria-current="true"] b{color:var(--night)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>重油の記録</h1>
    <span class="farm">ハッピートマトファーム</span>
  </header>

  <section class="card">
    <h2>どのハウスの、どの週か</h2>
    <div class="seg" id="houseBtns">
      <button type="button" data-house="中央">中央</button>
      <button type="button" data-house="東">東</button>
    </div>
    <div class="weeknav">
      <button type="button" id="prevWk" aria-label="前の週">◀ 前</button>
      <div class="wk num" id="wkLabel"></div>
      <button type="button" id="nextWk" aria-label="次の週">次 ▶</button>
    </div>
    <p class="hint">測った日を含む週（月〜日）が出ています。栽培記録のこの週に入ります。</p>
  </section>

  <section class="card">
    <h2>重油</h2>
    <div class="row">
      <div class="f">
        <label for="cm1" id="cm1Label">メモリが下がった長さ</label>
        <div class="box"><input id="cm1" type="text" inputmode="decimal" autocomplete="off"><span class="u">cm</span></div>
      </div>
    </div>
    <button type="button" class="toggle" id="kyuyu" aria-pressed="false">＋ 給油をはさんだ（2回に分けて入れる）</button>
    <div class="row" id="cm2Row" hidden>
      <div class="f">
        <label for="cm2">② 給油のあとに下がった長さ</label>
        <div class="box"><input id="cm2" type="text" inputmode="decimal" autocomplete="off"><span class="u">cm</span></div>
      </div>
    </div>
    <div class="row">
      <div class="f">
        <label for="price">単価</label>
        <div class="box"><input id="price" type="text" inputmode="decimal" autocomplete="off"><span class="u">円/L</span></div>
      </div>
    </div>
    <p class="hint" id="priceHint"></p>
    <div class="calc">
      <div class="big num" id="liters"></div>
      <div class="sub num" id="litersHow"></div>
    </div>
  </section>

  <section class="card">
    <h2>機器の稼働（この週の分）</h2>
    <p class="eqname">加温機（HK）</p>
    <div class="row">
      <div class="f">
        <label for="hkH">稼働時間</label>
        <div class="box"><input id="hkH" type="text" inputmode="decimal" autocomplete="off"><span class="u">時間</span></div>
      </div>
      <div class="f">
        <label for="hkN">稼働回数</label>
        <div class="box"><input id="hkN" type="text" inputmode="numeric" autocomplete="off"><span class="u">回</span></div>
      </div>
    </div>
    <p class="eqname">グロウ</p>
    <div class="row">
      <div class="f">
        <label for="glowH">稼働時間</label>
        <div class="box"><input id="glowH" type="text" inputmode="decimal" autocomplete="off"><span class="u">時間</span></div>
      </div>
      <div class="f">
        <label for="glowN">稼働回数</label>
        <div class="box"><input id="glowN" type="text" inputmode="numeric" autocomplete="off"><span class="u">回</span></div>
      </div>
    </div>
  </section>

  <button type="button" class="send" id="send">この週の記録を送る</button>
  <p class="msg" id="msg"></p>

  <section class="card">
    <h2>最近の記録（<span id="histHouse"></span>）</h2>
    <ul class="hist" id="hist"></ul>
    <p class="hint">押すと、その週を開きます。栽培記録アプリ（PC）は、開いたときにここの記録を読み込みます。</p>
  </section>
</div>

<script>
"use strict";
/* ============================================================
   重油の記録
   - 週×ハウスで1件。スプレッドシートの juyu シートに入れる（同じ週・ハウスは上書き）
   - L（リットル）は「下がった長さ × 1cmあたりの量」。量はハウスごとの値（ユーザー回答 2026-11-05）
   - 栽培記録アプリ（PC）は、開いたときに juyu シートを読み、週の記録に入れる
   ============================================================ */
const API = "https://script.google.com/macros/s/AKfycbzYkVlVngoC6CXf9HKPlfnFbJHs5lrarw2J9dLjdqaqvdVQFIN15aMr5EyNSA8tj1UU/exec";
const L_PER_CM = { "中央": 33.2, "東": 11.1 };   // タンクのメモリ1cmあたりの重油の量（L）
const FIELDS = ["cm1", "cm2", "price", "hkH", "hkN", "glowH", "glowN"];
const $ = id => document.getElementById(id);

/* ---- 日付の道具（端末の時刻で、時刻は使わず日付だけ扱う） ---- */
const ymd = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = d => addDays(d, -((d.getDay() + 6) % 7));     // その日を含む週の月曜
const md = d => (d.getMonth() + 1) + "/" + d.getDate();
const fromYmd = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };

/* ---- 数の読み取り。全角も受け付ける。空は ""、読めないものは null ---- */
function readNum(s) {
  const t = String(s || "").replace(/[０-９．，]/g, c => c === "．" ? "." : c === "，" ? "," : String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s,]/g, "");
  if (!t) return "";
  if (!/^\d+(\.\d*)?$|^\.\d+$/.test(t)) return null;
  return Number(t);
}
const fmt = (v, d) => v.toLocaleString("ja-JP", { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---- 状態 ---- */
const THIS_MON = monday(new Date());
let house = "中央";
try { if (L_PER_CM[localStorage.getItem("htf_juyu_house")]) house = localStorage.getItem("htf_juyu_house"); } catch (e) { /* 覚えられない端末でも動く */ }
let week = THIS_MON;
let REC = { state: "idle", rows: {}, error: "" };      // rows は「週|ハウス」→ 記録
let form = { key: "", edited: false, sending: false, msg: "", ng: false, kyuyu: false };

const keyOf = () => ymd(week) + "|" + house;

/* 単価の初期値：この端末で前に送ったもの → シートでいちばん新しい記録の単価 */
function lastPrice() {
  const rows = Object.values(REC.rows).filter(r => String(r.price) !== "").sort((a, b) => Number(b.at) - Number(a.at));
  return rows.length ? String(rows[0].price) : "";
}

/* 入力欄に値を入れるのは、週かハウスが変わったときだけ（打ちかけを書き換えないため） */
function fillForm() {
  const saved = REC.rows[keyOf()];
  FIELDS.forEach(f => { $(f).value = saved ? String(saved[f] ?? "") : ""; });
  if (!saved) $("price").value = lastPrice();
  form = { key: keyOf(), edited: false, sending: false, msg: "", ng: false,
           kyuyu: !!(saved && String(saved.cm2 ?? "") !== "") };
}

function readForm() {
  const v = {};
  for (const f of FIELDS) v[f] = readNum($(f).value);
  if (!form.kyuyu) v.cm2 = "";
  return v;
}

/* ---- 画面を描く ---- */
function render() {
  document.querySelectorAll("#houseBtns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.house === house)));
  const sun = addDays(week, 6);
  const diff = Math.round((THIS_MON - week) / 864e5 / 7);
  $("wkLabel").innerHTML = md(week) + "〜" + md(sun) + "<small>" +
    (diff === 0 ? "今週" : diff === 1 ? "先週" : diff + "週まえ") + "（月〜日）</small>";
  $("nextWk").disabled = week >= THIS_MON;

  // 読み込み中は打てないようにする（読み終えたときに入力欄を入れ直すため、打った数が消えてしまう）
  FIELDS.forEach(f => { $(f).disabled = REC.state === "loading"; });
  if (form.key !== keyOf() && REC.state !== "loading") fillForm();

  $("kyuyu").setAttribute("aria-pressed", String(form.kyuyu));
  $("kyuyu").textContent = form.kyuyu ? "給油をはさんだ（押すと1回分に戻す）" : "＋ 給油をはさんだ（2回に分けて入れる）";
  $("cm2Row").hidden = !form.kyuyu;
  $("cm1Label").textContent = form.kyuyu ? "① 給油の前までに下がった長さ" : "メモリが下がった長さ";

  // 重油の量と金額
  const v = readForm(), per = L_PER_CM[house];
  const bad = FIELDS.filter(f => v[f] === null);
  const cm = (v.cm1 || 0) + (v.cm2 || 0);
  if (bad.length) {
    $("liters").textContent = "—";
    $("litersHow").textContent = "数として読めない欄があります（数字と小数点だけで入れてください）。";
  } else if (v.cm1 === "" && v.cm2 === "") {
    $("liters").innerHTML = "— <small>L</small>";
    $("litersHow").textContent = house + "は 1cm あたり " + per + " L で計算します。";
  } else {
    const L = cm * per;
    $("liters").innerHTML = fmt(L, 1) + " <small>L</small>" +
      (v.price !== "" ? "　" + fmt(Math.round(L * v.price), 0) + " <small>円</small>" : "");
    $("litersHow").textContent = (form.kyuyu ? "(" + fmt(v.cm1 || 0, 1) + "＋" + fmt(v.cm2 || 0, 1) + ") cm" : fmt(cm, 1) + " cm") +
      " × " + per + " L" + (v.price !== "" ? " × " + v.price + " 円/L" : "");
  }
  const saved = REC.rows[keyOf()];
  $("priceHint").textContent = !saved && $("price").value && !form.edited ? "前に入れた単価を入れてあります。変わったときだけ直してください。" : "";

  // 送るボタンと知らせ
  $("send").disabled = form.sending || REC.state === "loading";
  $("send").textContent = form.sending ? "送っています…" : saved ? "直した内容で送り直す" : "この週の記録を送る";
  const status = REC.state === "loading" ? "記録を読んでいます…"
    : REC.state === "error" ? REC.error
    : saved ? "この週は記録済みです（" + when(saved.at) + " に記録）。直して送ると上書きします。"
    : "この週はまだ記録していません。";
  $("msg").textContent = form.msg || status;
  $("msg").className = "msg " + ((form.msg ? form.ng : REC.state === "error") ? "ng" : form.msg ? "ok" : "");

  renderHist();
}

const when = at => { const d = new Date(Number(at)); return md(d) + " " + d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); };

function renderHist() {
  $("histHouse").textContent = house;
  const rows = Object.values(REC.rows).filter(r => r.house === house).sort((a, b) => a.week < b.week ? 1 : -1).slice(0, 10);
  if (!rows.length) {
    $("hist").innerHTML = '<li><span>' + (REC.state === "ok" ? "まだ記録がありません。" : "") + "</span></li>";
    return;
  }
  const per = L_PER_CM[house];
  const n = x => String(x ?? "") === "" ? null : Number(x);
  $("hist").innerHTML = rows.map(r => {
    const cm = (n(r.cm1) || 0) + (n(r.cm2) || 0);
    const hasCm = n(r.cm1) !== null || n(r.cm2) !== null;
    const eq = (name, h, c) => (n(h) === null && n(c) === null) ? "" : "・" + name + " " + (n(h) ?? "—") + "h " + (n(c) ?? "—") + "回";
    const w = fromYmd(r.week);
    return '<li><button type="button" data-week="' + r.week + '"' + (r.week === ymd(week) ? ' aria-current="true"' : "") + '>' +
      "<b>" + md(w) + "〜" + md(addDays(w, 6)) + "　" + (hasCm ? fmt(cm * per, 1) + " L" : "重油なし") +
      (n(r.price) !== null ? "・" + r.price + " 円/L" : "") + "</b>" +
      "<span>" + (hasCm ? (n(r.cm2) !== null ? r.cm1 + "＋" + r.cm2 : cm) + " cm" : "") + eq("加温機", r.hkH, r.hkN) + eq("グロウ", r.glowH, r.glowN) + "</span>" +
      "</button></li>";
  }).join("");
}

/* ---- 読み込み・送信 ---- */
function load() {
  REC = { state: "loading", rows: {}, error: "" };
  render();
  fetch(API + "?want=juyu")
    .then(res => { if (!res.ok) throw new Error("記録を読めませんでした（応答 " + res.status + "）"); return res.json(); })
    .then(j => {
      if (!j.ok || !Array.isArray(j.juyu)) {
        throw new Error("記録を読めませんでした（" + (j.error || "スプレッドシート側の Apps Script がまだ新しくなっていないようです") + "）");
      }
      REC = { state: "ok", rows: Object.fromEntries(j.juyu.map(x => [x.id, x])), error: "" };
    })
    .catch(e => { REC = { state: "error", rows: {}, error: e.message || String(e) }; })
    .then(() => { form.key = ""; render(); });   // 読めた記録で入力欄を入れ直す（読み込み中は打てない）
}

function send() {
  const v = readForm();
  const bad = FIELDS.filter(f => v[f] === null);
  if (bad.length) { form = { ...form, msg: "数として読めない欄があります。数字と小数点だけで入れてください。", ng: true }; render(); return; }
  if (FIELDS.every(f => v[f] === "")) { form = { ...form, msg: "どの欄も空です。入れてから送ってください。", ng: true }; render(); return; }
  if (form.kyuyu && v.cm2 === "") { form = { ...form, msg: "給油のあとに下がった長さ（②）が空です。給油をはさまなかったときは、ボタンを押して1回分に戻してください。", ng: true }; render(); return; }
  const key = keyOf();
  const item = { week: ymd(week), house, ...Object.fromEntries(FIELDS.map(f => [f, v[f] === "" ? "" : String(v[f])])) };
  form = { ...form, sending: true, msg: "", ng: false };
  render();
  const once = () => fetch(API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "saveJuyu", item }),
    })
    .then(res => { if (!res.ok) throw new Error("応答 " + res.status); return res.json(); })
    .then(j => { if (!j.ok || !j.item) throw new Error(j.error || "保存できませんでした"); return j.item; });
  // 同じ週・ハウスは上書きなので、つながらなかったときに1回だけ送り直しても二重にならない
  once()
    .catch(() => new Promise(res => setTimeout(res, 2500)).then(once))
    .then(saved => {
      REC = { ...REC, rows: { ...REC.rows, [saved.id]: saved } };
      if (form.key === key) form = { ...form, sending: false, edited: false, ng: false, msg: "送りました。PC で栽培記録アプリを開くと、この週に入ります。" };
    })
    .catch(e => {
      if (form.key === key) form = { ...form, sending: false, ng: true,
        msg: "送れませんでした（" + (e.message || e) + "）。入れた数はそのまま残っています。少し待ってからもう一度押してください。" };
    })
    .then(render);
}

/* 打ちかけのまま週やハウスを変えるときは、たしかめる */
function canLeave() {
  return !form.edited || form.sending || confirm("送っていない入力があります。消えてもよいですか？");
}

/* ---- 操作 ---- */
$("houseBtns").addEventListener("click", e => {
  const b = e.target.closest("button[data-house]");
  if (!b || b.dataset.house === house || !canLeave()) return;
  house = b.dataset.house;
  try { localStorage.setItem("htf_juyu_house", house); } catch (err) { /* 覚えられなくても動く */ }
  render();
});
$("prevWk").addEventListener("click", () => { if (canLeave()) { week = addDays(week, -7); render(); } });
$("nextWk").addEventListener("click", () => { if (week < THIS_MON && canLeave()) { week = addDays(week, 7); render(); } });
$("hist").addEventListener("click", e => {
  const b = e.target.closest("button[data-week]");
  if (!b || !canLeave()) return;
  week = fromYmd(b.dataset.week);
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
});
$("kyuyu").addEventListener("click", () => { form = { ...form, kyuyu: !form.kyuyu, edited: true, msg: "" }; render(); });
FIELDS.forEach(f => $(f).addEventListener("input", () => { form = { ...form, edited: true, msg: "" }; render(); }));
$("send").addEventListener("click", send);

load();
</script>
</body>
</html>

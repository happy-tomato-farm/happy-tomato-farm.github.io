<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EE5340">
<title>みんなのページ｜ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23EE5340'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#F2F6F0;
  --card:#FFFFFF;
  --card-sub:#F7FAF6;
  --ink:#24291F;
  --muted:#6D7768;
  --line:#DFE7DB;
  --line-soft:#EDF2EA;

  --tomato:#EE5340;
  --leaf:#4E9A5A;
  --grape:#8A5CC4;
  --sun:#D9960F;
  --teal:#2A8FA8;

  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --shadow-lift:0 2px 0 rgba(36,41,31,.05), 0 16px 32px -14px rgba(36,41,31,.4);

  --r-card:22px;
  --r-chip:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --tomato:#FF6E5B; --leaf:#6FBB7B; --grape:#B189E8; --sun:#F0BC4E; --teal:#5FBDD4;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --tomato:#FF6E5B; --leaf:#6FBB7B; --grape:#B189E8; --sun:#F0BC4E;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.85);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Zen Maru Gothic",
              "Quicksand","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",
              system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}

header{padding:30px 0 8px;text-align:center}
.logo{
  width:66px;height:66px;margin:0 auto 12px;display:block;
}
h1{font-size:27px;font-weight:800;margin:0;letter-spacing:.02em}
.farm{
  display:block;margin-top:6px;
  font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.1em;
}
.lead{
  margin:18px 0 26px;text-align:center;
  font-size:14.5px;color:var(--muted);font-weight:600;
}

/* ===== メニューのカード ===== */
.menu{display:flex;flex-direction:column;gap:14px}

a.app{
  display:flex;align-items:center;gap:15px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--r-card);
  padding:18px 18px;
  text-decoration:none;color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
a.app:hover{border-color:var(--c);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
a.app:active{transform:translateY(0) scale(.985)}
a.app:focus-visible{outline:3px solid var(--c);outline-offset:3px}

/* アイコンの丸。各アプリの色は --c で切り替える */
.app .icon{
  flex:none;width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;
  background:color-mix(in srgb, var(--c) 16%, var(--card));
  border:2px solid color-mix(in srgb, var(--c) 38%, transparent);
}
.app .icon svg{width:30px;height:30px;display:block}

.app .txt{flex:1;min-width:0}
.app .t{display:block;font-size:20px;font-weight:800;letter-spacing:.01em}
.app .d{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.5}

.app .arrow{
  flex:none;font-size:20px;font-weight:800;color:var(--c);
}

a.app.shift  {--c:var(--teal)}
a.app.note   {--c:var(--tomato)}
a.app.byogai {--c:var(--grape)}
a.app.jisseki{--c:var(--leaf)}

/* ===== ホーム画面に置くヒント ===== */
.hint{
  margin-top:34px;
  background:var(--card-sub);
  border:2px dashed var(--line);
  border-radius:var(--r-card);
  padding:18px 18px;
  font-size:13.5px;color:var(--muted);font-weight:600;
}
.hint b{color:var(--ink);display:block;margin-bottom:6px;font-size:14.5px}
.hint ol{margin:8px 0 0;padding-left:1.3em}
.hint li{margin-bottom:4px}
.hint .key{
  display:inline-block;background:var(--card);border:1px solid var(--line);
  border-radius:7px;padding:0 6px;font-weight:800;color:var(--ink);
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <!-- トマトのマーク（画像ファイルを使わず、その場で描いている） -->
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="38" r="22" fill="#EE5340"/>
      <path d="M32 20 L22 10 M32 20 L42 10 M32 20 L32 6"
            stroke="#4E9A5A" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>みんなのページ</h1>
    <span class="farm">ハッピートマトファーム</span>
  </header>

  <p class="lead">つかいたいものを えらんでください</p>

  <nav class="menu">

    <a class="app shift" href="../shift/">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2A8FA8" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3"/>
          <path d="M3 10h18M8 3v4M16 3v4"/>
          <path d="M12 13.5V16l1.8 1.1"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">シフト</span>
        <span class="d">じぶんの きんむ時間を たしかめる</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="app note" href="../note/">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#EE5340" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z"/>
          <path d="M8 8h7M8 12h7M8 16h4"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">みんなのノート</span>
        <span class="d">作業のやり方や 連絡ごと。だれでも書けます</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="app byogai" href="../byogai/">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8A5CC4" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4c3 0 5 2.4 5 5.5v4C17 17.5 14.8 20 12 20s-5-2.5-5-6.5v-4C7 6.4 9 4 12 4z"/>
          <path d="M12 8v12M7 10.5H3M7 15H3.5M17 10.5h4M17 15h3.5M9.5 5 8 2.8M14.5 5 16 2.8"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">病害虫の記録</span>
        <span class="d">見つけた病気や虫を 写真つきで残せます</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="app jisseki" href="../v-k7m2x9pq/">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4E9A5A" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3.5 20.5h17"/>
          <path d="M6.5 20.5v-7M12 20.5V5M17.5 20.5v-10"/>
        </svg>
      </span>
      <span class="txt">
        <span class="t">実績（共有用）</span>
        <span class="d">とれた量の グラフと表</span>
      </span>
      <span class="arrow">›</span>
    </a>

  </nav>

  <div class="hint">
    <b>スマホのホーム画面に置いておくと べんりです</b>
    <ol>
      <li>このページを Chrome で ひらく</li>
      <li>右上の <span class="key">⋮</span>（てん3つ）を おす</li>
      <li>「ホーム画面に追加」を えらぶ</li>
    </ol>
    つぎからは アイコンを おすだけで ひらけます。
  </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EE5340">
<title>みんなのノート｜ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23EE5340'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#F2F6F0;
  --card:#FFFFFF;
  --card-sub:#F7FAF6;
  --ink:#24291F;
  --muted:#6D7768;
  --line:#DFE7DB;
  --line-soft:#EDF2EA;

  --tomato:#EE5340;
  --leaf:#4E9A5A;

  --h-chuo:#4E9A5A;
  --h-higashi:#E0688A;
  --h-minami:#D9960F;
  --h-nishi:#DD6630;
  --h-all:#42566A;

  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --shadow-lift:0 2px 0 rgba(36,41,31,.05), 0 14px 30px -14px rgba(36,41,31,.36);

  --r-card:18px;
  --r-chip:999px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --tomato:#FF6E5B; --leaf:#6FBB7B;
    --h-chuo:#6FBB7B; --h-higashi:#FF9DB6; --h-minami:#F0BC4E;
    --h-nishi:#F58E5C; --h-all:#8FA9C2;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --tomato:#FF6E5B; --leaf:#6FBB7B;
  --h-chuo:#6FBB7B; --h-higashi:#FF9DB6; --h-minami:#F0BC4E;
  --h-nishi:#F58E5C; --h-all:#8FA9C2;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Zen Maru Gothic",
              "Quicksand","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",
              system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 130px}

header{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.head-in{max-width:1080px;margin:0 auto;padding:14px 16px 0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:.01em;text-wrap:balance}
.brand .farm{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.08em}

.filters{display:flex;flex-direction:column;gap:8px;padding:12px 0 12px}
.frow{display:flex;gap:7px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flabel{flex:none;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.12em;width:46px}

.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:var(--r-chip);padding:6px 13px;font-size:13.5px;font-weight:700;
  font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:border-color .15s, color .15s;
}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.chip[aria-pressed="true"]{color:var(--ink);border-color:currentColor}

.chip.house[data-house="中央"]{--c:var(--h-chuo)}
.chip.house[data-house="東"]{--c:var(--h-higashi)}
.chip.house[data-house="南"]{--c:var(--h-minami)}
.chip.house[data-house="西"]{--c:var(--h-nishi)}
.chip.house .dot{background:var(--c,var(--muted))}
.chip.house[aria-pressed="true"]{color:var(--c,var(--ink));box-shadow:inset 0 0 0 1px currentColor}

.chip.kindf[aria-pressed="true"]{
  background:color-mix(in srgb, var(--k,var(--muted)) 20%, var(--card));
  border-color:color-mix(in srgb, var(--k,var(--muted)) 45%, transparent);
  color:color-mix(in srgb, var(--k,var(--ink)) 68%, var(--ink));
}
.gear{
  flex:none;border:1.5px dashed var(--line);background:none;color:var(--muted);
  border-radius:var(--r-chip);padding:6px 12px;font-size:13px;font-weight:700;
  font-family:inherit;cursor:pointer;white-space:nowrap;
}
.gear:hover{border-color:var(--muted);color:var(--ink)}
.gear:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

.sec-head{display:flex;align-items:center;gap:9px;margin:26px 0 12px}
.sec-head h2{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:0}
.sec-head .rule{flex:1;height:1px;background:var(--line-soft)}
.count{
  font-size:11.5px;font-weight:800;color:var(--muted);
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-chip);padding:1px 9px;font-variant-numeric:tabular-nums;
}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow);padding:16px 17px 15px;position:relative;
  display:flex;flex-direction:column;gap:10px;
  animation:pop .34s cubic-bezier(.2,.9,.3,1.1) backwards;
}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.985)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}

.card.pinned{box-shadow:var(--shadow-lift);margin-top:7px}
.card.pinned::before{
  content:"";position:absolute;top:-9px;left:50%;
  width:78px;height:19px;transform:translateX(-50%) rotate(-2.2deg);
  background:color-mix(in srgb, var(--h-minami) 42%, transparent);
  border-left:2px dotted color-mix(in srgb, var(--h-minami) 55%, transparent);
  border-right:2px dotted color-mix(in srgb, var(--h-minami) 55%, transparent);
  border-radius:1px;
}

.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.houses{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.house-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--c)}
.house-tag .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.house-tag[data-house="中央"]{--c:var(--h-chuo)}
.house-tag[data-house="東"]{--c:var(--h-higashi)}
.house-tag[data-house="南"]{--c:var(--h-minami)}
.house-tag[data-house="西"]{--c:var(--h-nishi)}
.house-tag[data-house="ぜんぶ"]{--c:var(--h-all)}

.kind{
  display:inline-flex;align-items:center;
  font-size:11.5px;font-weight:800;letter-spacing:.06em;
  padding:2px 10px;border-radius:var(--r-chip);
  background:color-mix(in srgb, var(--k) 18%, var(--card));
  border:1.5px solid color-mix(in srgb, var(--k) 40%, transparent);
  color:color-mix(in srgb, var(--k) 66%, var(--ink));
}

.card h3{font-size:17.5px;font-weight:800;margin:0;line-height:1.5;text-wrap:balance}
.card p{margin:0;font-size:15px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.card .by{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  font-size:12px;color:var(--muted);font-weight:700;
  border-top:1px dashed var(--line);padding-top:9px;margin-top:2px;
}
.card .by time{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pinbtn{
  position:absolute;top:10px;right:10px;
  background:none;border:none;cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:800;color:var(--muted);
  border:1.5px solid var(--line);border-radius:var(--r-chip);padding:3px 9px;
}
.pinbtn:hover{color:var(--ink);border-color:var(--muted)}
.pinbtn:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.card.pinned .pinbtn{color:var(--h-minami);border-color:var(--h-minami)}

.replies{display:flex;flex-direction:column;gap:7px}
.reply{background:var(--card-sub);border:1px solid var(--line-soft);border-radius:12px 12px 12px 3px;padding:9px 12px}
.reply .who{font-size:11.5px;font-weight:800;color:var(--leaf);display:block}
.reply p{font-size:13.5px}
.answered{font-size:11px;font-weight:800;color:var(--leaf);letter-spacing:.08em}

.linkbtn{
  align-self:flex-start;background:none;border:none;font-family:inherit;
  color:var(--muted);font-size:12.5px;font-weight:800;cursor:pointer;
  padding:2px 0;border-bottom:1.5px dotted var(--muted);
}
.linkbtn:hover{color:var(--ink);border-bottom-color:var(--ink)}
.linkbtn:focus-visible{outline:3px solid var(--tomato);outline-offset:3px}

.empty{
  grid-column:1/-1;text-align:center;color:var(--muted);font-size:14.5px;font-weight:700;
  padding:44px 16px;border:2px dashed var(--line);border-radius:var(--r-card);
}

.fab{
  position:fixed;right:18px;bottom:18px;z-index:40;
  display:inline-flex;align-items:center;gap:9px;
  background:var(--tomato);color:#fff;border:none;border-radius:var(--r-chip);
  padding:15px 22px 15px 19px;
  font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.03em;cursor:pointer;
  box-shadow:0 6px 20px -6px rgba(238,83,64,.65), 0 2px 0 rgba(0,0,0,.06);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.2);
}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:translateY(0)}
.fab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fab:disabled{opacity:.55;cursor:progress}
.fab .plus{font-size:21px;line-height:1;margin-top:-2px}

dialog{border:none;padding:0;background:transparent;max-width:520px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(24,29,22,.5);backdrop-filter:blur(3px)}
.sheet{
  background:var(--card);color:var(--ink);border-radius:22px;border:1px solid var(--line);
  padding:22px 20px 20px;box-shadow:var(--shadow-lift);
  display:flex;flex-direction:column;gap:15px;max-height:86vh;overflow-y:auto;
}
.sheet h2{font-size:19px;font-weight:800;margin:0}
.sheet .hint{font-size:12.5px;color:var(--muted);margin:-8px 0 0}
.field{display:flex;flex-direction:column;gap:7px}
.field > span{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.1em}
input[type="text"],textarea{
  font-family:inherit;font-size:16px;color:var(--ink);background:var(--card-sub);
  border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;
}
textarea{min-height:96px;resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:3px solid var(--tomato);outline-offset:1px;border-color:var(--tomato)}
.picker{display:flex;gap:7px;flex-wrap:wrap}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:2px}
.btn{
  font-family:inherit;font-size:15px;font-weight:800;border-radius:var(--r-chip);
  padding:11px 20px;cursor:pointer;border:1.5px solid var(--line);
  background:var(--card);color:var(--muted);
}
.btn.primary{background:var(--tomato);color:#fff;border-color:var(--tomato)}
.btn:disabled{opacity:.55;cursor:progress}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.kindlist{display:flex;flex-direction:column;gap:8px}
.kindrow{display:flex;align-items:center;gap:9px;background:var(--card-sub);border:1px solid var(--line-soft);border-radius:13px;padding:9px 11px}
.kindrow .name{flex:1;font-size:15px;font-weight:700;min-width:0}
.kindrow .used{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;background:var(--k);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.sw:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.del{
  border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:var(--r-chip);padding:5px 12px;font-size:12.5px;font-weight:800;
  font-family:inherit;cursor:pointer;white-space:nowrap;
}
.del:not(:disabled):hover{color:var(--tomato);border-color:var(--tomato)}
.del:disabled{opacity:.4;cursor:not-allowed}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1}

/* カードに並ぶ写真 */
.shots{display:flex;gap:6px;flex-wrap:wrap}
.shots img{
  width:calc(33.333% - 4px);aspect-ratio:1;object-fit:cover;
  border-radius:11px;border:1px solid var(--line);
  cursor:zoom-in;background:var(--card-sub);
}
.acts{display:flex;gap:14px;align-items:center}

/* 写真を選ぶところ */
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumb{position:relative;width:84px;height:84px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.thumb .rm{
  position:absolute;top:-7px;right:-7px;width:25px;height:25px;border-radius:50%;
  background:var(--ink);color:var(--ground);border:2px solid var(--card);cursor:pointer;
  font-size:13px;font-weight:800;line-height:1;font-family:inherit;padding:0;
}
.thumb .rm:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.addimg{
  border:1.5px dashed var(--line);background:var(--card-sub);color:var(--muted);
  border-radius:12px;width:84px;height:84px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:800;line-height:1.5;
}
.addimg:hover:not(:disabled){border-color:var(--muted);color:var(--ink)}
.addimg:disabled{opacity:.4;cursor:not-allowed}
.addimg:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}

/* 写真の拡大 */
#lb{max-width:96vw;width:auto;background:transparent}
#lb::backdrop{background:rgba(0,0,0,.88)}
#lb img{max-width:96vw;max-height:86vh;border-radius:12px;display:block;cursor:zoom-out}

/* 通信の状態。うまくいかないとき、何が起きたか分かるようにする */
.bar{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  z-index:50;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--ground);
  border-radius:var(--r-chip);padding:10px 18px;
  font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lift);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.bar.on{opacity:1}
.bar.ng{background:var(--tomato);color:#fff}
.loading{text-align:center;color:var(--muted);font-weight:700;padding:60px 16px}
</style>
</head>
<body>

<header>
  <div class="head-in">
    <div class="brand">
      <h1>みんなのノート</h1>
      <span class="farm">ハッピートマトファーム</span>
    </div>
    <div class="filters">
      <div class="frow" id="house-filter" role="group" aria-label="ハウスでしぼる">
        <span class="flabel">ハウス</span>
        <button class="chip house" data-house="" aria-pressed="true">すべて</button>
        <button class="chip house" data-house="中央" aria-pressed="false"><span class="dot"></span>中央</button>
        <button class="chip house" data-house="東" aria-pressed="false"><span class="dot"></span>東</button>
        <button class="chip house" data-house="西" aria-pressed="false"><span class="dot"></span>西</button>
        <button class="chip house" data-house="南" aria-pressed="false"><span class="dot"></span>南</button>
      </div>
      <div class="frow" id="kind-filter" role="group" aria-label="しゅるいでしぼる">
        <span class="flabel">しゅるい</span>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="loading" class="loading">読み込んでいます…</div>

  <section id="pinned-sec" hidden>
    <div class="sec-head">
      <h2>ずっと見えるところ</h2>
      <span class="count" id="pinned-count">0</span>
      <span class="rule"></span>
    </div>
    <div class="grid" id="pinned"></div>
  </section>

  <section id="recent-sec" hidden>
    <div class="sec-head">
      <h2>あたらしい順</h2>
      <span class="count" id="recent-count">0</span>
      <span class="rule"></span>
    </div>
    <div class="grid" id="recent"></div>
  </section>
</div>

<button class="fab" id="fab"><span class="plus">＋</span>かきこむ</button>
<div class="bar" id="bar"></div>

<dialog id="dlg">
  <form method="dialog" class="sheet" id="form">
    <h2>ノートにかきこむ</h2>
    <div class="field">
      <span>しゅるい</span>
      <div class="picker" id="kind-pick"></div>
    </div>
    <div class="field">
      <span>どのハウス（いくつでも選べます）</span>
      <div class="picker" id="house-pick">
        <button type="button" class="chip house" data-house="中央" aria-pressed="false"><span class="dot"></span>中央</button>
        <button type="button" class="chip house" data-house="東" aria-pressed="false"><span class="dot"></span>東</button>
        <button type="button" class="chip house" data-house="西" aria-pressed="false"><span class="dot"></span>西</button>
        <button type="button" class="chip house" data-house="南" aria-pressed="false"><span class="dot"></span>南</button>
        <button type="button" class="chip" id="pick-all">ぜんぶ</button>
      </div>
    </div>
    <label class="field">
      <span>みだし</span>
      <input type="text" id="f-title" placeholder="ひとことで言うと？" required>
    </label>
    <label class="field">
      <span>ないよう</span>
      <textarea id="f-body" placeholder="くわしく書いてください"></textarea>
    </label>
    <div class="field">
      <span>しゃしん（3まいまで）</span>
      <div class="thumbs" id="thumbs"></div>
      <input type="file" id="f-img" accept="image/*" multiple hidden>
    </div>
    <label class="field" id="who-field">
      <span>なまえ</span>
      <input type="text" id="f-who" placeholder="お名前" required>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn" id="cancel">やめる</button>
      <button type="submit" class="btn primary" id="submit">はりだす</button>
    </div>
  </form>
</dialog>

<dialog id="lb"><img id="lb-img" alt="写真"></dialog>

<dialog id="rdlg">
  <form method="dialog" class="sheet" id="rform">
    <h2>こたえる</h2>
    <p class="hint" id="r-target"></p>
    <label class="field">
      <span>こたえ</span>
      <textarea id="r-text" required></textarea>
    </label>
    <label class="field">
      <span>なまえ</span>
      <input type="text" id="r-who" placeholder="お名前" required>
    </label>
    <div class="sheet-actions">
      <button type="button" class="btn" id="r-cancel">やめる</button>
      <button type="submit" class="btn primary" id="r-submit">おくる</button>
    </div>
  </form>
</dialog>

<dialog id="kdlg">
  <form method="dialog" class="sheet">
    <h2>しゅるいの設定</h2>
    <p class="hint">名前を書きかえたり、色を選んだりできます。使われているしゅるいは消せません。</p>
    <div class="kindlist" id="kindlist"></div>
    <div class="field">
      <span>あたらしく つくる</span>
      <div class="addrow">
        <input type="text" id="k-new" placeholder="たとえば「今週のこと」">
        <button type="button" class="btn primary" id="k-add">ふやす</button>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn primary" id="k-close">とじる</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  "use strict";

  /* Apps Script のウェブアプリ。保存先のスプレッドシートにつながっています */
  var API = "https://script.google.com/macros/s/AKfycbzYkVlVngoC6CXf9HKPlfnFbJHs5lrarw2J9dLjdqaqvdVQFIN15aMr5EyNSA8tj1UU/exec";

  var HOUSES = ["中央","東","西","南"];
  var PALETTE = ["#E24B37","#D9960F","#3E9455","#3A82C4","#8A63C9","#D2699A"];
  var NAME_LS = "htf_note_name";

  var KINDS = [], NOTES = [], REPLIES = [];
  var filter = { house:"", kind:"" };

  var $ = function(s){ return document.querySelector(s); };

  var esc = function(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };

  /* 画面下の帯。通信の結果をここに出す */
  var barTimer = null;
  var bar = function(msg, ng){
    var el = $("#bar");
    el.textContent = msg;
    el.className = "bar on" + (ng ? " ng" : "");
    clearTimeout(barTimer);
    barTimer = setTimeout(function(){ el.className = "bar"; }, ng ? 7000 : 2600);
  };

  /* ---- 通信 ----
     Apps Script は Content-Type を text/plain にしないと
     ブラウザが事前確認（プリフライト）を投げ、それが弾かれて失敗する。 */
  var send = function(payload){
    return fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function(r){ return r.json(); }).then(function(j){
      if(!j.ok) throw new Error(j.error || "保存できませんでした");
      return j;
    });
  };

  var load = function(){
    /* want=notes を付けて、必要な分だけ受け取る（病害の記録は読まない） */
    return fetch(API + "?want=notes&t=" + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j.ok) throw new Error(j.error || "読み込めませんでした");
        KINDS = j.kinds || [];
        NOTES = j.notes || [];
        REPLIES = j.replies || [];
      });
  };

  /* ---- 表示 ---- */
  var kindOf = function(id){
    for(var i=0;i<KINDS.length;i++){ if(KINDS[i].id === id) return KINDS[i]; }
    return null;
  };
  var usedCount = function(id){
    return NOTES.filter(function(n){ return n.kind === id; }).length;
  };
  var repliesOf = function(noteId){
    return REPLIES.filter(function(r){ return r.noteId === noteId; });
  };

  var fmtDate = function(iso){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
    if(!p) return String(iso || "");
    var d = new Date(+p[1], +p[2]-1, +p[3]);
    var w = "日月火水木金土"[d.getDay()];
    var head = (+p[1] === new Date().getFullYear()) ? "" : (+p[1] + "年");
    return head + (+p[2]) + "月" + (+p[3]) + "日（" + w + "）";
  };

  var houseTags = function(list){
    var arr = list || [];
    var all = HOUSES.every(function(h){ return arr.indexOf(h) >= 0; });
    var show = all ? ["ぜんぶ"] : HOUSES.filter(function(h){ return arr.indexOf(h) >= 0; });
    if(!show.length) show = ["ぜんぶ"];
    return '<span class="houses">' + show.map(function(h){
      return '<span class="house-tag" data-house="' + esc(h) + '"><span class="dot"></span>' + esc(h) + '</span>';
    }).join("") + '</span>';
  };

  /* ドライブに置いた写真の表示先。
     大きさを指定して受け取れるので、一覧では小さめを読み込む */
  var gazoURL = function(id, w){
    return "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w" + (w || 800);
  };

  var cardHTML = function(n, i){
    var k = kindOf(n.kind);
    var rs = repliesOf(n.id);
    var replies = rs.length ? '<div class="replies">' + rs.map(function(r){
      return '<div class="reply"><span class="who">' + esc(r.who) + ' さんの答え</span>' +
             '<p>' + esc(r.text) + '</p></div>';
    }).join("") + '</div>' : "";

    var imgs = (n.images || []);
    var shotsHTML = imgs.length ? '<div class="shots">' + imgs.map(function(id){
      return '<img src="' + esc(gazoURL(id, 600)) + '" alt="しゃしん" loading="lazy" ' +
             'data-big="' + esc(gazoURL(id, 1600)) + '">';
    }).join("") + '</div>' : "";

    var isQuestion = k && k.label.indexOf("質問") >= 0;

    return '<article class="card' + (n.pin ? " pinned" : "") + '" style="animation-delay:' + (i * 38) + 'ms">' +
      '<button class="pinbtn" type="button" data-pin="' + esc(n.id) + '">' +
        (n.pin ? "はずす" : "ピン") + '</button>' +
      '<div class="meta">' +
        houseTags(n.houses) +
        (k ? '<span class="kind" style="--k:' + esc(k.color) + '">' + esc(k.label) + '</span>' : "") +
        (rs.length ? '<span class="answered">こたえ済み</span>' : "") +
      '</div>' +
      '<h3>' + esc(n.title) + '</h3>' +
      (n.body ? '<p>' + esc(n.body) + '</p>' : "") +
      shotsHTML +
      replies +
      '<div class="acts">' +
        (isQuestion && !rs.length
          ? '<button class="linkbtn" type="button" data-reply="' + esc(n.id) + '">こたえる</button>' : "") +
        '<button class="linkbtn" type="button" data-edit="' + esc(n.id) + '">なおす</button>' +
        '<button class="linkbtn" type="button" data-del="' + esc(n.id) + '">けす</button>' +
      '</div>' +
      '<div class="by"><span>' + esc(n.who) + '</span><time>' + fmtDate(n.date) + '</time></div>' +
    '</article>';
  };

  var matches = function(n){
    var arr = n.houses || [];
    return (!filter.house || arr.indexOf(filter.house) >= 0) &&
           (!filter.kind  || n.kind === filter.kind);
  };

  var render = function(){
    $("#loading").hidden = true;
    $("#recent-sec").hidden = false;

    var shown = NOTES.filter(matches);
    var pinned = shown.filter(function(n){ return n.pin; });
    var rest = shown.filter(function(n){ return !n.pin; })
                    .sort(function(a,b){
                      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
                      return a.id < b.id ? 1 : -1;      /* 同じ日は新しく足したほうを上に */
                    });

    $("#pinned-sec").hidden = pinned.length === 0;
    $("#pinned").innerHTML = pinned.map(cardHTML).join("");
    $("#pinned-count").textContent = pinned.length;

    $("#recent-count").textContent = rest.length;
    $("#recent").innerHTML = rest.length
      ? rest.map(cardHTML).join("")
      : '<p class="empty">ここにはまだ何もありません</p>';

    document.querySelectorAll("[data-pin]").forEach(function(b){
      b.addEventListener("click", function(){ togglePin(b.getAttribute("data-pin")); });
    });
    document.querySelectorAll("[data-reply]").forEach(function(b){
      b.addEventListener("click", function(){ openReply(b.getAttribute("data-reply")); });
    });
    document.querySelectorAll("[data-edit]").forEach(function(b){
      b.addEventListener("click", function(){ openForm(b.getAttribute("data-edit")); });
    });
    document.querySelectorAll("[data-del]").forEach(function(b){
      b.addEventListener("click", function(){ removeNote(b.getAttribute("data-del")); });
    });
    document.querySelectorAll(".shots img").forEach(function(im){
      im.addEventListener("click", function(){
        $("#lb-img").src = im.getAttribute("data-big");
        $("#lb").showModal();
      });
    });
  };

  var renderKindChips = function(){
    var f = $("#kind-filter");
    f.querySelectorAll(".chip, .gear").forEach(function(e){ e.remove(); });

    var mk = function(id, label, color, pressed){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip kindf";
      b.setAttribute("data-kind", id);
      b.setAttribute("aria-pressed", String(pressed));
      if(color) b.style.setProperty("--k", color);
      b.textContent = label;
      return b;
    };

    f.appendChild(mk("", "すべて", "", filter.kind === ""));
    KINDS.forEach(function(k){ f.appendChild(mk(k.id, k.label, k.color, filter.kind === k.id)); });

    var g = document.createElement("button");
    g.type = "button"; g.className = "gear"; g.textContent = "しゅるいの設定";
    g.addEventListener("click", function(){ renderKindList(); $("#kdlg").showModal(); });
    f.appendChild(g);

    f.querySelectorAll(".chip.kindf").forEach(function(b){
      b.addEventListener("click", function(){
        var v = b.getAttribute("data-kind");
        filter.kind = (filter.kind === v) ? "" : v;
        renderKindChips(); render();
      });
    });

    var p = $("#kind-pick");
    p.innerHTML = "";
    KINDS.forEach(function(k, i){ p.appendChild(mk(k.id, k.label, k.color, i === 0)); });
    p.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        p.querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", String(x === b));
        });
      });
    });
  };

  /* ---- しゅるいの設定 ---- */
  var saveKinds = function(){
    return send({ action:"saveKinds", kinds:KINDS })
      .then(function(){ bar("しゅるいを保存しました"); })
      .catch(function(e){ bar(e.message, true); });
  };

  var renderKindList = function(){
    var box = $("#kindlist");
    box.innerHTML = "";
    KINDS.forEach(function(k){
      var used = usedCount(k.id);

      var row = document.createElement("div");
      row.className = "kindrow";

      var name = document.createElement("input");
      name.type = "text"; name.className = "name"; name.value = k.label;
      name.addEventListener("input", function(){ k.label = name.value; renderKindChips(); render(); });
      name.addEventListener("change", saveKinds);

      var used_el = document.createElement("span");
      used_el.className = "used";
      used_el.textContent = used ? (used + "件で使用中") : "未使用";

      var del = document.createElement("button");
      del.type = "button"; del.className = "del"; del.textContent = "けす";
      del.disabled = used > 0 || KINDS.length <= 1;
      del.addEventListener("click", function(){
        KINDS = KINDS.filter(function(x){ return x.id !== k.id; });
        if(filter.kind === k.id) filter.kind = "";
        renderKindList(); renderKindChips(); render(); saveKinds();
      });

      row.appendChild(name); row.appendChild(used_el); row.appendChild(del);
      box.appendChild(row);

      var sw = document.createElement("div");
      sw.className = "swatches";
      PALETTE.forEach(function(c){
        var s = document.createElement("button");
        s.type = "button"; s.className = "sw";
        s.style.setProperty("--k", c);
        s.setAttribute("aria-pressed", String(c === k.color));
        s.setAttribute("aria-label", "色をえらぶ");
        s.addEventListener("click", function(){
          k.color = c;
          renderKindList(); renderKindChips(); render(); saveKinds();
        });
        sw.appendChild(s);
      });
      var srow = document.createElement("div");
      srow.className = "kindrow"; srow.style.paddingTop = "6px";
      srow.appendChild(sw);
      box.appendChild(srow);
    });
  };

  $("#k-add").addEventListener("click", function(){
    var input = $("#k-new");
    var v = input.value.trim();
    if(!v) return;
    KINDS.push({ id:"k" + Date.now(), label:v, color:PALETTE[KINDS.length % PALETTE.length] });
    input.value = "";
    renderKindList(); renderKindChips(); render(); saveKinds();
  });
  $("#k-close").addEventListener("click", function(){ $("#kdlg").close(); });

  /* ---- ピン留め ---- */
  var togglePin = function(id){
    var n = NOTES.filter(function(x){ return x.id === id; })[0];
    if(!n) return;
    var next = !n.pin;
    n.pin = next;                       /* 先に画面を変えて、待たせない */
    render();
    send({ action:"setPin", id:id, pin:next })
      .then(function(){ bar(next ? "ピンで留めました" : "ピンをはずしました"); })
      .catch(function(e){
        n.pin = !next;                  /* 失敗したら戻す */
        render();
        bar(e.message, true);
      });
  };

  /* ---- ハウスのしぼり込み ---- */
  document.querySelectorAll("#house-filter .chip.house").forEach(function(btn){
    btn.addEventListener("click", function(){
      var v = btn.getAttribute("data-house");
      filter.house = (filter.house === v) ? "" : v;
      document.querySelectorAll("#house-filter .chip.house").forEach(function(b){
        b.setAttribute("aria-pressed", String(b.getAttribute("data-house") === filter.house));
      });
      render();
    });
  });

  /* ---- 投稿 ---- */
  var housePick = $("#house-pick");
  housePick.querySelectorAll(".chip.house").forEach(function(b){
    b.addEventListener("click", function(){
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
    });
  });
  $("#pick-all").addEventListener("click", function(){
    var btns = housePick.querySelectorAll(".chip.house");
    var allOn = Array.prototype.every.call(btns, function(b){ return b.getAttribute("aria-pressed") === "true"; });
    btns.forEach(function(b){ b.setAttribute("aria-pressed", String(!allOn)); });
  });
  var pickedHouses = function(){
    return Array.prototype.filter.call(housePick.querySelectorAll(".chip.house"), function(b){
      return b.getAttribute("aria-pressed") === "true";
    }).map(function(b){ return b.getAttribute("data-house"); });
  };

  /* ---- 写真 ----
     スマホの写真はそのままだと3〜5MBあり、電波が弱いと送信に失敗する。
     長辺1600pxのJPEGに縮めてから送る（200〜500KB程度になる）。 */
  var MAX_IMG = 3;
  var shots = [];          /* 中身は data:... （新規）か ドライブのID（保存済み） */

  var shrink = function(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        var cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(img.width * scale));
        cv.height = Math.max(1, Math.round(img.height * scale));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        URL.revokeObjectURL(url);
        res(cv.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function(){
        URL.revokeObjectURL(url);
        rej(new Error("この写真は読み込めませんでした"));
      };
      img.src = url;
    });
  };

  var renderThumbs = function(){
    var box = $("#thumbs");
    box.innerHTML = "";

    shots.forEach(function(s, i){
      var d = document.createElement("div");
      d.className = "thumb";

      var im = document.createElement("img");
      im.src = (s.indexOf("data:") === 0) ? s : gazoURL(s, 300);
      im.alt = "しゃしん";

      var rm = document.createElement("button");
      rm.type = "button"; rm.className = "rm"; rm.textContent = "×";
      rm.setAttribute("aria-label", "この写真をはずす");
      rm.addEventListener("click", function(){ shots.splice(i, 1); renderThumbs(); });

      d.appendChild(im); d.appendChild(rm);
      box.appendChild(d);
    });

    var add = document.createElement("button");
    add.type = "button"; add.className = "addimg";
    add.textContent = shots.length ? "＋ ついか" : "＋ しゃしん";
    add.disabled = shots.length >= MAX_IMG;
    add.addEventListener("click", function(){ $("#f-img").click(); });
    box.appendChild(add);
  };

  $("#f-img").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = "";
    if(!files.length) return;

    var nokori = MAX_IMG - shots.length;
    if(files.length > nokori){
      bar("しゃしんは" + MAX_IMG + "まいまでです", true);
      files = files.slice(0, nokori);
    }
    if(!files.length) return;

    bar("しゃしんを小さくしています…");
    Promise.all(files.map(shrink)).then(function(list){
      shots = shots.concat(list).slice(0, MAX_IMG);
      renderThumbs();
      bar("しゃしんをつけました");
    }).catch(function(err){ bar(err.message, true); });
  });

  $("#lb").addEventListener("click", function(){ $("#lb").close(); });

  /* ---- 投稿フォーム（新しく書く／なおす の両方） ---- */
  var editing = null;

  var openForm = function(id){
    editing = id || null;
    shots = [];

    var n = editing ? NOTES.filter(function(x){ return x.id === editing; })[0] : null;

    $("#form").reset();
    $("#dlg").querySelector("h2").textContent = n ? "かきなおす" : "ノートにかきこむ";
    $("#submit").textContent = n ? "なおす" : "はりだす";
    /* なおすときは、書いた人を変えない。
       隠した項目に required が残っていると送信できなくなるので、一緒に外す。 */
    $("#who-field").hidden = !!n;
    $("#f-who").required = !n;

    if(n){
      $("#f-title").value = n.title || "";
      $("#f-body").value = n.body || "";
      shots = (n.images || []).slice();
      $("#f-who").value = n.who || "";
      housePick.querySelectorAll(".chip.house").forEach(function(b){
        b.setAttribute("aria-pressed", String((n.houses || []).indexOf(b.getAttribute("data-house")) >= 0));
      });
      document.querySelectorAll("#kind-pick [data-kind]").forEach(function(b){
        b.setAttribute("aria-pressed", String(b.getAttribute("data-kind") === n.kind));
      });
    } else {
      try{ $("#f-who").value = localStorage.getItem(NAME_LS) || ""; }catch(e){}
      housePick.querySelectorAll(".chip.house").forEach(function(b){ b.setAttribute("aria-pressed","false"); });
      document.querySelectorAll("#kind-pick [data-kind]").forEach(function(b, i){
        b.setAttribute("aria-pressed", String(i === 0));
      });
    }

    renderThumbs();
    $("#dlg").showModal();
  };

  $("#fab").addEventListener("click", function(){ openForm(null); });
  $("#cancel").addEventListener("click", function(){ $("#dlg").close(); });

  $("#form").addEventListener("submit", function(){
    var title = $("#f-title").value.trim();
    var who = $("#f-who").value.trim();
    if(!title || (!editing && !who)) return;

    var houses = pickedHouses();
    if(!houses.length) houses = HOUSES.slice();
    var on = document.querySelector("#kind-pick [aria-pressed='true']");
    var kind = on ? on.getAttribute("data-kind") : (KINDS[0] && KINDS[0].id);
    var body = $("#f-body").value.trim();
    var okuru = shots.slice();

    if(!editing){ try{ localStorage.setItem(NAME_LS, who); }catch(e){} }
    $("#fab").disabled = true;
    $("#submit").disabled = true;
    bar(editing ? "なおしています…" : "はりだしています…");

    var payload = editing
      ? { action:"editNote", id:editing, kind:kind, houses:houses, title:title, body:body, images:okuru }
      : { action:"addNote", kind:kind, houses:houses, title:title, body:body, who:who, images:okuru };

    var target = editing;

    send(payload).then(function(j){
      if(target){
        var n = NOTES.filter(function(x){ return x.id === target; })[0];
        if(n){
          n.kind = kind; n.houses = houses; n.title = title; n.body = body;
          n.images = j.images || [];
        }
        bar("なおしました");
      } else {
        var d = new Date();
        NOTES.unshift({
          id: j.id, kind: kind, houses: houses, title: title, body: body, who: who,
          images: j.images || [],
          date: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"),
          pin: false
        });
        bar("はりだしました");
      }
      shots = [];
      render();
    }).catch(function(e){
      bar(e.message, true);
    }).then(function(){
      $("#fab").disabled = false;
      $("#submit").disabled = false;
      editing = null;
    });
  });

  /* ---- 削除 ----
     シートには残るので、間違えてもスプレッドシートから戻せる。 */
  var removeNote = function(id){
    var n = NOTES.filter(function(x){ return x.id === id; })[0];
    if(!n) return;
    if(!confirm("「" + n.title + "」をけしますか？")) return;

    var nokosi = NOTES.slice();
    NOTES = NOTES.filter(function(x){ return x.id !== id; });
    render();

    send({ action:"deleteNote", id:id })
      .then(function(){ bar("けしました"); })
      .catch(function(e){
        NOTES = nokosi;             /* 失敗したら戻す */
        render();
        bar(e.message, true);
      });
  };

  /* ---- こたえる ---- */
  var replyTo = null;
  var openReply = function(id){
    var n = NOTES.filter(function(x){ return x.id === id; })[0];
    if(!n) return;
    replyTo = id;
    $("#r-target").textContent = "「" + n.title + "」への こたえ";
    try{ $("#r-who").value = localStorage.getItem(NAME_LS) || ""; }catch(e){}
    $("#rdlg").showModal();
  };
  $("#r-cancel").addEventListener("click", function(){ $("#rdlg").close(); });

  $("#rform").addEventListener("submit", function(){
    var text = $("#r-text").value.trim();
    var who = $("#r-who").value.trim();
    if(!text || !who || !replyTo) return;

    try{ localStorage.setItem(NAME_LS, who); }catch(e){}
    bar("おくっています…");

    send({ action:"addReply", noteId:replyTo, who:who, text:text }).then(function(j){
      var d = new Date();
      REPLIES.push({
        id: j.id, noteId: replyTo, who: who, text: text,
        date: d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0")
      });
      $("#rform").reset();
      render();
      bar("こたえをおくりました");
    }).catch(function(e){ bar(e.message, true); });
  });

  /* ---- 起動 ---- */
  load().then(function(){
    renderKindChips();
    render();
  }).catch(function(e){
    $("#loading").innerHTML =
      '読み込めませんでした<br><span style="font-size:13px">' + esc(e.message) + '</span>';
  });
})();
</script>
</body>
</html>

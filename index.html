<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C62828">
<title>ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23C62828'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%232E6B33' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#12180F;
    --muted:#5C6857;
    --rule:#C6CFC0;
    --tomato:#C62828;
    --leaf:#2E6B33;
    --tint:#F4F7F1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI","Noto Sans JP","Hiragino Kaku Gothic ProN",Roboto,sans-serif;
    font-size:17px;
    line-height:1.6;
    padding:24px 18px 60px;
    max-width:600px;
    margin:0 auto;
  }

  header{
    border-bottom:3px solid var(--tomato);
    padding-bottom:16px;
    margin-bottom:26px;
  }
  h1{
    font-size:25px;
    font-weight:800;
    margin:0;
    letter-spacing:.02em;
  }
  header p{
    margin:6px 0 0;
    font-size:14px;
    color:var(--muted);
  }

  /* スマホのホーム画面と同じ、3列のアイコン並び。
     1fr を3つにしているので、画面の幅が変わっても3列のまま収まる */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px 10px;
  }
  a.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:9px;
    text-decoration:none;
    color:var(--ink);
  }
  a.app:focus-visible{outline:3px solid var(--tomato);outline-offset:4px}

  /* 角の丸い正方形のアイコン台。
     place-items:center で、絵文字を縦横とも真ん中に置く */
  .app .ic{
    width:64px;
    height:64px;
    border-radius:17px;
    display:grid;
    place-items:center;
    font-size:31px;
    line-height:1;
    background:var(--bg);
    border:2px solid var(--bd);
    transition:transform .12s ease;
  }
  a.app:active .ic{transform:scale(.94)}
  .app .t{
    font-size:12.5px;
    font-weight:700;
    text-align:center;
    line-height:1.35;
  }

  /* 用途ごとの色分け。並び順は使う順のまま、色で仲間が分かるようにする。
     --bg が台の色、--bd が枠の色 */
  .c-keisan{--bg:#E8F1FB;--bd:#8FBCE6}   /* 計算まわり：青 */
  .c-hito  {--bg:#FDF0E3;--bd:#E6AE70}   /* 人・シフト：橙 */
  .c-kiroku{--bg:#FBE9E9;--bd:#E08C8C}   /* 記録：赤 */
  .c-settei{--bg:#EEF1EC;--bd:#B6C0B0}   /* 設定：灰 */

  .status{
    background:var(--tint);
    border-left:5px solid var(--leaf);
    padding:16px 16px;
    margin-top:34px;
  }
  .status h3{
    font-size:14px;
    margin:0 0 10px;
    font-weight:700;
  }
  .status dl{margin:0;font-size:14px}
  .status dt{
    color:var(--muted);
    font-size:12.5px;
    margin-top:8px;
  }
  .status dt:first-child{margin-top:0}
  .status dd{
    margin:1px 0 0;
    font-family:ui-monospace,"Roboto Mono",monospace;
    font-size:13px;
    word-break:break-all;
  }
  .ok{color:var(--leaf);font-weight:700}
  .ng{color:var(--tomato);font-weight:700}

  .hint{
    margin-top:22px;
    font-size:14px;
    color:var(--muted);
    border-top:1px solid var(--rule);
    padding-top:16px;
  }
  .hint b{color:var(--ink)}
</style>
</head>
<body>

<header>
  <h1>ハッピートマトファーム</h1>
  <p>栽培管理ツール</p>
</header>

<!-- よく使う順に並べている。順番を変えるときは、この並びを入れ替えるだけでよい。

     アイコンは絵文字。画像ファイルも外部からの読み込みも要らないので、
     電波の弱いハウスの中でも必ず出る。
     aria-hidden を付けているのは、読み上げソフトが
     「しずく　潅水量計算」と二重に読まないようにするため。

     名前は3列に1行で収まる長さにそろえてある。
     長くすると折り返して行がそろわなくなるので、増やすときは短い名前にする。
     リンク先（フォルダ名・URL）は変えていない。画面に出る文字だけを短くしている -->

<nav class="grid">

  <a class="app" href="https://kansui.streamlit.app/">
    <span class="ic c-keisan" aria-hidden="true">💧</span>
    <span class="t">潅水量計算</span>
  </a>

  <a class="app" href="ekihi/">
    <span class="ic c-keisan" aria-hidden="true">🧪</span>
    <span class="t">液肥レシピ</span>
  </a>

  <a class="app" href="minna/">
    <span class="ic c-hito" aria-hidden="true">👥</span>
    <span class="t">みんなのページ</span>
  </a>

  <a class="app" href="shuryo/">
    <span class="ic c-kiroku" aria-hidden="true">🍅</span>
    <span class="t">収量記録</span>
  </a>

  <a class="app" href="shodoku/">
    <span class="ic c-kiroku" aria-hidden="true">🧴</span>
    <span class="t">消毒記録</span>
  </a>

  <!-- あいことばは付けない。このページは誰でも開けるため。
       一度入れればこの端末が覚えるので、打つのは初回だけ -->
  <a class="app" href="kibou-kanri/">
    <span class="ic c-hito" aria-hidden="true">🗓️</span>
    <span class="t">シフト管理</span>
  </a>

  <a class="app" href="shift/">
    <span class="ic c-hito" aria-hidden="true">📋</span>
    <span class="t">完成シフト</span>
  </a>

  <a class="app" href="shitsudo/">
    <span class="ic c-keisan" aria-hidden="true">🌫️</span>
    <span class="t">湿度計算</span>
  </a>

  <a class="app" href="ondo/">
    <span class="ic c-settei" aria-hidden="true">🌡️</span>
    <span class="t">温度設定</span>
  </a>

  <a class="app" href="kogosei/">
    <span class="ic c-keisan" aria-hidden="true">🌿</span>
    <span class="t">光合成・蒸散</span>
  </a>

  <a class="app" href="nissha/">
    <span class="ic c-keisan" aria-hidden="true">☀️</span>
    <span class="t">日射量予測</span>
  </a>

  <a class="app" href="dropbox-setup.html">
    <span class="ic c-settei" aria-hidden="true">⚙️</span>
    <span class="t">Dropbox設定</span>
  </a>

</nav>

<div class="status">
  <h3>動作確認</h3>
  <dl>
    <dt>公開状態</dt>
    <dd id="s-proto">確認中…</dd>
    <dt>データ保持</dt>
    <dd id="s-store">確認中…</dd>
    <dt>Dropboxとの通信</dt>
    <dd id="s-api">確認中…</dd>
    <dt>アドレス</dt>
    <dd id="s-url">—</dd>
  </dl>
</div>

<p class="hint">
  <b>ホーム画面に置くには</b><br>
  Chromeでこのページを開き、右上の点3つ →「ホーム画面に追加」。
  以降はアイコンから直接起動できます。
</p>

<script>
(function(){
  var https = location.protocol === 'https:';
  var e = document.getElementById('s-proto');
  e.innerHTML = https
    ? '<span class="ok">OK</span> — https で公開されています'
    : '<span class="ng">未</span> — ' + location.protocol;

  document.getElementById('s-url').textContent = location.href;

  var st = document.getElementById('s-store');
  try{
    var K='__htf__', now=new Date().toLocaleString('ja-JP');
    var prev = localStorage.getItem(K);
    localStorage.setItem(K, now);
    if(localStorage.getItem(K) !== now) throw new Error('不一致');
    st.innerHTML = '<span class="ok">OK</span> — '
      + (prev ? '前回起動 ' + prev : '初回起動');
  }catch(err){
    st.innerHTML = '<span class="ng">不可</span> — ' + err.message;
  }

  var ap = document.getElementById('s-api');
  fetch('https://api.dropboxapi.com/2/users/get_current_account', {
    method:'POST',
    headers:{'Authorization':'Bearer connectivity-check'}
  }).then(function(r){
    ap.innerHTML = '<span class="ok">OK</span> — 応答 HTTP ' + r.status;
  }).catch(function(err){
    ap.innerHTML = '<span class="ng">不可</span> — ' + err.message;
  });
})();
</script>
</body>
</html>

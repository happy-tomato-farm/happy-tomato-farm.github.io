<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C62828">
<meta name="robots" content="noindex, nofollow">
<title>ハッピートマトファーム 実績</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23C62828'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%232E6B33' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FFF; --ink:#12180F; --muted:#5C6857; --rule:#DCE3D7;
  --tomato:#C62828; --leaf:#2E6B33; --tint:#F5F8F2;
  --y0:#C9D2C3; --y1:#7FA070; --y2:#C62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--tint); color:var(--ink);
  font-family:-apple-system,"Segoe UI","Noto Sans JP",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
  padding:0 0 40px; max-width:680px; margin:0 auto;
}
header{
  background:var(--paper); padding:16px 16px 0;
  border-bottom:1px solid var(--rule);
  position:sticky; top:0; z-index:20;
}
h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.02em}
header .sub{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:0;-webkit-overflow-scrolling:touch}
nav button{
  flex:none;padding:9px 15px;font-size:14.5px;font-weight:700;font-family:inherit;
  background:none;border:none;border-bottom:3px solid transparent;
  color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px;
}
nav button.sel{color:var(--tomato);border-bottom-color:var(--tomato)}

main{padding:16px 12px}
.card{background:var(--paper);border:1px solid var(--rule);margin-bottom:14px;overflow:hidden}
.card h2{
  font-size:14px;font-weight:700;margin:0;padding:12px 15px;
  border-bottom:1px solid var(--rule);letter-spacing:.03em;
}
.card .body{padding:14px 12px}

.big{display:flex;gap:10px;padding:14px 12px}
.big > div{
  flex:1;text-align:center;padding:12px 4px;background:var(--tint);
  border:1px solid var(--rule);
}
.big .lab{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.big .val{font-size:23px;font-weight:800;font-family:ui-monospace,monospace;line-height:1.25;margin-top:3px}
.big .un{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.big .cmp{font-size:12px;font-weight:700;margin-top:2px}
.up{color:var(--leaf)} .down{color:var(--tomato)} .flat{color:var(--muted)}

canvas{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin-top:12px;color:var(--muted);padding:0 3px}
.legend i{display:inline-block;width:16px;height:4px;vertical-align:middle;margin-right:6px}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--rule)}
th{font-size:11.5px;color:var(--muted);font-weight:700;background:var(--tint)}
th:first-child,td:first-child{text-align:left;padding-left:10px;font-weight:700}
td{font-family:ui-monospace,monospace}
tr:last-child td{border-bottom:none}
tr.sum td{background:var(--tint);font-weight:800;border-top:2px solid var(--ink)}

.bars{padding:2px 3px}
.bar{margin-bottom:11px}
.bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar .top b{font-family:ui-monospace,monospace;font-weight:700}
.bar .track{height:10px;background:var(--tint);border:1px solid var(--rule)}
.bar .fill{height:100%;background:var(--leaf)}
.bar.g1 .fill{background:#2E6B33}
.bar.g2 .fill{background:#6E9A5E}
.bar.g3 .fill{background:#A9BE96}
.bar.g4 .fill{background:#D2D9C6}

footer{text-align:center;font-size:12px;color:var(--muted);padding:18px 16px 0}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 12px}
</style>
</head>
<body>

<header>
  <h1>ハッピートマトファーム</h1>
  <div class="sub" id="sub">実績</div>
  <nav id="tabs"></nav>
</header>

<main id="main"></main>

<footer id="foot"></footer>

<script src="data.js"></script>
<script>
"use strict";
(function(){
  var D = window.DATA;
  var host = document.getElementById("main");
  if(!D || !D.seasons || !D.seasons.length){
    host.innerHTML = '<div class="empty">データがまだありません</div>';
    return;
  }

  var HOUSES = ["全体","中央","東","西","南"];
  var cur = "全体";
  var seasons = D.seasons;
  var last = seasons[seasons.length-1];
  var prev = seasons.length > 1 ? seasons[seasons.length-2] : null;
  var COLORS = ["--y0","--y1","--y2"];

  document.getElementById("sub").textContent =
    last.label + "　最終更新 " + (D.generated || "").slice(0,10);
  document.getElementById("foot").textContent =
    "このページは関係者向けです。転送はご遠慮ください。";

  document.getElementById("tabs").innerHTML = HOUSES.map(function(h){
    return '<button data-h="'+h+'"'+(h===cur?' class="sel"':'')+'>'+h+'</button>';
  }).join("");

  document.getElementById("tabs").addEventListener("click", function(e){
    var h = e.target.getAttribute("data-h");
    if(!h) return;
    cur = h;
    Array.prototype.forEach.call(this.children, function(b){
      b.classList.toggle("sel", b.getAttribute("data-h") === h);
    });
    render();
    window.scrollTo(0,0);
  });

  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function sum(a){ return a.reduce(function(x,y){ return x + (y||0); }, 0); }
  function fmt(n, d){
    return (+n).toLocaleString("ja-JP", {minimumFractionDigits:d||0, maximumFractionDigits:d||0});
  }

  function ratioTag(now, before){
    if(!before) return '<div class="cmp flat">前年 —</div>';
    var r = now / before * 100;
    var cls = r >= 102 ? "up" : (r <= 98 ? "down" : "flat");
    var sign = r >= 100 ? "+" : "";
    return '<div class="cmp '+cls+'">前年比 '+sign+fmt(r-100,1)+'%</div>';
  }

  /* ---------- 折れ線グラフ ---------- */
  function lineChart(cv, series, unit, digits){
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height, L = 46, R = 10, T = 12, B = 30;
    ctx.clearRect(0,0,W,H);

    var max = 0;
    series.forEach(function(s){ s.data.forEach(function(v){ if(v > max) max = v; }); });
    if(max <= 0) max = 1;
    var step = Math.pow(10, Math.floor(Math.log(max)/Math.LN10));
    if(max/step < 2) step /= 2; else if(max/step > 5) step *= 2;
    max = Math.ceil(max/step)*step;

    var n = D.months.length;
    var x = function(i){ return L + (W-L-R) * (i/(n-1)); };
    var y = function(v){ return H-B - (H-T-B) * (v/max); };

    ctx.font = "10.5px sans-serif"; ctx.textAlign = "right";
    for(var v = 0; v <= max + 1e-9; v += step){
      ctx.strokeStyle = "#E8EDE3";
      ctx.beginPath(); ctx.moveTo(L, y(v)); ctx.lineTo(W-R, y(v)); ctx.stroke();
      ctx.fillStyle = "#5C6857";
      ctx.fillText(fmt(v, digits||0), L-6, y(v)+3.5);
    }
    ctx.textAlign = "center";
    D.months.forEach(function(m,i){ ctx.fillText(m.replace("月",""), x(i), H-11); });

    series.forEach(function(s){
      ctx.strokeStyle = s.color; ctx.lineWidth = s.thick ? 3.2 : 2;
      ctx.beginPath();
      var on = false;
      s.data.forEach(function(v,i){
        if(!v) return;
        if(!on){ ctx.moveTo(x(i), y(v)); on = true; } else ctx.lineTo(x(i), y(v));
      });
      ctx.stroke();
      if(s.thick){
        ctx.fillStyle = s.color;
        s.data.forEach(function(v,i){
          if(!v) return;
          ctx.beginPath(); ctx.arc(x(i), y(v), 3.6, 0, 7); ctx.fill();
        });
      }
    });
  }

  function chartCard(title, field, unit, digits){
    var series = seasons.map(function(s,i){
      return {
        name: s.label,
        data: (s.houses[cur] || {})[field] || [],
        color: css(COLORS[Math.min(i, COLORS.length-1)]),
        thick: i === seasons.length-1
      };
    }).filter(function(s){ return sum(s.data) > 0; });

    if(!series.length) return "";

    var id = "cv_" + field;
    var legend = series.map(function(s){
      return '<span><i style="background:'+s.color+'"></i>'+s.name+'</span>';
    }).join("");

    setTimeout(function(){
      var cv = document.getElementById(id);
      if(cv) lineChart(cv, series, unit, digits);
    }, 0);

    return '<div class="card"><h2>'+title+'</h2><div class="body">' +
           '<canvas id="'+id+'" width="660" height="330"></canvas>' +
           '<div class="legend">'+legend+'</div></div></div>';
  }

  /* ---------- 構成比 ---------- */
  function breakdown(title, key, labels, cls){
    var h = last.houses[cur];
    if(!h) return "";
    var obj = h[key] || {};
    var keys = labels ? labels : Object.keys(obj);
    var tot = keys.reduce(function(a,k){ return a + (obj[k]||0); }, 0);
    if(!tot) return "";
    var max = Math.max.apply(null, keys.map(function(k){ return obj[k]||0; }));

    var pobj = prev && prev.houses[cur] ? (prev.houses[cur][key] || {}) : null;
    var ptot = pobj ? keys.reduce(function(a,k){ return a + (pobj[k]||0); }, 0) : 0;

    var rows = keys.map(function(k,i){
      var v = obj[k] || 0;
      var pct = v/tot*100;
      var name = (D.sizeLabel && D.sizeLabel[k]) ? D.sizeLabel[k] : k;
      var ppct = ptot ? (pobj[k]||0)/ptot*100 : null;
      var diff = ppct === null ? "" :
        '<span style="color:#5C6857;font-weight:400"> （前年 '+fmt(ppct,1)+'%）</span>';
      return '<div class="bar '+(cls?cls+(i%4+1):"")+'">' +
             '<div class="top"><span>'+name+diff+'</span><b>'+fmt(pct,1)+'%</b></div>' +
             '<div class="track"><div class="fill" style="width:'+(v/max*100)+'%"></div></div></div>';
    }).join("");

    return '<div class="card"><h2>'+title+'</h2><div class="bars body">'+rows+'</div></div>';
  }

  /* ---------- 月別表 ---------- */
  function monthTable(){
    var h = last.houses[cur];
    var ph = prev ? prev.houses[cur] : null;
    if(!h || !sum(h.kg)) return "";
    var rows = D.months.map(function(m,i){
      var v = h.kg[i], pv = ph ? ph.kg[i] : 0;
      var r = (pv && v) ? (v/pv*100) : null;
      var cls = r === null ? "flat" : (r >= 102 ? "up" : (r <= 98 ? "down" : "flat"));
      return '<tr><td>'+m+'</td><td>'+(v?fmt(v):"")+'</td>' +
             '<td>'+(h.kg10a[i]?fmt(h.kg10a[i]):"")+'</td>' +
             '<td class="'+cls+'">'+(r===null?"":fmt(r,0)+"%")+'</td></tr>';
    }).join("");
    var tot = sum(h.kg), ptot = ph ? sum(ph.kg) : 0;
    var tr = ptot ? fmt(tot/ptot*100,0)+"%" : "";
    return '<div class="card"><h2>月別の収量</h2><table>' +
           '<tr><th>月</th><th>収量 kg</th><th>10a換算</th><th>前年比</th></tr>' +
           rows +
           '<tr class="sum"><td>合計</td><td>'+fmt(tot)+'</td>' +
           '<td>'+fmt(sum(h.kg10a))+'</td><td>'+tr+'</td></tr></table></div>';
  }

  /* ---------- 見出しの数字 ---------- */
  function summary(){
    var h = last.houses[cur];
    var ph = prev ? prev.houses[cur] : null;
    if(!h) return "";
    var kg = sum(h.kg), pkg = ph ? sum(ph.kg) : 0;
    var per = sum(h.kg10a), pper = ph ? sum(ph.kg10a) : 0;
    var g = h.gpf.filter(function(v){ return v; });
    var pg = ph ? ph.gpf.filter(function(v){ return v; }) : [];
    var avg = g.length ? sum(g)/g.length : 0;
    var pavg = pg.length ? sum(pg)/pg.length : 0;

    if(!kg) return '<div class="card"><div class="empty">' +
      last.label + 'はまだ記録がありません</div></div>';

    return '<div class="card"><div class="big">' +
      '<div><div class="lab">収量</div><div class="val">'+fmt(kg/1000,1)+
        '<span class="un">t</span></div>'+ratioTag(kg,pkg)+'</div>' +
      '<div><div class="lab">10aあたり</div><div class="val">'+fmt(per)+
        '<span class="un">kg</span></div>'+ratioTag(per,pper)+'</div>' +
      '<div><div class="lab">平均果重</div><div class="val">'+fmt(avg,1)+
        '<span class="un">g</span></div>'+ratioTag(avg,pavg)+'</div>' +
      '</div></div>';
  }

  function render(){
    var area = (last.houses[cur] || {}).area;
    host.innerHTML =
      summary() +
      chartCard("月別の収量（kg）", "kg", "kg", 0) +
      chartCard("10aあたりの収量（kg）", "kg10a", "kg", 0) +
      chartCard("一果実あたりの重量（g）", "gpf", "g", 0) +
      monthTable() +
      breakdown("サイズの構成（"+last.label+"）", "sizes", D.sizes, "") +
      breakdown("等級の構成（"+last.label+"）", "grades", D.grades, "g") +
      (area ? '<footer style="padding-top:4px">'+cur+'　'+fmt(area*10,0)+'a</footer>' : "");
  }

  render();
})();

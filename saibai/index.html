<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%231F5C3D'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#F2F6F0; --card:#FFFFFF; --card-sub:#F7FAF6;
  --ink:#24291F; --muted:#6D7768; --line:#DFE7DB; --line-soft:#EDF2EA;
  --c:#1F5C3D;
  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --shadow-lift:0 2px 0 rgba(36,41,31,.05), 0 16px 32px -14px rgba(36,41,31,.4);
  --r-card:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --c:#6FBB7B;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --c:#6FBB7B;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 16px 32px -14px rgba(0,0,0,.85);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Quicksand",
              "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
header{padding:30px 0 8px;text-align:center}
.logo{width:62px;height:62px;margin:0 auto 12px;display:block}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:.02em}
.farm{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.lead{margin:18px 0 24px;text-align:center;font-size:14.5px;color:var(--muted);font-weight:600}
.menu{display:flex;flex-direction:column;gap:13px}
a.app{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r-card);
  padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
a.app:hover{border-color:var(--c);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
a.app:active{transform:translateY(0) scale(.985)}
a.app:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.app .badge{
  flex:none;min-width:56px;text-align:center;
  background:color-mix(in srgb, var(--c) 15%, var(--card));
  border:2px solid color-mix(in srgb, var(--c) 38%, transparent);
  color:var(--c);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:800;
}
.app .txt{flex:1;min-width:0}
.app .t{display:block;font-size:19px;font-weight:800}
.app .d{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.app .arrow{flex:none;font-size:20px;font-weight:800;color:var(--c)}
.back{
  display:block;text-align:center;margin-top:28px;
  font-size:13px;font-weight:800;color:var(--muted);text-decoration:none;
}
.back:hover{color:var(--ink)}
.note{
  margin-top:26px;background:var(--card-sub);border:2px dashed var(--line);
  border-radius:var(--r-card);padding:16px 18px;font-size:13px;color:var(--muted);font-weight:600;
}
</style>
</head>

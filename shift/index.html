<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A8FA8">
<title>シフト｜ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%232A8FA8'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#F2F6F0;
  --card:#FFFFFF;
  --card-sub:#F7FAF6;
  --ink:#24291F;
  --muted:#6D7768;
  --line:#DFE7DB;
  --line-soft:#EDF2EA;

  --accent:#2A8FA8;
  --tomato:#EE5340;
  --sat:#3E8FB0;
  --sun:#DD6630;

  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --shadow-lift:0 2px 0 rgba(36,41,31,.05), 0 14px 30px -14px rgba(36,41,31,.36);

  --r-card:18px;
  --r-chip:999px;

  /* JS から入れる。名前欄の幅・実働欄の幅・ヘッダーの高さ */
  --lane-left:74px;
  --hrs-w:54px;
  --head-h:150px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --accent:#5FBDD4; --tomato:#FF6E5B; --sat:#7FB8D6; --sun:#F58E5C;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
    --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --accent:#5FBDD4; --tomato:#FF6E5B; --sat:#7FB8D6; --sun:#F58E5C;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  --shadow-lift:0 2px 0 rgba(0,0,0,.3), 0 14px 30px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-padding-top:calc(var(--head-h) + 8px)}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Zen Maru Gothic",
              "Quicksand","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",
              system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 90px}
#body{padding-top:12px}

/* =====================================================================
   ヘッダー（ここが常に画面の上に残る）
   ===================================================================== */
header{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--ground) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.head-in{max-width:820px;margin:0 auto;padding:12px 16px 0}

/* スクロールでしまう部分 */
.foldable{
  overflow:hidden;
  transition:max-height .22s ease, opacity .18s ease, margin .22s ease;
  max-height:120px;opacity:1;
}
header.mini .foldable{max-height:0;opacity:0;margin-top:0;margin-bottom:0}

.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:2px}
h1{font-size:25px;font-weight:800;margin:0;letter-spacing:.01em}
.brand .farm{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.brand a{
  margin-left:auto;font-size:12.5px;font-weight:800;color:var(--muted);
  text-decoration:none;border-bottom:1.5px dotted var(--muted);
}
.brand a:hover{color:var(--ink);border-bottom-color:var(--ink)}

.frow{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:7px 0 3px;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flabel{flex:none;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.12em;width:52px}

.chip{
  flex:none;display:inline-flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:var(--r-chip);padding:5px 13px;font-size:13.5px;font-weight:700;
  font-family:inherit;cursor:pointer;white-space:nowrap;
  transition:border-color .15s, color .15s;
}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,currentColor);flex:none}
.chip[aria-pressed="true"]{color:var(--c,var(--ink));border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.chip .n{font-size:11px;font-weight:800;opacity:.6}

/* 期間の送り（ここは常に残る） */
.navbar{display:flex;align-items:center;gap:8px;padding:6px 0 6px}
.navbtn{
  flex:none;width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;
  display:grid;place-items:center;line-height:1;
}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.navttl{
  flex:1;text-align:center;font-size:16px;font-weight:800;
  letter-spacing:.01em;line-height:1.25;min-width:0;
}
.navttl small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
/* 絞り込み中の人を、しまわれても分かるように出す */
.nowwho{
  flex:none;display:none;align-items:center;gap:5px;
  font-size:12.5px;font-weight:800;color:var(--c);
  border:1.5px solid currentColor;border-radius:var(--r-chip);padding:3px 10px;
}
.nowwho i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.nowwho.on{display:inline-flex}

/* 時間のめもり（ここも常に残る）。トラックの左右と幅をそろえる */
.scalebar{
  position:relative;height:16px;
  padding-left:calc(var(--lane-left) + 25px);
  padding-right:calc(var(--hrs-w) + 25px);
  margin-bottom:5px;
}
.scalebar.off{display:none}
.scalebar .in{position:relative;height:100%}
.scalebar b{
  position:absolute;top:0;transform:translateX(-50%);
  font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;line-height:1;
}
.scalebar b.first{transform:translateX(-2px)}
.scalebar b.last{transform:translateX(calc(-100% + 2px))}

/* =====================================================================
   まとめ（人を選んだとき）
   ===================================================================== */
.summary{
  display:flex;background:var(--card);border:2px solid var(--line);
  border-radius:var(--r-card);padding:13px 8px;margin:14px 0 12px;box-shadow:var(--shadow);
}
.summary div{flex:1;text-align:center;border-right:1px solid var(--line-soft)}
.summary div:last-child{border-right:none}
.summary .k{display:block;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em}
.summary .v{display:block;font-size:23px;font-weight:800;line-height:1.3;color:var(--c,var(--ink))}
.summary .v em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}

/* =====================================================================
   週表示：1日のカード
   ===================================================================== */
.day{
  background:var(--card);border:2px solid var(--line);border-radius:var(--r-card);
  padding:0 14px 12px;margin-bottom:10px;box-shadow:var(--shadow);
}
.day.today{border-color:var(--accent);box-shadow:var(--shadow-lift)}
.day.empty{background:none;border-style:dashed;box-shadow:none}

/* 日付の見出し。そのカードを見ている間は上に貼りつく */
.dhead{
  position:sticky;top:var(--head-h);z-index:10;
  display:flex;align-items:center;gap:9px;
  margin:0 -14px 8px;padding:10px 14px 8px;
  background:var(--card);
  border-radius:calc(var(--r-card) - 2px) calc(var(--r-card) - 2px) 0 0;
  border-bottom:1px solid var(--line-soft);
}
.day.empty .dhead{background:var(--ground);border-bottom-color:transparent}
.dhead .dd{font-size:18px;font-weight:800;letter-spacing:.01em}
.dhead .wd{
  font-size:12px;font-weight:800;border-radius:var(--r-chip);
  padding:0 9px;border:1.5px solid var(--line);color:var(--muted);
}
.dhead .wd.sat{color:var(--sat);border-color:currentColor}
.dhead .wd.sun{color:var(--sun);border-color:currentColor}
.dhead .now{
  font-size:11px;font-weight:800;letter-spacing:.1em;
  background:var(--accent);color:#fff;border-radius:var(--r-chip);padding:1px 11px;
}
.dhead .cnt{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}

/* その日ぜんいんへのお知らせ */
.daymemo{
  display:flex;align-items:flex-start;gap:8px;
  background:color-mix(in srgb, var(--tomato) 9%, var(--card));
  border:1.5px solid color-mix(in srgb, var(--tomato) 34%, transparent);
  border-radius:12px;padding:7px 12px;margin:0 0 9px;
  font-size:13px;font-weight:800;line-height:1.5;
}
.daymemo::before{
  content:"！";flex:none;width:19px;height:19px;border-radius:50%;
  background:var(--tomato);color:#fff;font-size:12px;font-weight:800;
  display:grid;place-items:center;margin-top:2px;
}

/* 1人ぶんの行 */
.lane{display:flex;align-items:center;gap:9px;padding:4px 0 3px}
.lane .who{
  flex:none;width:var(--lane-left);display:flex;align-items:center;gap:6px;
  font-size:14px;font-weight:800;min-width:0;
}
.lane .who i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lane .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.track{
  position:relative;flex:1;height:26px;border-radius:8px;min-width:0;
  background:var(--card-sub);border:1px solid var(--line-soft);overflow:hidden;
}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.track .bar{
  position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--c);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 6px;color:#fff;font-size:10.5px;font-weight:800;
  overflow:hidden;white-space:nowrap;
}
.track .brk{
  position:absolute;top:3px;bottom:3px;background:var(--card);opacity:.92;
  border-left:1px dashed var(--line);border-right:1px dashed var(--line);
}
.lane .hrs{
  flex:none;width:var(--hrs-w);text-align:right;
  font-size:13px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;
}

/* 勤務なし・メモだけの日 */
.lane.only .track{background:none;border:none;overflow:visible;display:flex;align-items:center}
.memochip{
  display:inline-block;font-size:12.5px;font-weight:800;
  color:var(--tomato);border:1.5px dashed var(--tomato);
  border-radius:var(--r-chip);padding:1px 12px;background:var(--card);
}

/* その人あてのメモ（勤務時間があっても出せる） */
.lanememo{display:flex;gap:9px;padding:0 0 6px}
.lanememo .sp{flex:none;width:var(--lane-left)}
.lanememo .txt{
  flex:1;min-width:0;
  font-size:12.5px;font-weight:700;line-height:1.55;color:var(--ink);
  background:var(--card-sub);border-left:4px solid var(--c);
  border-radius:0 9px 9px 0;padding:4px 11px;
}
.lanememo .sp2{flex:none;width:var(--hrs-w)}

.day.empty .none{font-size:13.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0 6px}

/* =====================================================================
   月表示
   ===================================================================== */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.cal .wh{
  text-align:center;font-size:11px;font-weight:800;color:var(--muted);
  letter-spacing:.08em;padding-bottom:2px;
}
.cal .wh.sat{color:var(--sat)} .cal .wh.sun{color:var(--sun)}
.cal .cell{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  min-height:66px;padding:5px 4px 6px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;font-family:inherit;text-align:left;
  color:var(--ink);
}
.cal .cell:hover{border-color:var(--accent)}
.cal .cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cal .cell.out{background:none;border-style:dashed;opacity:.4;cursor:default}
.cal .cell.today{border-color:var(--accent);border-width:2.5px}
.cal .cell .n{font-size:12.5px;font-weight:800;color:var(--muted);line-height:1.2}
.cal .cell.today .n{color:var(--accent)}
.cal .dots{display:flex;flex-wrap:wrap;gap:3px}
.cal .dots i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
.cal .mytime{font-size:11px;font-weight:800;color:var(--c);line-height:1.35;letter-spacing:-.02em}
.cal .mk{font-size:10px;font-weight:800;color:var(--tomato);line-height:1.3}

/* =====================================================================
   あいことば
   ===================================================================== */
.gate{
  max-width:400px;margin:50px auto;background:var(--card);
  border:2px solid var(--line);border-radius:var(--r-card);
  padding:26px 22px;box-shadow:var(--shadow);text-align:center;
}
.gate h2{font-size:19px;font-weight:800;margin:0 0 6px}
.gate p{font-size:13.5px;color:var(--muted);font-weight:600;margin:0 0 18px}
.gate input{
  width:100%;font-family:inherit;font-size:19px;font-weight:800;text-align:center;
  padding:11px 14px;border:2px solid var(--line);border-radius:14px;
  background:var(--card-sub);color:var(--ink);
}
.gate input:focus{outline:none;border-color:var(--accent)}
.gate button{
  width:100%;margin-top:12px;font-family:inherit;font-size:16px;font-weight:800;
  padding:12px;border:none;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;
}
.gate .ng{color:var(--tomato);font-size:13px;font-weight:800;margin-top:10px;min-height:20px}

.loading{
  text-align:center;color:var(--muted);font-weight:700;padding:50px 16px;
  font-size:14px;white-space:pre-line;line-height:1.8;
}
.retrybtn{
  display:inline-block;margin-top:14px;font-family:inherit;font-size:15px;font-weight:800;
  padding:11px 26px;border:2px solid var(--line);border-radius:var(--r-chip);
  background:var(--card);color:var(--muted);cursor:pointer;
}
.retrybtn:hover{color:var(--ink);border-color:var(--muted)}

/* そっと知らせるための帯 */
.tell{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--ground);border-radius:var(--r-chip);
  padding:9px 18px;font-size:12.5px;font-weight:800;line-height:1.6;
  box-shadow:var(--shadow-lift);opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:92vw;text-align:center;
}
.tell.on{opacity:1}

@media (max-width:520px){
  h1{font-size:22px}
  .wrap{padding:0 12px 90px}
  .head-in{padding:10px 12px 0}
  .navttl{font-size:15px}
  .cal{gap:3px}
  .cal .cell{min-height:56px;border-radius:10px}
}
</style>
</head>
<body>

<header id="head">
  <div class="head-in">

    <div class="foldable">
      <div class="brand">
        <h1>シフト</h1>
        <span class="farm">ハッピートマトファーム</span>
        <a href="../minna/">≡ めにゅー</a>
      </div>
    </div>

    <div class="foldable" id="filters" hidden>
      <div class="frow" id="who-filter" role="group" aria-label="人でしぼる">
        <span class="flabel">だれ</span>
      </div>
      <div class="frow" role="group" aria-label="表示のしかた">
        <span class="flabel">ひょうじ</span>
        <button class="chip mode" data-mode="week"  aria-pressed="true">週で見る</button>
        <button class="chip mode" data-mode="month" aria-pressed="false">月で見る</button>
        <button class="chip" id="today">きょうへ</button>
      </div>
    </div>

    <div class="navbar" id="navbar" hidden>
      <button class="navbtn" id="prev" aria-label="まえ">‹</button>
      <div class="navttl" id="navttl"></div>
      <span class="nowwho" id="nowwho"><i></i><b></b></span>
      <button class="navbtn" id="next" aria-label="つぎ">›</button>
    </div>

    <div class="scalebar off" id="scalebar"><div class="in"></div></div>

  </div>
</header>

<div class="wrap">
  <div id="gate" hidden>
    <div class="gate">
      <h2>あいことば</h2>
      <p>はじめての端末だけ 入力してください</p>
      <input id="pw" type="text" inputmode="text" autocomplete="off" placeholder="ひらがなで">
      <button id="pw-go">ひらく</button>
      <div class="ng" id="pw-ng"></div>
    </div>
  </div>

  <div id="loading" class="loading">読み込んでいます…</div>
  <div id="body"></div>
</div>

<div class="tell" id="tell"></div>

<script>
/* =====================================================================
   データ
   1件 = 「ある日・ある人」ぶん。
     d … 日付 "YYYY-MM-DD"
     p … 名前（空文字なら「その日ぜんいんへのお知らせ」）
     s,e … 勤務の開始・終了（無い日は null）
     b1s,b1e,b2s,b2e … 休憩
     r,w … 休憩時間・実働（Excelの計算結果）
     m … メモ（勤務時間があっても付けられる）
   ===================================================================== */
const API = "https://script.google.com/macros/s/AKfycbzYkVlVngoC6CXf9HKPlfnFbJHs5lrarw2J9dLjdqaqvdVQFIN15aMr5EyNSA8tj1UU/exec";
const PW_KEY = "htf_shift_pw";      // あいことばを覚えておく場所（端末ごと）

/* 手元で見え方を確かめるときだけ、ここにデータが差し込まれる。
   ふだんは空で、Apps Script から読む */
const PRELOAD = /*__DATA__*/[];

let DATA = [];

/* 人の色。CSS変数ではなくここに直接書く。
   1か所にまとめておけば、どの画面でも同じ人が同じ色になる */
const PALETTE = ["#E0688A","#4E9A5A","#8A5CC4","#3E8FB0","#DD6630","#D9960F",
                 "#C0517A","#2E7D5B","#6F4CA8","#2A6E8C"];
const GRAY = "#6D7768";

/* =====================================================================
   小さな道具
   ===================================================================== */
const $  = s => document.querySelector(s);
const WD = ["日","月","火","水","木","金","土"];

/** "HH:MM" → 0時からの分。空なら null */
function toMin(t){
  if(!t) return null;
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
/** 分 → "H:MM" */
function fromMin(n){ return Math.floor(n/60) + ":" + String(n%60).padStart(2,"0"); }
/** "YYYY-MM-DD" → Date（地元時間・時刻なし） */
function toDate(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
/** Date → "YYYY-MM-DD" */
function key(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0")
       + "-" + String(dt.getDate()).padStart(2,"0");
}
function addDays(dt, n){ const d = new Date(dt); d.setDate(d.getDate()+n); return d; }
/** その日を含む週の月曜日 */
function monday(dt){
  const d = new Date(dt);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 月=0 … 日=6
  return d;
}
function esc(s){
  return String(s).replace(/[&<>"]/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

/* =====================================================================
   データの下ごしらえ
   ===================================================================== */
/* 矢印つきのメモは「隣の人・隣の日」を指していることが多く、
   誰のものか決めつけられない。その日ぜんいんへのお知らせとして出す */
/* 矢印つきのメモは「隣の人・隣の日」を指していることが多く、
   誰のものか決めつけられない。その日ぜんいんへのお知らせとして出す */
const ARROW = /[↑↓←→⇧⇩⇦⇨]/;

let byDate = new Map();   // 日付 → { rows:[人の行], notes:[全員あて] }
let counts = new Map();   // 名前 → 出勤日数
let PEOPLE = [];          // 名前の一覧（出勤日数の多い順）
let COLOR  = new Map();
let T0 = 8*60, T1 = 16*60, SPAN = 8*60;   // 時間のめもりの範囲（分）
let ALL_DATES = [], FIRST = "", LAST = "";

const colorOf = p => COLOR.get(p) || GRAY;
const pct = m => ((m - T0) / SPAN) * 100;

/* 退職した人は、画面にだけ出さない。
   スプレッドシートの記録は消さない（賃金台帳などで過去の勤務を見返すため）。

   このファイルは GitHub で公開されるので、氏名は書かずに
   下の nameHash() で変換した値だけを置く。名前→値の変換は一方通行なので、
   ソースを読まれても誰のことか分からない。

   ▼ 増やしたいとき
     1. 数値を出す:  py -c "..." （手順は下の nameHash と同じ計算）
     2. その値を RETIRED_HASH に足す
   ▼ 復帰したとき
     その行を消すだけでよい */
const RETIRED_HASH = [
  "53795450",   // 2026-08 退職
];

/** 名前を短い値に変換する（FNV-1a 32bit）。同じ名前なら必ず同じ値になる */
function nameHash(s){
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);   // 32bit で掛け算する（桁あふれを切り捨てる）
  }
  return (h >>> 0).toString(16);  // 符号なしにして16進の文字列にする
}

/** 読み込んだデータを、画面が使いやすい形に組み直す */
function setup(rows){
  /* 退職者の行を外す。名前が空の行は「その日ぜんいんへのお知らせ」なので残す */
  DATA = (rows || []).filter(r => !r || !r.p || !RETIRED_HASH.includes(nameHash(r.p)));

  byDate = new Map();
  const slot = d => {
    if(!byDate.has(d)) byDate.set(d, { rows:[], notes:[] });
    return byDate.get(d);
  };
  for(const r of DATA){
    if(!r || !r.d) continue;
    const sl = slot(r.d);
    const dayWide = !r.p || (r.m && ARROW.test(r.m) && !r.s);
    if(dayWide && r.m){
      sl.notes.push({ p:r.p || "", m:r.m });
      if(!r.s) continue;            // 勤務が無いならこれで終わり
    }
    sl.rows.push(r);
  }

  counts = new Map();
  for(const r of DATA){
    if(!r.p) continue;
    counts.set(r.p, (counts.get(r.p)||0) + (r.s ? 1 : 0));
  }
  PEOPLE = [...counts.entries()].sort((a,b) => b[1]-a[1]).map(e => e[0]);
  COLOR = new Map();
  PEOPLE.forEach((p,i) => COLOR.set(p, PALETTE[i % PALETTE.length]));

  /* 時間のめもりの範囲。データの最小・最大から1時間きざみで決める */
  let lo = 24*60, hi = 0;
  for(const r of DATA){
    const s = toMin(r.s), e = toMin(r.e);
    if(s !== null && s < lo) lo = s;
    if(e !== null && e > hi) hi = e;
  }
  if(hi <= lo){ lo = 8*60; hi = 16*60; }
  T0 = Math.floor(lo/60)*60;
  T1 = Math.ceil(hi/60)*60;
  SPAN = T1 - T0;

  ALL_DATES = [...byDate.keys()].sort();
  FIRST = ALL_DATES[0] || "";
  LAST  = ALL_DATES[ALL_DATES.length-1] || "";

  initCursor();
}

/* =====================================================================
   画面の状態
   ===================================================================== */
const state = {
  who:  "",
  mode: "week",
  cur:  monday(new Date()),
  mon:  new Date(),
};

/* 今日の週にデータが無ければ、いちばん近いデータのある週に寄せる */
function initCursor(){
  const has = d => {
    for(let i=0;i<7;i++) if(byDate.has(key(addDays(d,i)))) return true;
    return false;
  };
  state.cur = monday(new Date());
  state.mon = new Date();
  if(has(state.cur) || !ALL_DATES.length) return;

  /* 今日からの日数の差がいちばん小さい日を選ぶ。
     以前は「今日が最終日より後なら最終日、そうでなければ先頭日」としていたが、
     8月のようにデータが空いている時期だと、先の 9月ではなく
     1年前の先頭日（2025-09-01）へ飛んでしまっていた */
  const today = toDate(key(new Date()));
  let target = toDate(ALL_DATES[0]), best = Infinity;
  for(const d of ALL_DATES){
    const diff = Math.abs(toDate(d) - today);
    if(diff < best){ best = diff; target = toDate(d); }
  }
  state.cur = monday(target);
  state.mon = new Date(target);
}

/* =====================================================================
   えがく
   ===================================================================== */
function laneLeftPx(){ return window.innerWidth < 520 ? 62 : 74; }
function hrsPx()     { return window.innerWidth < 520 ? 46 : 54; }

/** その日の、絞り込み後の「人の行」 */
function rowsOf(dkey){
  const sl = byDate.get(dkey);
  if(!sl) return [];
  let rs = sl.rows.filter(r => r.p);
  if(state.who) rs = rs.filter(r => r.p === state.who);
  rs.sort((a,b) => (toMin(a.s) ?? 9999) - (toMin(b.s) ?? 9999)
                   || PEOPLE.indexOf(a.p) - PEOPLE.indexOf(b.p));
  return rs;
}
/** その日の「全員あてのお知らせ」。人を選んでいても消さない */
function notesOf(dkey){
  const sl = byDate.get(dkey);
  return sl ? sl.notes : [];
}

/** 1時間ごとの目じるし（トラックの中の縦線） */
function ticksHTML(){
  let s = "";
  for(let m = T0 + 60; m < T1; m += 60) s += `<i class="tick" style="left:${pct(m)}%"></i>`;
  return s;
}

/** 1人ぶん。勤務のバーと、その下のメモ。どちらか片方でもよい */
function laneHTML(r){
  const c = colorOf(r.p);
  const s = toMin(r.s), e = toMin(r.e);
  let html = "";

  if(s !== null && e !== null){
    let brks = "";
    for(const [bs,be] of [[r.b1s,r.b1e],[r.b2s,r.b2e]]){
      const a = toMin(bs), b = toMin(be);
      if(a === null || b === null || b <= a) continue;
      brks += `<i class="brk" style="left:${pct(a)}%;width:${(b-a)/SPAN*100}%"></i>`;
    }
    html += `<div class="lane" style="--c:${c}">
      <div class="who"><i></i><span>${esc(r.p)}</span></div>
      <div class="track">${ticksHTML()}
        <i class="bar" style="left:${pct(s)}%;width:${(e-s)/SPAN*100}%">
          <b>${esc(r.s)}</b><b>${esc(r.e)}</b>
        </i>${brks}
      </div>
      <div class="hrs">${r.w ? esc(String(r.w).replace(/^0/,"")) : ""}</div>
    </div>`;
  }else{
    // 勤務なし。メモを札で出す
    html += `<div class="lane only" style="--c:${c}">
      <div class="who"><i></i><span>${esc(r.p)}</span></div>
      <div class="track"><span class="memochip">${esc(r.m || "おやすみ")}</span></div>
      <div class="hrs"></div>
    </div>`;
    return html;   // 札に出したので、下のメモ行は要らない
  }

  if(r.m){
    html += `<div class="lanememo" style="--c:${c}">
      <div class="sp"></div>
      <div class="txt">${esc(r.m)}</div>
      <div class="sp2"></div>
    </div>`;
  }
  return html;
}

/** その日ぜんいんへのお知らせ */
function noteHTML(n){
  const who = n.p ? `<b style="color:${colorOf(n.p)}">${esc(n.p)}：</b> ` : "";
  return `<div class="daymemo"><div>${who}${esc(n.m)}</div></div>`;
}

/** まとめ（人を選んだときだけ） */
function summaryHTML(rs){
  if(!state.who) return "";
  const days = rs.filter(r => r.s && r.e).length;
  let mins = 0;
  for(const r of rs){ const w = toMin(r.w); if(w !== null) mins += w; }
  return `<div class="summary" style="--c:${colorOf(state.who)}">
    <div><span class="k">しゅっきん</span><span class="v">${days}<em>日</em></span></div>
    <div><span class="k">じつどう</span><span class="v">${fromMin(mins)}<em>時間</em></span></div>
  </div>`;
}

/* ---- 週表示 ---- */
function renderWeek(){
  const mon = state.cur, sun = addDays(mon, 6);
  $("#navttl").innerHTML =
    `${mon.getMonth()+1}月${mon.getDate()}日 – ${sun.getMonth()+1}月${sun.getDate()}日`
    + `<small>${mon.getFullYear()}年</small>`;

  const today = key(new Date());
  const week = [];
  for(let i=0;i<7;i++) week.push(addDays(mon, i));

  let html = summaryHTML(week.flatMap(d => rowsOf(key(d))));

  for(const d of week){
    const dk = key(d), rs = rowsOf(dk), ns = notesOf(dk);
    const w = d.getDay();
    const wcls = w === 6 ? "sat" : w === 0 ? "sun" : "";
    const isToday = dk === today;
    const head = `<div class="dhead">
        <span class="dd">${d.getMonth()+1}/${d.getDate()}</span>
        <span class="wd ${wcls}">${WD[w]}</span>
        ${isToday ? '<span class="now">きょう</span>' : ""}
        ${rs.length ? `<span class="cnt">${rs.filter(r => r.s && r.e).length}人</span>` : ""}
      </div>`;

    if(!rs.length && !ns.length){
      html += `<div class="day empty">${head}
        <div class="none">${state.who ? "おやすみ" : "だれもいません"}</div></div>`;
      continue;
    }
    html += `<div class="day ${isToday ? "today" : ""}${rs.length ? "" : " empty"}">
      ${head}
      ${ns.map(noteHTML).join("")}
      ${rs.map(laneHTML).join("")}
      ${rs.length ? "" : `<div class="none">${state.who ? "おやすみ" : "だれもいません"}</div>`}
    </div>`;
  }
  $("#body").innerHTML = html;
}

/* ---- 月表示 ---- */
function renderMonth(){
  const y = state.mon.getFullYear(), m = state.mon.getMonth();
  $("#navttl").innerHTML = `${m+1}月<small>${y}年</small>`;

  const start = monday(new Date(y, m, 1));
  const today = key(new Date());

  let cells = "";
  for(let i=0;i<7;i++){
    const w = (i+1) % 7;
    cells += `<div class="wh ${w===6?"sat":w===0?"sun":""}">${WD[w]}</div>`;
  }

  const monthRows = [];
  let d = new Date(start);
  for(let i=0;i<42;i++){
    const dk = key(d), inMonth = d.getMonth() === m;
    if(!inMonth){
      cells += `<div class="cell out"><span class="n">${d.getDate()}</span></div>`;
    }else{
      const rs = rowsOf(dk), ns = notesOf(dk);
      monthRows.push(...rs);
      let inner = "";
      if(state.who){
        const r = rs[0];
        if(r && r.s && r.e){
          inner = `<span class="mytime" style="--c:${colorOf(state.who)}">`
                + `${esc(r.s)}<br>${esc(r.e)}</span>`;
        }else if(r && r.m){
          inner = `<span class="mk">${esc(r.m.slice(0,4))}</span>`;
        }
        if(rs.some(r2 => r2.s && r2.m) || ns.length) inner += `<span class="mk">メモ</span>`;
      }else{
        inner = `<div class="dots">`
              + rs.filter(r => r.s).map(r => `<i style="--c:${colorOf(r.p)}"></i>`).join("")
              + `</div>`;
        if(rs.some(r => r.m) || ns.length) inner += `<span class="mk">メモ</span>`;
      }
      cells += `<button class="cell ${dk===today?"today":""}" data-jump="${dk}">
        <span class="n">${d.getDate()}</span>${inner}</button>`;
    }
    d = addDays(d, 1);
    if(i >= 34 && d.getMonth() !== m) break;
  }

  $("#body").innerHTML = summaryHTML(monthRows) + `<div class="cal">${cells}</div>`;
  $("#body").querySelectorAll("[data-jump]").forEach(b => {
    b.addEventListener("click", () => {
      state.cur = monday(toDate(b.dataset.jump));
      setMode("week");
      window.scrollTo({ top:0 });
    });
  });
}

/** 時間のめもりを描く（週表示のときだけ出す） */
function renderScale(){
  const bar = $("#scalebar");
  if(state.mode !== "week"){ bar.classList.add("off"); return; }
  bar.classList.remove("off");
  let s = "";
  for(let m = T0; m <= T1; m += 60){
    const cls = m === T0 ? "first" : m === T1 ? "last" : "";
    s += `<b class="${cls}" style="left:${pct(m)}%">${m/60}時</b>`;
  }
  bar.querySelector(".in").innerHTML = s;
}

function renderNowWho(){
  const el = $("#nowwho");
  if(!state.who){ el.classList.remove("on"); return; }
  el.classList.add("on");
  el.style.setProperty("--c", colorOf(state.who));
  el.querySelector("b").textContent = state.who;
}

function render(){
  // 名前欄・実働欄の幅を CSS 変数に入れる。めもりと行の位置をそろえるため
  document.body.style.setProperty("--lane-left", laneLeftPx() + "px");
  document.body.style.setProperty("--hrs-w", hrsPx() + "px");
  renderScale();
  renderNowWho();
  if(state.mode === "week") renderWeek(); else renderMonth();
  measureHead();
}

/* ヘッダーの高さを測って CSS 変数に入れる。
   日付の見出しは、この高さのぶんだけ下に貼りつく */
function measureHead(){
  document.body.style.setProperty("--head-h", $("#head").offsetHeight + "px");
}

/* =====================================================================
   そうさ
   ===================================================================== */
function buildWhoChips(){
  const box = $("#who-filter");
  // 読み直したときに二重にならないよう、一度消してから作る
  box.querySelectorAll(".chip").forEach(c => c.remove());
  const mk = (label, value, color, n) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state.who === value));
    b.dataset.who = value;
    if(color) b.style.setProperty("--c", color);
    b.innerHTML = (color ? '<span class="dot"></span>' : "")
                + esc(label) + (n ? ` <span class="n">${n}</span>` : "");
    b.addEventListener("click", () => {
      state.who = value;
      box.querySelectorAll(".chip").forEach(c =>
        c.setAttribute("aria-pressed", String(c.dataset.who === value)));
      render();
    });
    box.appendChild(b);
  };
  mk("ぜんぶ", "", null, 0);
  for(const p of PEOPLE) mk(p, p, colorOf(p), counts.get(p));
}

function setMode(mode){
  state.mode = mode;
  document.querySelectorAll(".chip.mode").forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.mode === mode)));
  render();
}

function wire(){
  document.querySelectorAll(".chip.mode").forEach(c =>
    c.addEventListener("click", () => setMode(c.dataset.mode)));

  $("#prev").addEventListener("click", () => {
    if(state.mode === "week") state.cur = addDays(state.cur, -7);
    else state.mon = new Date(state.mon.getFullYear(), state.mon.getMonth()-1, 1);
    render();
  });
  $("#next").addEventListener("click", () => {
    if(state.mode === "week") state.cur = addDays(state.cur, 7);
    else state.mon = new Date(state.mon.getFullYear(), state.mon.getMonth()+1, 1);
    render();
  });
  $("#today").addEventListener("click", () => {
    state.cur = monday(new Date());
    state.mon = new Date();
    render();
    window.scrollTo({ top:0, behavior:"smooth" });
  });

  /* 下にスクロールしたらタイトルと絞り込みをしまう。
     少しでも上に動かせば戻す（見たいときにすぐ出る） */
  const head = $("#head");
  let lastY = 0;
  window.addEventListener("scroll", () => {
    const y = window.scrollY;
    if(y < 60)                head.classList.remove("mini");
    else if(y > lastY + 5)    head.classList.add("mini");
    else if(y < lastY - 5)    head.classList.remove("mini");
    lastY = y;
  }, { passive:true });

  /* ヘッダーの高さが変わったら測り直す（しまう動きの途中も含む） */
  if(window.ResizeObserver) new ResizeObserver(measureHead).observe(head);
  head.addEventListener("transitionend", measureHead);

  let tw = null;
  window.addEventListener("resize", () => {
    clearTimeout(tw); tw = setTimeout(render, 150);
  });
}

/* =====================================================================
   読み込み
   ===================================================================== */
function show(which, msg){
  $("#gate").hidden    = which !== "gate";
  $("#loading").hidden = which !== "loading";
  $("#filters").hidden = which !== "app";
  $("#navbar").hidden  = which !== "app";
  $("#scalebar").classList.toggle("off", which !== "app" || state.mode !== "week");
  $("#body").innerHTML = which === "app" ? $("#body").innerHTML : "";
  if(which === "loading") $("#loading").innerHTML = msg || "読み込んでいます…";
  if(which === "gate")    $("#pw-ng").textContent = msg || "";
  measureHead();
}

/* 前に読んだシフトの控え（この端末だけ）。
   ハウスの中は電波が弱く、Google側が一時的に応答しないこともあるので、
   まず控えを出してから、裏で新しいものを取りにいく */
const CACHE_KEY = "htf_shift_cache";

function cacheYomu(){
  try{
    const v = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    return (v && v.length) ? v : null;
  }catch(e){ return null; }
}
function cacheKaku(list){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(list)); }catch(e){ /* いっぱいでも動く */ }
}

let tellTimer = null;
function tell(msg){
  const el = $("#tell");
  el.innerHTML = msg;
  el.classList.add("on");
  clearTimeout(tellTimer);
  tellTimer = setTimeout(() => el.classList.remove("on"), 5000);
}

/* 時間切れつきの読み込み。
   これが無いと、返事が来ないときに「読み込んでいます…」のまま止まる */
function toruJSON(url, byo){
  if(!window.AbortController) return fetch(url).then(r => r.json());
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), byo);
  return fetch(url, { signal: ac.signal })
    .then(r => r.json())
    .finally(() => clearTimeout(t));
}

function dasu(list, pw){
  try{ localStorage.setItem(PW_KEY, pw); }catch(err){ /* 保存できなくても動く */ }
  setup(list);
  buildWhoChips();
  show("app");
  render();
}

function load(pw, nokori){
  if(nokori === undefined) nokori = 3;

  // 控えがあれば先に出してしまう。待たせない
  const mae = cacheYomu();
  if(mae) dasu(mae, pw);
  else    show("loading");

  toruJSON(API + "?want=shifts&pw=" + encodeURIComponent(pw)
               + "&t=" + Date.now(), 30000)
    .then(j => {
      if(!j.ok){
        if(j.need === "aikotoba"){
          localStorage.removeItem(PW_KEY);
          localStorage.removeItem(CACHE_KEY);
          show("gate", "あいことばがちがいます");
          return;
        }
        throw new Error(j.error || "読み込めませんでした");
      }
      cacheKaku(j.shifts || []);
      dasu(j.shifts || [], pw);
    })
    .catch(() => {
      if(nokori > 0){
        if(!mae) show("loading", "つながりません。もう一度ためしています…");
        setTimeout(() => load(pw, nokori - 1), 3000);
        return;
      }
      if(mae){
        // 見えてはいるので、古いかもしれないことだけ知らせる
        tell("いま最新を取れませんでした。<br>前に読んだシフトを表示しています");
        return;
      }
      show("loading",
        'いま読み込めません\n' +
        '<span style="font-size:13px">少し待つと直ることがほとんどです</span>\n' +
        '<button id="retry" class="retrybtn" type="button">もう一度ためす</button>');
      const b = document.getElementById("retry");
      if(b) b.addEventListener("click", () => load(pw, 3));
    });
}

/* URL に付いた合言葉を読む。
   例: https://happy-tomato-farm.github.io/shift/#pw=あいことば

   なぜ必要か:
   LINE などのアプリ内ブラウザは、閉じるたびに端末のメモ帳（localStorage）を捨てる。
   そのため「一度入れたら覚えておく」方式だけでは毎回あいことばを聞かれてしまう。
   リンク自体に持たせておけば、どのブラウザで開いても聞かれない。

   「#」より後ろはサーバーに送られないため、GitHub 側のアクセス記録には残らない。
   ?pw= 形式のリンクを配ってしまった場合も拾えるよう、両方を見ている。 */
function urlNoAikotoba(){
  const mirusaki = [location.hash, location.search];
  for(let i = 0; i < mirusaki.length; i++){
    const s = mirusaki[i];
    if(!s) continue;
    // 先頭の「#」「?」を落としてから pw=… を探す
    const m = s.slice(1).match(/(?:^|&)pw=([^&]*)/);
    if(!m) continue;
    try{ return decodeURIComponent(m[1]).trim(); }
    catch(e){ return m[1].trim(); }   // ％の並びが壊れたリンクでも止まらないように
  }
  return "";
}

function start(){
  wire();

  // 手元で見え方を確かめるとき（プレビュー）は、そのまま表示する
  if(PRELOAD && PRELOAD.length){
    setup(PRELOAD);
    buildWhoChips();
    show("app");
    render();
    return;
  }

  $("#pw-go").addEventListener("click", () => {
    const v = $("#pw").value.trim();
    if(!v){ $("#pw-ng").textContent = "あいことばを入れてください"; return; }
    load(v);
  });
  $("#pw").addEventListener("keydown", e => {
    if(e.key === "Enter") $("#pw-go").click();
  });

  /* あいことばを探す順番。
       ① URL に付いていれば、それ（LINE から開く人向け）
       ② 無ければ、前に入れて端末が覚えているもの（これまで通り）
       ③ それも無ければ、あいことばの画面（これまで通り）
     ①に当てはまらない人の動きは、今までと変わらない。 */
  const fromURL = urlNoAikotoba();
  const saved   = localStorage.getItem(PW_KEY) || "";
  const pw      = fromURL || saved;

  if(pw) load(pw);
  else   show("gate");
}

start();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4E9A5A">
<title>マニュアル｜ハッピートマトファーム</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='38' r='22' fill='%23EE5340'/%3E%3Cpath d='M32 20 L22 10 M32 20 L42 10 M32 20 L32 6' stroke='%234E9A5A' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
/* 色や形の決まりは、みんなのページ・スライドのマニュアル（manual.html）と同じ。
   別のページに飛んだ感じがしないようにそろえてある */
:root{
  --ground:#F2F6F0; --card:#FFFFFF; --card-sub:#F7FAF6;
  --ink:#24291F; --muted:#6D7768; --line:#DFE7DB; --line-soft:#EDF2EA;
  --tomato:#EE5340; --leaf:#4E9A5A; --sun:#D9960F; --teal:#2A8FA8;
  --shadow:0 1px 0 rgba(36,41,31,.04), 0 6px 18px -10px rgba(36,41,31,.28);
  --r-card:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191D18; --card:#232821; --card-sub:#1E231D;
    --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
    --tomato:#FF6E5B; --leaf:#6FBB7B; --sun:#F0BC4E; --teal:#5FBDD4;
    --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#191D18; --card:#232821; --card-sub:#1E231D;
  --ink:#EDF1E9; --muted:#9BA694; --line:#343B31; --line-soft:#2B3128;
  --tomato:#FF6E5B; --leaf:#6FBB7B; --sun:#F0BC4E; --teal:#5FBDD4;
  --shadow:0 1px 0 rgba(0,0,0,.28), 0 6px 18px -10px rgba(0,0,0,.7);
}
/* hidden は display の指定に負けるので、ここで必ず消す */
[hidden]{display:none !important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Zen Maru Gothic",
              "Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}

/* 上に貼りつく「戻る」。一覧ではアプリ一覧へ、手順書の中ではマニュアル一覧へ戻る */
.back{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;
  min-height:46px;padding:0 16px;text-decoration:none;
  font-size:14.5px;font-weight:800;color:var(--teal);
  background:color-mix(in srgb,var(--ground) 94%,transparent);
  border-bottom:1px solid var(--line-soft);
}

header{padding:16px 0 4px;text-align:center}
.logo{width:52px;height:52px;margin:0 auto 8px;display:block}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:.02em}
.farm{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.lead{margin:12px 0 18px;text-align:center;font-size:14.5px;color:var(--muted);font-weight:600}

/* ===== 一覧 ===== */
.shelf-h{font-size:13.5px;font-weight:800;color:var(--muted);margin:22px 4px 8px}
.shelf-h small{font-weight:700;margin-left:6px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{
  display:flex;gap:14px;align-items:center;padding:14px 16px;min-height:84px;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r-card);
  box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
}
.card:active{transform:scale(.99)}
.card .ic{flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  font-size:27px;background:var(--bgc);border:2px solid var(--bdc)}
.card .tx{flex:1;min-width:0}
.card .tt{display:block;font-size:17px;font-weight:800;line-height:1.35}
.card .sb{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.card .mt{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:5px}
.card .go{flex:none;color:var(--muted);font-size:22px;font-weight:800}
/* 手順書は緑、スライドの本は赤 */
.k-tejun{--bgc:color-mix(in srgb,var(--leaf) 14%,var(--card));--bdc:color-mix(in srgb,var(--leaf) 45%,var(--line))}
.k-slide{--bgc:color-mix(in srgb,var(--tomato) 12%,var(--card));--bdc:color-mix(in srgb,var(--tomato) 40%,var(--line))}

/* ===== 手順書 ===== */
.dt{font-size:22px;font-weight:800;margin:14px 0 2px;line-height:1.35}
.upd{font-size:12.5px;color:var(--muted);font-weight:700}
.why{background:var(--card);border-left:5px solid var(--leaf);border-radius:14px;
  padding:13px 15px;margin:14px 0;font-size:15px;box-shadow:var(--shadow)}
.prog{margin:12px 0 4px;font-size:13px;font-weight:800;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.nosave{margin:8px 0;padding:9px 12px;border-radius:12px;font-size:13px;font-weight:700;
  background:color-mix(in srgb,var(--sun) 14%,var(--card));color:var(--ink)}

/* たたんである「まとまり」。作業する部分だけ開けばよい */
details.part{background:var(--card);border:2px solid var(--line);border-radius:18px;
  margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
details.part > summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  gap:11px;padding:12px 15px;min-height:60px}
details.part > summary::-webkit-details-marker{display:none}
.part .pk{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-size:14.5px;font-weight:800;color:#fff;background:var(--teal)}
.part.lst .pk{background:var(--muted)}
.part.tip .pk{background:var(--sun)}
.part .pt{flex:1;min-width:0}
.part .pt b{display:block;font-size:16px;font-weight:800;line-height:1.35}
.part .pt small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.part .pc{flex:none;font-size:12.5px;font-weight:800;color:var(--muted)}
.part .pc.done{color:var(--leaf)}
.part .pc::after{content:"　▼"}
.part[open] .pc::after{content:"　▲"}
.part .body{padding:2px 14px 12px;border-top:1px dashed var(--line-soft)}

/* 1行ごと。行のどこを押してもチェックが入る（指の的を大きくする） */
.step{display:flex;gap:11px;align-items:flex-start;padding:12px 2px;
  border-bottom:1px solid var(--line-soft);cursor:pointer}
.step:last-child{border-bottom:none}
.step input{flex:none;width:26px;height:26px;margin:1px 0 0;accent-color:var(--leaf);cursor:pointer}
.step .n{flex:none;min-width:1.3em;font-weight:800;color:var(--teal)}
.step .st{flex:1;min-width:0;font-size:15.5px}
.step .st .tx{display:block}
.step .st .d{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-top:2px}
.step.on .tx{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.ok,.warn{display:block;margin-top:7px;padding:8px 11px;border-radius:10px;font-size:13.5px;font-weight:700}
.ok{background:color-mix(in srgb,var(--leaf) 11%,var(--card))}
.ok::before{content:"こうなれば成功　";color:var(--leaf);font-weight:800}
.warn{background:color-mix(in srgb,var(--sun) 13%,var(--card))}
.warn::before{content:"注意　";color:var(--sun);font-weight:800}

/* コマンドなど、そのまま打つ文字 */
code{font-family:Consolas,"Courier New",monospace;font-size:13.5px;background:var(--card-sub);
  border:1px solid var(--line);border-radius:6px;padding:1px 5px;word-break:break-all}

/* ===== 図（まとまりの頭に置く）=====
   SVG の中の色もここで決める（暗い画面でも読めるように、色は変数から取る）。
   クラス名は v- で始める（.part .pt などの既存の名前とぶつけないため） */
.fig{margin:10px 0 6px;padding:10px 8px 8px;background:var(--card-sub);
  border:1px solid var(--line);border-radius:14px}
.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.fig figcaption{margin-top:6px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.fig .v-b{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.fig .v-g{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 4}
.fig .v-t{fill:var(--ink);font-size:13px;font-weight:800}
.fig .v-s{fill:var(--muted);font-size:11.5px;font-weight:700}
.fig .v-pw{fill:none;stroke:var(--sun);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .v-usb{fill:none;stroke:var(--muted);stroke-width:3;stroke-linejoin:round}
.fig .v-ga{fill:none;stroke:#D9483B;stroke-width:3.5;stroke-linejoin:round}
.fig .v-gc{fill:none;stroke:#2F7FD1;stroke-width:3.5;stroke-linejoin:round}
.fig .v-rf{fill:none;stroke:var(--teal);stroke-width:2.5;stroke-dasharray:6 5}
.fig .v-ln{fill:none;stroke:var(--ink);stroke-width:1.5}
.fig .v-air{fill:none;stroke:var(--teal);stroke-width:2.5}
.fig .v-ant{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.fig .v-bolt{stroke:var(--ink);stroke-width:3}
.fig .v-win{stroke:var(--muted);stroke-width:6}
.fig .v-gr{stroke:var(--leaf);stroke-width:3}
.fig .v-ah{fill:var(--ink)}
.fig .v-aht{fill:var(--teal)}
.fig .v-pa{fill:#D9483B} .fig .v-pb{fill:#777} .fig .v-pc{fill:#2F7FD1}
.fig .v-pl{fill:#fff;font-size:11px;font-weight:800}
.fig .v-tube{fill:var(--card);stroke:var(--ink);stroke-width:1.5}
.fig .v-tin{fill:var(--card-sub);stroke:var(--ink);stroke-width:1.2}
.fig .v-sens{fill:#D9483B}

.tips{margin:0;padding:6px 0 0 1.1em;font-size:14.5px}
.tips li{margin:8px 0}
.after{background:var(--card-sub);border:2px dashed var(--line);border-radius:16px;
  padding:13px 15px;margin:16px 0;font-size:14.5px}
.after h3{margin:0 0 4px;font-size:15px}
.reset{display:block;width:100%;min-height:48px;margin-top:18px;font:inherit;font-size:15px;
  font-weight:800;color:var(--tomato);background:none;border:2px solid var(--tomato);
  border-radius:14px;cursor:pointer}

/* ===== 解説書（アプリの理屈）=====
   色の役割は全冊で固定する。どの章でも同じ色が同じ意味になるように。
     緑＝ポイント（実用上の意味）  青＝式  赤＝ここが大事  黄＝前提と限界  灰＝計算例 */
.k-kaisetsu{--bgc:color-mix(in srgb,var(--teal) 13%,var(--card));--bdc:color-mix(in srgb,var(--teal) 45%,var(--line))}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.legend span{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;
  border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--ink)}
.appbtn{display:block;margin:12px 0;padding:13px 14px;border-radius:14px;text-align:center;
  font-weight:800;font-size:15.5px;text-decoration:none;color:#fff;background:var(--teal)}
.kbtns{display:flex;gap:8px;margin:14px 0 4px}
.kbtns button{flex:1;min-height:44px;font:inherit;font-size:14px;font-weight:800;color:var(--teal);
  background:var(--card);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.chap .pk{background:var(--teal)}
.chap .body{padding:4px 13px 14px}
.chap .body > p,.kp{margin:10px 2px;font-size:15px}
.chap h4{margin:18px 0 4px;font-size:15.5px;font-weight:800;color:var(--teal)}

/* 色つきの囲み */
.kb{border-radius:14px;padding:10px 13px 11px;margin:12px 0;font-size:15px;
  border-left:6px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.kb .kh{display:block;font-size:12.5px;font-weight:800;color:var(--c);letter-spacing:.04em;margin-bottom:3px}
.kb p{margin:6px 0}
.kb ul{margin:4px 0;padding-left:1.2em}
.kb li{margin:3px 0}
.kb-pt{--c:var(--leaf)} .kb-eq{--c:var(--teal)} .kb-imp{--c:var(--tomato)}
.kb-as{--c:var(--sun)} .kb-num{--c:var(--muted)}
.legend .lg-pt{--c:var(--leaf)} .legend .lg-eq{--c:var(--teal)}
.legend .lg-imp{--c:var(--tomato)} .legend .lg-as{--c:var(--sun)} .legend .lg-num{--c:var(--muted)}
/* 文中で目立たせる（赤字・緑字） */
.red{color:var(--tomato);font-weight:800}
.grn{color:var(--leaf);font-weight:800}
.blu{color:var(--teal);font-weight:800}
mark{background:color-mix(in srgb,var(--sun) 35%,transparent);color:inherit;padding:0 2px;border-radius:3px}

/* 式。変数は斜体のセリフ体にして、日本語の地の文と見分けやすくする */
.kf{margin:6px 0 4px;padding:9px 8px;border-radius:10px;background:var(--card);
  font-size:15.5px;line-height:2.1;text-align:center;overflow-wrap:anywhere}
.kf i{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.08em}
.kf sub,.kf sup{font-size:.68em}
.kf .op{margin:0 .18em}
.kf .nw{white-space:nowrap}
.kf small{font-size:.8em;color:var(--muted);font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.45}
.fr > span:first-child{border-bottom:1.6px solid currentColor;padding:0 4px 1px}
.fr > span:last-child{padding:1px 4px 0}
/* 式の記号の列は折り返さない（記号が縦に割れて読めなくなるため） */
.kb-eq .kt th:first-child,.kb-eq .kt td:first-child{white-space:nowrap;width:1%}
.kn{font-size:13.5px;color:var(--muted);font-weight:700;margin:6px 0 0}

/* 表。スマホで横に流れないよう、列は2〜3までにする */
.kt{margin:8px 0}
.kt table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:10px;overflow:hidden}
.kt th,.kt td{padding:6px 8px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.kt th{font-size:12.5px;color:var(--muted);font-weight:800;background:var(--card-sub)}
.kt td:first-child{font-weight:800}
.kt td.n{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kt td{overflow-wrap:anywhere}
.kt td:first-child{min-width:4.8em}
.kt .kcap{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}
.kt tr.hl td{background:color-mix(in srgb,var(--sun) 16%,var(--card))}

/* 計算の流れ（縦1列の箱と矢印） */
.flow{margin:10px 0;display:flex;flex-direction:column;align-items:stretch}
.flow .fs{border:2px solid var(--c,var(--line));border-radius:12px;padding:8px 11px;
  background:color-mix(in srgb,var(--c,var(--line)) 9%,var(--card))}
.flow .fs b{display:block;font-size:15px}
.flow .fs small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.flow .fs .ch{float:right;font-size:12px;font-weight:800;color:var(--c,var(--muted));margin-left:6px}
.flow .fa{align-self:center;color:var(--muted);font-size:18px;line-height:1.1;margin:2px 0}
.flow .c-pt{--c:var(--leaf)} .flow .c-eq{--c:var(--teal)} .flow .c-imp{--c:var(--tomato)} .flow .c-as{--c:var(--sun)}

/* 解説書の図で使う色（SVG）。暗い画面でも読めるよう変数から取る */
.fig .v-sun{fill:none;stroke:var(--sun);stroke-width:3.5;stroke-linecap:round}
.fig .v-sunf{fill:color-mix(in srgb,var(--sun) 25%,transparent);stroke:none}
.fig .v-tom{fill:none;stroke:var(--tomato);stroke-width:3;stroke-linecap:round}
.fig .v-tomf{fill:var(--tomato)}
.fig .v-lf{fill:color-mix(in srgb,var(--leaf) 35%,var(--card));stroke:var(--leaf);stroke-width:1.5}
.fig .v-lfs{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.fig .v-tl{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fig .v-tlf{fill:var(--teal)}
.fig .v-tlb{fill:color-mix(in srgb,var(--teal) 14%,var(--card));stroke:var(--teal);stroke-width:1.5}
.fig .v-sb{fill:color-mix(in srgb,var(--sun) 16%,var(--card));stroke:var(--sun);stroke-width:1.5}
.fig .v-rb{fill:color-mix(in srgb,var(--tomato) 13%,var(--card));stroke:var(--tomato);stroke-width:1.5}
.fig .v-soil{fill:color-mix(in srgb,#8B5E3C 22%,var(--card));stroke:#8B5E3C;stroke-width:1.5}
.fig .v-tt{fill:var(--teal);font-size:12px;font-weight:800}
.fig .v-tr{fill:var(--tomato);font-size:12px;font-weight:800}
.fig .v-tg{fill:var(--leaf);font-size:12px;font-weight:800}
.fig .v-ty{fill:var(--sun);font-size:12px;font-weight:800}
.fig .v-ax{fill:none;stroke:var(--muted);stroke-width:1.2}
</style>
</head>
<body>

<a class="back" id="back" href="../">‹ アプリ一覧</a>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="38" r="22" fill="#EE5340"/>
      <path d="M32 20 L22 10 M32 20 L42 10 M32 20 L32 6"
            stroke="#4E9A5A" stroke-width="5" stroke-linecap="round" fill="none"/>
    </svg>
    <h1>マニュアル</h1>
    <span class="farm">ハッピートマトファーム</span>
  </header>

  <main id="shelf" hidden>
    <p class="lead">作業の手順とやり方をまとめています。</p>
    <div id="cards"></div>
  </main>

  <main id="doc" hidden></main>
</div>

<script>
/* =========================================================================
   手順書の中身。
   ★マニュアルを足すときは、この MANUALS に1冊ぶん書き足すだけでよい。

   ・手順書（このページの中で読むもの）
       { id, kind:"tejun", icon, title, sub, time, updated,
         why,                      … なぜやるか（最初に見える）
         need: [{t, d}],           … 用意するもの（チェックできる）
         parts: [{key, label, title, when, fig?, cap?, steps:[{t, d?, ok?, w?}]}],
                                   … 手順のまとまり。ok＝成功の目安、w＝注意
                                     fig＝まとまりの頭に出す図（SVG の文字列）、cap＝図の下の説明
                                     steps を空にすると「図だけ」のまとまりになる（チェック無し）
         tips: ["..."],            … つまずきやすいところ
         after, afterTitle? }      … 測った値・結果の行き先（見出しは既定で「測った値の行き先」）
   ・解説書（アプリの計算の理屈。チェックは無い）
       { id, kind:"kaisetsu", icon, title, sub, time, updated,
         app, appName,             … 解説しているアプリの URL と名前（上と下にボタンが出る）
         why,                      … この冊で分かること（最初に見える）
         chapters: [{label, title, sum, html}],
                                   … 章。たたんで並ぶ。html は下の K の部品で組む
         after, afterTitle? }      … 最後の囲み（関連・直したときの注意など）
   ・別のページの本（リンクだけ）
       { id, kind:"slide", icon, title, sub, meta, href }

   id は URL の # に入る（#ec で直接開ける）。英小文字にする。
   チェックした場所は端末に覚えさせる（id と項目の key で区別）。
   一度出した手順書の key（a, b …）を付け替えると、チェックがずれるので注意。
   ========================================================================= */

/* =========================================================================
   解説書の部品。どれも HTML の文字列を返すだけ（画面には触らない）。
   色の役割は CSS の .kb-* で固定してある：
     K.pt  緑の囲み「ポイント」      … 結論・実用上の意味
     K.eq  青の囲み「式」            … 式と、記号の意味の表
     K.imp 赤の囲み「ここが大事」    … 間違えやすいところ
     K.as  黄の囲み「前提と限界」    … 前提・仮の値・それが崩れるとき
     K.num 灰の囲み「計算例」        … 実際の数字を当てはめた例
   ========================================================================= */
const K = {
  pt:  (h, t) => `<div class="kb kb-pt"><span class="kh">${t || "ポイント"}</span>${h}</div>`,
  imp: (h, t) => `<div class="kb kb-imp"><span class="kh">${t || "ここが大事"}</span>${h}</div>`,
  as:  (h, t) => `<div class="kb kb-as"><span class="kh">${t || "前提と、それが崩れるとき"}</span>${h}</div>`,
  /* 式。f は式の行（配列なら1つずつ行を分ける）、vars は [記号, 意味] の並び */
  eq: (name, f, vars, note) => {
    /* 記号と添字（T屋根 など）の間で折り返さないよう、ひとまとまりにする */
    const glue = x => x.replace(/<i>[^<]*<\/i><sub>.*?<\/sub>/g, m => `<span class="nw">${m}</span>`);
    const lines = (Array.isArray(f) ? f : [f]).map(x => `<div class="kf">${glue(x)}</div>`).join("");
    const tbl = vars && vars.length
      ? `<div class="kt"><table><tr><th>記号</th><th>意味・単位・値</th></tr>`
        + vars.map(v => `<tr><td>${v[0]}</td><td>${v[1]}</td></tr>`).join("") + `</table></div>`
      : "";
    return `<div class="kb kb-eq"><span class="kh">式　${name}</span>${lines}${tbl}`
         + `${note ? `<p class="kn">${note}</p>` : ""}</div>`;
  },
  /* 計算例。rows は [項目, 値] の並び。値に hl:true を付けた行は黄色く光らせる */
  num: (title, rows, note) =>
    `<div class="kb kb-num"><span class="kh">計算例　${title}</span><div class="kt"><table>`
    + rows.map(r => `<tr${r[2] ? ' class="hl"' : ""}><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join("")
    + `</table></div>${note ? `<p class="kn">${note}</p>` : ""}</div>`,
  /* ふつうの表。head は見出しの並び、rows は行の並び（列は2〜3まで） */
  tbl: (head, rows, cap) =>
    `<div class="kt"><table><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr>`
    + rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")
    + `</table>${cap ? `<div class="kcap">${cap}</div>` : ""}</div>`,
  fig: (svg, cap) => `<figure class="fig">${svg}${cap ? `<figcaption>${cap}</figcaption>` : ""}</figure>`,
  /* 計算の流れ。steps は {t, d?, c?（pt/eq/imp/as）, ch?（章の番号）} */
  flow: steps => `<div class="flow">` + steps.map((s, i) =>
      (i ? `<span class="fa">▼</span>` : "")
      + `<div class="fs${s.c ? " c-" + s.c : ""}">${s.ch ? `<span class="ch">${s.ch}</span>` : ""}`
      + `<b>${s.t}</b>${s.d ? `<small>${s.d}</small>` : ""}</div>`).join("") + `</div>`,
  p: h => `<p class="kp">${h}</p>`,
  h: h => `<h4>${h}</h4>`,
  /* 分数（式の中で使う） */
  fr: (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`,
};

      /* ---------------------------------------------------------------- 4 */
      { label: "4", title: "1日を5分ごとに分ける", sum: "日射を山形に配り、気温を揺らす",

               `<i>S</i><sub><i>i</i></sub> = ${K.fr("1日の日射 [J/m²] × <i>w</i><sub><i>i</i></sub>", "Σ<i>w</i> × 300 秒")}　<small>[W/m²]</small>`],
              [["<i>t</i><sub><i>i</i></sub>", "<i>i</i> 番目のこまの真ん中の時刻（5分ごと、<i>i</i>＝0〜287）"],

              [["<i>n</i><sub><i>i</i></sub>", "正午を1とした日射の形（0〜1）"],
               ["<i>n̄</i>", "日中の <i>n</i> の平均（約 2/π ≒ 0.64）。これを引くので、日中の平均気温は推定値のまま"],

      /* ---------------------------------------------------------------- 5 */
      { label: "5", title: "葉1枚：蒸散と光合成", sum: "気孔・境界層・光と温度の効き",
        html:

            + "通り道は<b>気孔</b>と<b>境界層</b>（葉の表面にはりつく動きの遅い空気の層）の2つで、これが直列につながっています。"
            + "ここで出すのは葉の面積 1 m² あたりの値で、地面あたりにするのは 7章です。")
          + K.fig(`<svg viewBox="0 0 340 170" role="img" aria-label="気孔と境界層を通る水蒸気とCO2">
  <defs><marker id="k5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="v-tlf"/></marker>
  <marker id="k5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="v-tomf"/></marker></defs>
  <rect class="v-lf" x="6" y="40" width="82" height="80" rx="10"/>
  <text class="v-t" x="47" y="70" text-anchor="middle">葉の中</text>
  <text class="v-s" x="47" y="88" text-anchor="middle">水蒸気は飽和</text>
  <text class="v-s" x="47" y="104" text-anchor="middle">e<tspan dy="3" font-size="9">s</tspan><tspan dy="-3">(葉温)</tspan></text>
  <rect class="v-tlb" x="104" y="46" width="52" height="68" rx="8"/>
  <text class="v-t" x="130" y="74" text-anchor="middle">気孔</text>
  <text class="v-tt" x="130" y="94" text-anchor="middle">g<tspan dy="3" font-size="9">vs</tspan></text>
  <rect class="v-sb" x="172" y="46" width="60" height="68" rx="8"/>
  <text class="v-t" x="202" y="74" text-anchor="middle">境界層</text>
  <text class="v-ty" x="202" y="94" text-anchor="middle">g<tspan dy="3" font-size="9">va</tspan></text>
  <rect class="v-b" x="248" y="40" width="86" height="80" rx="10"/>
  <text class="v-t" x="291" y="70" text-anchor="middle">ハウスの</text>
  <text class="v-t" x="291" y="88" text-anchor="middle">空気</text>
  <text class="v-s" x="291" y="106" text-anchor="middle">e<tspan dy="3" font-size="9">a</tspan><tspan dy="-3">・CO₂</tspan></text>
  <path class="v-tl" d="M60,26 H286" marker-end="url(#k5a)"/>
  <text class="v-tt" x="170" y="18" text-anchor="middle">水蒸気（蒸散）→</text>
  <path class="v-tom" d="M286,138 H60" marker-end="url(#k5b)"/>
  <text class="v-tr" x="170" y="160" text-anchor="middle">← CO₂（光合成）</text>
</svg>`, "2つの関門を必ず両方通る＝直列。どちらかが狭ければ全体が狭くなる")
          + K.h("水蒸気の通り道")
          + K.eq("光合成に使える光（PAR）",
              `<i>S</i><sub>tp</sub> = ${K.fr("<i>S</i>", "2")}`,
              [["<i>S</i><sub>tp</sub>", "光合成有効放射（PAR, Photosynthetically Active Radiation）[W/m²]。日射のうち光合成に使える波長はエネルギーで約半分"],
               ["<i>S</i>", "その葉に届く日射 [W/m²]"]])
          + K.eq("気孔コンダクタンス",
              [`光で開く分 = min{ max(0.000103 <i>S</i><sub>tp</sub> + 0.0345,　0.001035 <i>S</i><sub>tp</sub>),　0.207 }`,
               `CO₂ で閉じる分 = max(0.00005 <i>C</i><sub>ca</sub> − 0.01,　0)`,
               `<i>g</i><sub>vs</sub> = 2.4 × (光で開く分 − CO₂ で閉じる分)　<small>（0 未満は 0）</small>`],
              [["<i>g</i><sub>vs</sub>", "気孔コンダクタンス（水蒸気）[mol/(m²·s)]。大きいほど気孔が開いている"],
               ["<i>C</i><sub>ca</sub>", "空気の CO₂ 濃度 [ppm]。CO₂ が十分にあれば水を惜しんで気孔を絞る"],
               ["2.4", "水準の補正倍率。元の演習用の式は上限 0.207 で、実測（日中 0.3〜0.6）の半分以下のため"]],
              "弱い光では直線、強い光で頭打ち（0.207）になる折れ線。")
          + K.eq("境界層コンダクタンス（p.113）",
              `<i>g</i><sub>va</sub> = 0.147 √(${K.fr("<i>u</i>", "<i>d</i>")})`,
              [["<i>u</i>", "群落内の風速 0.2 m/s（ダクトで24時間送風）"],
               ["<i>d</i>", "葉の特性長 ＝ 葉幅 0.07 m × 0.72 ＝ 0.050 m"],
               ["<i>g</i><sub>va</sub>", "＝ 0.293 mol/(m²·s)。風速の平方根に比例するので、風を 0.2→2.0 m/s にしても蒸散は 1.21倍どまり"]])
          + K.eq("直列のコンダクタンス",
              `<i>g</i><sub>v</sub> = ${K.fr("1", `${K.fr("1", "<i>g</i><sub>vs</sub>")} + ${K.fr("1", "<i>g</i><sub>va</sub>")}`)}`,
              [["<i>g</i><sub>v</sub>", "総コンダクタンス。電気の直列抵抗と同じで、抵抗（＝1/<i>g</i>）を足して逆数にする"]])
          + K.eq("蒸散速度（式6.7）",
              [`<i>E</i> = <i>g</i><sub>v</sub> × (<i>C</i><sub>vs</sub> − <i>C</i><sub>va</sub>)`,
               `<i>C</i><sub>vs</sub> = ${K.fr("<i>e</i><sub>s</sub>(<i>T</i><sub>l</sub>)", "<i>P</i><sub>a</sub>")}　　<i>C</i><sub>va</sub> = ${K.fr("<i>e</i><sub>a</sub>", "<i>P</i><sub>a</sub>")}`,
               `<i>P</i><sub>a</sub> = 101.3 × e<sup>−126/8200</sup> = 99.76 kPa`],
              [["<i>E</i>", "蒸散速度 [mol/(m²·s)]。×18 g/mol で重さになる"],
               ["<i>C</i><sub>vs</sub>", "葉の中の水蒸気のモル分率。葉の中は葉温 <i>T</i><sub>l</sub> で飽和しているとみなす"],
               ["<i>C</i><sub>va</sub>", "空気の水蒸気のモル分率"],
               ["<i>P</i><sub>a</sub>", "現地（標高126 m）の気圧"]])
          + K.h("CO₂ の通り道と光合成")

              [`<i>g</i><sub>cs</sub> = 0.66 <i>g</i><sub>vs</sub>　　<i>g</i><sub>ca</sub> = 0.75 <i>g</i><sub>va</sub>`,
               `<i>g</i><sub>c</sub> = ${K.fr("1", `${K.fr("1", "<i>g</i><sub>cs</sub>")} + ${K.fr("1", "<i>g</i><sub>ca</sub>")}`)}`],
              [["0.66・0.75", "CO₂ は水蒸気より分子が大きく拡散が遅いので割り引く（気孔は分子拡散、境界層は空気の混ざりも効くので比が大きい）"]])
          + K.eq("光の効き（非直角双曲線）",
              [`<i>I</i> = <i>S</i><sub>tp</sub> × 4.57　<small>[µmol/(m²·s)]</small>`,
               `<i>Q</i> = <i>φI</i> + <i>P</i><sub>max</sub>`,
               `<i>P</i><sub>I</sub> = ${K.fr("<i>Q</i> − √(<i>Q</i>² − 4<i>θ φI P</i><sub>max</sub>)", "2<i>θ</i>")}`],
              [["<i>I</i>", "光量子束密度（光の粒の数）。4.57 µmol/J で換算"],
               ["<i>φ</i>", "量子収率 0.060。弱い光で、光の粒1個あたり何個の CO₂ を固定するか"],
               ["<i>P</i><sub>max</sub>", "強い光での上限 45 µmol/(m²·s)"],
               ["<i>θ</i>", "曲がりの角ばり具合 0.80（1なら折れ線、0なら直角双曲線）"]])
          + K.eq("温度の効き",
              `<i>h</i> = ${K.fr("2(<i>T</i><sub>l</sub> + <i>a</i>)²(<i>T</i><sub>m</sub> + <i>a</i>)² − (<i>T</i><sub>l</sub> + <i>a</i>)<sup>4</sup>", "(<i>T</i><sub>m</sub> + <i>a</i>)<sup>4</sup>")}　<small>（0 未満は 0）</small>`,
              [["<i>T</i><sub>m</sub>", "最適温度 28℃（ここで <i>h</i>＝1）"],
               ["<i>a</i>", "温度係数 5℃。釣り鐘の幅を決める"],
               ["<i>T</i><sub>l</sub>", "葉温 [℃]（6章で解く）"]])
          + K.eq("総光合成（輸送と生化学を連立）",
              [`<i>P</i><sub>m</sub> = <i>P</i><sub>I</sub> × <i>h</i>`,
               `<i>B</i> = <i>C</i><sub>a</sub> + <i>K</i><sub>C</sub> + ${K.fr("<i>P</i><sub>m</sub>", "<i>g</i><sub>c</sub>")}`,
               `<i>P</i> = <i>g</i><sub>c</sub> × ${K.fr("<i>B</i> − √(<i>B</i>² − 4<i>C</i><sub>a</sub> <i>P</i><sub>m</sub> / <i>g</i><sub>c</sub>)", "2")}`],
              [["<i>P</i><sub>m</sub>", "CO₂ が十分あるときの光合成（光と温度だけで決まる上限）"],
               ["<i>C</i><sub>a</sub>", "空気の CO₂（mol/mol に直して使う）"],
               ["<i>K</i><sub>C</sub>", "半分の速さになる CO₂ 濃度 250 ppm"],
               ["<i>P</i>", "総光合成 [mol/(m²·s)]"]],
              "「空気から葉緑体まで運ぶ速さ ＝ <i>g</i><sub>c</sub>(<i>C</i><sub>a</sub> − <i>C</i><sub>c</sub>)」と「葉緑体で固定する速さ ＝ <i>P</i><sub>m</sub>・<i>C</i><sub>c</sub>/(<i>C</i><sub>c</sub>+<i>K</i><sub>C</sub>)」を等しいとおいて、葉緑体の CO₂ 濃度 <i>C</i><sub>c</sub> を消した2次方程式の小さいほうの解。")
          + K.eq("呼吸と純光合成",
              [`光呼吸 <i>R</i><sub>p</sub> = 0.3 × (1 − ${K.fr("<i>C</i><sub>ca</sub>", "1200")}) × <i>P</i>　<small>（0 未満は 0）</small>`,
               `暗呼吸 <i>R</i><sub>d</sub> = 1.48 × 2<sup>(<i>T</i><sub>l</sub> − 20)/10</sup>　<small>[µmol/(m²·s)]</small>`,
               `純光合成 <i>P</i><sub>n</sub> = <i>P</i> − <i>R</i><sub>p</sub> − <i>R</i><sub>d</sub>`],
              [["<i>R</i><sub>p</sub>", "光呼吸。酵素（ルビスコ）が CO₂ の代わりに酸素と反応する無駄。CO₂ が濃いほど減り、1200 ppm でゼロ"],
               ["<i>R</i><sub>d</sub>", "暗呼吸（生きるための呼吸）。10℃上がると2倍（Q10＝2）。夜温を下げると消耗が減るのはこのため"]])
          + K.imp("<b>光合成の値は参考です。</b>実収量から逆算すると約3倍足りません。"
            + "CO₂ の通り道（<i>g</i><sub>c</sub>）が頭打ちを作っているためで、日ごとの上下や季節の傾向を見るぶんには使えますが、絶対量は当てにしないでください。"
            + "<b>蒸散の計算には影響しません</b>（蒸散は水蒸気の通り道だけで決まります）。")
          + K.as("<ul><li>気孔は<b>光と CO₂ だけ</b>で決まる経験式です。土の乾き・高温・高い飽差で気孔が閉じる効果は入っていません（その日は蒸散を多めに出します）。</li>"
            + "<li>群落の中の気温・湿度・CO₂・風は上下で一様とみなしています。</li>"
            + "<li>直達光と散乱光を分けていません。ハウス内は被覆で光が散らされるので、屋外ほどの影響はありません。</li></ul>"),
      },

      /* ---------------------------------------------------------------- 6 */
      { label: "6", title: "葉温：熱の釣り合いで解く", sum: "日射で温まり、蒸散で冷える",
        html:
          K.pt("葉温は気温と同じではありません。<b>葉が受け取る熱と捨てる熱がちょうど釣り合う葉温</b>を探して使います。"
            + "これで「蒸散が足りない → 葉が冷えない → 葉温が上がる → 葉の中の水蒸気が増える → 蒸散が増える」という<b>自己調節</b>が計算に入ります。")

          + K.eq("熱の釣り合い（葉の面積あたり）",
              `0.5<i>S</i> + <i>F</i> × 2 × 0.97 × <i>σ</i> (<i>T</i><sub>a</sub><sup>4</sup> − <i>T</i><sub>l</sub><sup>4</sup>) − <i>H</i> − <i>λE</i> = 0`,

      /* ---------------------------------------------------------------- 7 */

          + K.eq("根が吸える量（式9.20・9.22）",
              [`<i>A</i><sub>w</sub> = ${K.fr("<i>θ</i> − 0.248", "0.420 − 0.248")}　<small>（0〜1）</small>`,
               `<i>U</i><sub>p</sub>* = 1 − (1 + 1.37 <i>A</i><sub>w</sub>)<sup>−5</sup>`,
               `実際の蒸散 = min(計算した蒸散,　6 mm/日 × <i>U</i><sub>p</sub>*)`],

    updated: "2026-11-14",
    app: "../yaon/", appName: "夜温設定",
    why: "夜温設定は、<b>1日の平均気温を目標どおりにするには、夜に何℃必要か</b>を逆算し、暖房機4段の時刻と温度に割り振るアプリです。"
       + "⑤では、気象庁の予報と<b>温室の熱収支</b>から、カーテン（ラクソス・テンパ）を閉める時刻と、翌朝に開ける時刻を出します。<br>"
       + "トマトの生育・収量はおもに<b>24時間の平均気温</b>で決まる（de Koning）、というのが出発点です。",
    chapters: [

      /* ---------------------------------------------------------------- 1 */
      { label: "1", title: "全体の流れ", sum: "何を入れて、何が出るか",
        html:
          K.pt("入れるのは <b>①日付 ②日平均の目標 ③日中平均</b> の3つだけです（①②は自動で入る）。"
            + "そこから<b>④暖房4段の時刻と温度</b>が決まり、予報を読んで<b>⑤カーテンを閉める時刻・翌朝に開ける時刻</b>が出ます。")
          + K.flow([
              { t: "① 日付 → 日の出・日の入り", d: "太陽の位置の式で計算", ch: "2章", c: "eq" },
              { t: "② 日平均の目標", d: "今週のめやす（作業計画シート）の値を読む", c: "pt" },
              { t: "③ 日中平均（日の出〜日の入りのハウス内）", d: "平年値（天気別）／実況＋予報の式／アグリネットの値", ch: "5・6章", c: "eq" },
              { t: "夜に必要な平均", d: "（目標 × 1日 − 日中平均 × 昼）÷ 夜", ch: "3章", c: "pt" },
              { t: "④ 暖房4段の時刻と温度", d: "前半を高く・決まりの範囲で、必要な平均にいちばん近いもの", ch: "4章", c: "pt" },
              { t: "⑤ カーテンを閉める時刻", d: "予報 × 温室の熱収支 → 暖房が止まっている時間 → 決めた間隔に1回動くか", ch: "7〜9章", c: "imp" },
              { t: "⑤ 翌朝に開ける時刻（晴れの朝だけ）", d: "日射の熱と逃げる熱、室温の動きを1分ずつ追う", ch: "10章", c: "as" },
            ])
          + K.num("11月15日・目標15.0℃・日中平均18.0℃", [
              ["日の出・日の入り・翌日の出", "6:22・16:29・6:23"],
              ["昼・夜の長さ", "10.1時間・13.9時間"],
              ["夜に必要な平均", "12.8℃"],
              ["4段の時刻", "16:30・20:30・0:30・4:00"],
              ["4段の温度", "15・13・11・13℃", true],
              ["夜の平均 → 日平均の見込み", "13.1℃ → 15.15℃"],
            ], "この例は3・4章でも使います。")
          + K.as("温度はすべて<b>ハウス内のセンサーの値</b>です。外の気象（宇都宮・鹿沼）は、晴れ・くもりの見分けと、⑤の外気にだけ使います。"),
      },

      /* ---------------------------------------------------------------- 2 */
      { label: "2", title: "日の出・日の入り", sum: "昼と夜の境目を決める",
        html:
          K.pt("「昼」は<b>日の出〜日の入り</b>、「1日」は<b>今日の日の出〜明日の日の出</b>です。"
            + "日の出・日の入りは潅水アプリ・日射量予測と同じ式で計算します（太陽の中心が地平線に来る時刻なので、暦の時刻より日の出は約4分遅く、日の入りは約4分早い）。")
          + K.eq("太陽の通り道（式11.2〜11.4）",
              [`sin<i>δ</i> = 0.39785 sin[ 278.97 + 0.9856<i>J</i> + 1.9165 sin(356.6 + 0.9856<i>J</i>) ]`,
               `<i>f</i> = 279.575 + 0.9856<i>J</i>`,
               `<i>ET</i> = (−104.7 sin<i>f</i> + 596.2 sin2<i>f</i> + 4.3 sin3<i>f</i> − 12.7 sin4<i>f</i><br>− 429.3 cos<i>f</i> − 2.0 cos2<i>f</i> + 19.3 cos3<i>f</i>) ÷ 3600　<small>[時]</small>`,
               `<i>t</i><sub>0</sub> = 12 − ${K.fr("139.762 − 135", "15")} − <i>ET</i>`],
              [["<i>J</i>", "通日（1月1日＝1）"],
               ["<i>δ</i>", "赤緯（太陽が赤道からどれだけ北にいるか）"],
               ["<i>ET</i>", "均時差（南中が時計の12時からずれる量）"],
               ["<i>t</i><sub>0</sub>", "南中時刻 [時]"]])
          + K.eq("日の出・日の入り",
              [`cos<i>h</i> = −tan(36.523°) × tan<i>δ</i>`,
               `日の出 = <i>t</i><sub>0</sub> − ${K.fr("<i>h</i>", "15")}`,
               `日の入り = <i>t</i><sub>0</sub> + ${K.fr("<i>h</i>", "15")}`],
              [["<i>h</i>", "日の出の時角 [°]。太陽は1時間に15°動く"],
               ["36.523°", "農場の緯度"]]),
      },

      /* ---------------------------------------------------------------- 3 */
      { label: "3", title: "夜に必要な平均", sum: "1日の平均を目標にするための逆算",
        html:
          K.pt("1日の平均気温を目標にするには、<b>昼にもう確保できた「温度×時間」を差し引いた残り</b>を、夜で確保すればよい、という考え方です。")
          + K.fig(`<svg viewBox="0 0 340 235" role="img" aria-label="1日の温度と時間の面積">
  <rect class="v-sb" x="30" y="80" width="126.4" height="120"/>
  <rect class="v-tlb" x="156.4" y="116" width="50.2" height="84"/>
  <rect class="v-tlb" x="206.6" y="140" width="50" height="60"/>
  <rect class="v-tlb" x="256.6" y="164" width="43.8" height="36"/>
  <rect class="v-tlb" x="300.4" y="140" width="29.7" height="60"/>
  <path class="v-tom" stroke-dasharray="7 5" d="M24,116 H334"/>
  <text class="v-tr" x="334" y="108" text-anchor="end">目標 15.0℃（1日の平均）</text>
  <text class="v-t" x="93" y="130" text-anchor="middle">日中平均</text>
  <text class="v-t" x="93" y="148" text-anchor="middle">18.0℃</text>
  <text class="v-s" x="93" y="166" text-anchor="middle">× 10.1時間</text>
  <text class="v-tt" x="181.5" y="160" text-anchor="middle">15</text>
  <text class="v-tt" x="231.6" y="174" text-anchor="middle">13</text>
  <text class="v-tt" x="278.5" y="186" text-anchor="middle">11</text>
  <text class="v-tt" x="315.3" y="174" text-anchor="middle">13</text>
  <path class="v-ax" d="M24,200 H334"/>
  <text class="v-s" x="30" y="216" text-anchor="middle">6:22</text>
  <text class="v-s" x="156.4" y="216" text-anchor="middle">16:29</text>
  <text class="v-s" x="206.6" y="216" text-anchor="middle">20:30</text>
  <text class="v-s" x="256.6" y="216" text-anchor="middle">0:30</text>
  <text class="v-s" x="300.4" y="216" text-anchor="middle">4:00</text>
  <text class="v-s" x="330" y="230" text-anchor="end">6:23</text>
  <text class="v-ty" x="30" y="232">昼（日の出〜日の入り）</text>
  <text class="v-tt" x="190" y="66">夜（4段の設定温度）</text>
</svg>`, "昼の面積（温度×時間）＋ 夜の面積 ＝ 目標 × 1日の長さ になるように夜を決める（11月15日の例）")
          + K.eq("夜に必要な平均",
              `夜の必要平均 = ${K.fr("目標 × <i>L</i><sub>日</sub> − 日中平均 × <i>L</i><sub>昼</sub>", "<i>L</i><sub>夜</sub>")}`,
              [["目標", "日平均の目標 [℃]（今週のめやすの値）"],
               ["日中平均", "日の出〜日の入りのハウス内の平均 [℃]"],
               ["<i>L</i><sub>昼</sub>", "昼の長さ ＝ 日の入り − 日の出 [時間]"],
               ["<i>L</i><sub>夜</sub>", "夜の長さ ＝ 明日の日の出 − 日の入り [時間]"],
               ["<i>L</i><sub>日</sub>", "<i>L</i><sub>昼</sub> ＋ <i>L</i><sub>夜</sub>（ほぼ24時間）"]])
          + K.eq("4段を決めたあとの日平均の見込み",
              `日平均の見込み = ${K.fr("日中平均 × <i>L</i><sub>昼</sub> + 夜の平均 × <i>L</i><sub>夜</sub>", "<i>L</i><sub>日</sub>")}`,
              null, "夜の平均は 0.5℃きざみの4段の重み付き平均なので、必要な平均より少し上になる。目標との差が「不足」として出る。")
          + K.num("11月15日", [
              ["1日で確保したい分", "15.0 × 24.01 ＝ 360.2 ℃·時"],
              ["昼に確保できた分", "18.0 × 10.11 ＝ 182.0 ℃·時"],
              ["夜に必要な平均", "(360.2 − 182.0) ÷ 13.90 ＝ 12.8℃", true],
            ])
          + K.imp("夜の平均は<b>設定温度</b>で数えています。日没直後など暖房が止まっている時間は、ハウスが設定より暖かいので、実際の夜の平均はこれより少し高くなります（目標をやや超える側）。")
          + K.as("曇天で日中平均が低い日は、夜に必要な平均が高くなります。16℃にしても届かない日は全段16℃にして不足を出すだけで、無理に上げません（曇天日は平均を落とす方針）。"),
      },

      /* ---------------------------------------------------------------- 4 */
      { label: "4", title: "暖房4段の時刻と温度", sum: "前半を高く、決まりの範囲でいちばん近いもの",
        html:
          K.pt("4段の<b>時刻</b>は日の入り・日の出から決まり、<b>温度</b>は決まりを満たす組み合わせを全部試して、"
            + "<b>夜の平均が必要な平均以上で、超える幅がいちばん小さいもの</b>から、<b>前半が高いもの</b>を選びます。")
          + K.h("4段の時刻")
          + K.tbl(["段", "時刻の決め方", "ねらい"], [
              ["1段目", "日の入り（30分に丸める）から4時間", "転流がいちばん盛ん"],
              ["2段目", "日の入りから約8時間後まで", "夜の転流の8割が終わるころ"],
              ["3段目", "日の出の2時間前まで", "呼吸の消耗を抑える"],
              ["4段目", "日の出の2時間前（30分に切り捨て）〜日の出", "朝の結露を防ぐ"],
            ], "各段は1時間半以上。3段目の始まり ＝ min{ max(1段目＋8時間, 2段目＋1.5時間), 4段目 − 1.5時間 }")
          + K.h("4段の温度の決まり")
          + K.tbl(["決まり", "値"], [
              ["温度の範囲ときざみ", "11〜16℃・0.5℃きざみ"],
              ["4段目の下限（結露防止）", "13℃（3〜5月は14℃）"],
              ["となりの段との差", "2℃まで（4段目への上げ下げも）"],
              ["下げ方", "1〜3段目は下げる一方。上げ直すのは4段目だけ"],
            ])
          + K.eq("夜の平均（4段の重み付き平均）",
              `夜の平均 = ${K.fr("<i>T</i><sub>1</sub><i>w</i><sub>1</sub> + <i>T</i><sub>2</sub><i>w</i><sub>2</sub> + <i>T</i><sub>3</sub><i>w</i><sub>3</sub> + <i>T</i><sub>4</sub><i>w</i><sub>4</sub>", "<i>w</i><sub>1</sub> + <i>w</i><sub>2</sub> + <i>w</i><sub>3</sub> + <i>w</i><sub>4</sub>")}`,
              [["<i>T</i><sub>1〜4</sub>", "各段の設定温度 [℃]"],
               ["<i>w</i><sub>1〜4</sub>", "各段が夜の中で受け持つ長さ [時間]（1段目は日の入りから、4段目は日の出まで）"]])
          + K.flow([
              { t: "決まりを満たす組み合わせを全部作る", d: "11〜16℃の4段（11月15日は 631通りが必要な平均以上）", c: "eq" },
              { t: "夜の平均 ≧ 必要な平均 のものだけ残す", c: "eq" },
              { t: "いちばん小さい平均 ＋ 0.25℃ 以内にしぼる", d: "0.5℃きざみの丸めの分だけ許す（同じ日は39通り）", c: "eq" },
              { t: "1段目 → 2段目 → 3段目 の順に高いものを選ぶ", d: "前半を高く、後半を低く", c: "pt" },
            ])
          + K.num("11月15日（必要な平均 12.82℃）", [
              ["各段の長さ <i>w</i>", "4.02・4.00・3.50・2.38 時間"],
              ["選ばれた温度", "15・13・11・13℃", true],
              ["夜の平均", "(15×4.02 + 13×4.00 + 11×3.50 + 13×2.38) ÷ 13.90 ＝ 13.07℃"],
            ])
          + K.imp("<b>前半を高くする理由：</b>夜の転流（葉の糖を果実へ送る流れ）は消灯後の最初に集中し、"
            + "0〜4時間で10%、4〜8時間で6%、8〜16時間で4%という測定があります（宍戸 2013）。夜温が高いほど果実への転流は多くなります（全ら 1988）。"
            + "後半は低くして呼吸の消耗を抑えます（暗呼吸は10℃で2倍）。県の指針も「夕方から3時間（愛知）」「4〜5時間（千葉）」を高めにする形です。")
          + K.as("「1〜3段目は下げる一方」「近い候補の中で前半が高いもの」は、実装で決めた選び方です（変えられます）。"
            + "「11→13℃の上げ直しは効率が悪ければ13℃のまま」という考え方もありますが、熱収支の上では一度下げたほうが燃料は減るので、4段目の上げ直しを認めています。"),
      },

      /* ---------------------------------------------------------------- 5 */
      { label: "5", title: "日中平均①　平年値と振れ幅", sum: "天気別の過去の値と、8割が入る幅",
        html:
          K.pt("③の日中平均を入れないときは、<b>過去の同じ時期・同じ天気の日の平均</b>（平年値）を使います。"
            + "既定は快晴で、曇りがち・曇雨天はボタンで選べます。<b>振れ幅</b>は、その天気の日の8割が入る範囲です。")
          + K.eq("晴天指数（天気の見分け方）",
              `晴天指数 = ${K.fr("宇都宮の日射量（その日）", "快晴なら来るはずの日射量")}`,
              [["分母", "日射量予測と同じ快晴の式で、日付ごとに計算"]],
              "快晴：0.9 以上／曇りがち：0.4〜0.9／曇雨天：0.4 未満。温度はハウス内のセンサーの値だけを使い、宇都宮の値は天気の見分けにだけ使う。")
          + K.eq("平年値",
              [`年ごとの平均 <i>m</i><sub><i>y</i></sub> = 前後7日（計15日）の同じ天気の日の日中平均の平均`,
               `平年値 = ${K.fr("Σ <i>m</i><sub><i>y</i></sub>", "年の数")}`],
              [["<i>y</i>", "年度。その日の年度は入れない"],
               ["日中平均", "4週記録表のハウス内の日中平均（24時間そろった日だけ）"]],
              "先に年ごとに平均してから年の間で平均するので、どの年も同じ重みになる。その天気の日が1日しかない年も使う。")
          + K.eq("振れ幅",
              `振れ幅 = 平年値 ± 1.48 × <i>s</i>`,
              [["<i>s</i>", "同じ日々（前後7日・同じ天気・全部の年）の日中平均の標準偏差（n−1 で割る）"],
               ["1.48", "年度を1つずつ伏せて確かめ、10〜4月の 2,522日の 80% が入るように合わせた係数"]],
              "同じ天気の日が5日より少ないときは、ばらつきが当てにならないので出さない。")
          + K.tbl(["確かめたこと", "結果"], [
              ["振れ幅に入った割合", "全体 80%・天気/ハウス/月別でも 77〜82%"],
              ["平年値の外れ（平均的な大きさ）", "12〜3月 1.0〜1.2℃・11月 1.4℃・10月と4月 1.7〜1.9℃"],
              ["平均のとり方を変えたら", "局所回帰・直近の年だけ などでも外れは ほぼ同じ → 変えていない"],
            ])
          + K.imp("「95%信頼区間」は<b>平均がどれだけ確かか</b>の幅で、その日の値は56%しか入りません。"
            + "その日の値がどこに来そうかを示すのは振れ幅（予測区間）のほうです。")
          + K.as("<ul><li>全日の平均は曇天日に引っぱられ、快晴の日より 0.4〜1.3℃ 低くなります。だから天気別に分けています。</li>"
            + "<li>東の曇雨天は67%しか入りませんでしたが、外れたのは管理の違う 2020〜2022年度で、直近3年度は 86〜94% 入っています。</li>"
            + "<li>平年値で試算中は、④に「振れ幅の端なら夜に必要な平均は○℃」が出ます（日中が1℃違うと夜は約0.7℃違う）。</li></ul>"),
      },

      /* ---------------------------------------------------------------- 6 */
      { label: "6", title: "日中平均②　実況＋予報で見込む", sum: "日中平均の計算（/nicchu/）の式",
        html:
          K.pt("平年値より近い値がほしい日は、<b>日中平均の計算</b>（③の下のリンク）で、"
            + "鹿沼アメダスの<b>実況</b>と気象庁の<b>予報</b>から、その日のハウス内の日中平均を見込みます。計算した値はリンクで③に戻ります。")
          + K.eq("ハウス内の日中平均（月ごとの式）",
              `ハウス内 = <i>a</i> + <i>b</i> × 外気の日中平均 + <i>c</i> × 日照の割合`,
              [["外気の日中平均", "鹿沼の、日の出〜日の入りの10分ごとの気温の平均 [℃]"],
               ["日照の割合", "日照時間 ÷ 昼の長さ（0〜1）"],
               ["<i>a</i>, <i>b</i>, <i>c</i>", "月ごとの係数（下の表）"]],
              "直近3年度（2024〜2026年度）の中央・東をまとめて1本の式にした（それより前は管理が違う／両ハウスは同じに管理）。")
          + K.tbl(["月", "a ／ b ／ c", "外れ"], [
              ["10月", "11.31 ／ 0.508 ／ 2.10", "1.26℃"],
              ["11月", "15.05 ／ 0.297 ／ 2.70", "0.54℃"],
              ["12月", "16.30 ／ 0.127 ／ 3.08", "0.55℃"],
              ["1月", "16.31 ／ 0.126 ／ 3.20", "0.55℃"],
              ["2月", "16.81 ／ 0.099 ／ 3.49", "0.68℃"],
              ["3月", "16.44 ／ 0.156 ／ 3.79", "0.63℃"],
              ["4月", "14.03 ／ 0.291 ／ 3.59", "1.18℃"],
            ], "外れ＝年度を1つずつ抜いて確かめた RMSE（二乗平均のずれ）。全体 0.8℃。5〜9月は外の記録が無いので式なし")
          + K.eq("日の出〜いま：実況、いま〜日の入り：予報",
              [`外気 = 実況（10分ごと。欠けは前後を直線でつなぐ）`,
               `外気 = 宇都宮の予報 + 昼の差（月ごと）　<small>（いま以降）</small>`,
               `日照時間 = 実況の日照 + 欠けの補い + Σ 予報の天気の日照率 × 10分`],
              [["昼の差", "鹿沼 − 宇都宮 の昼の差。10月 −0.63・11月 −0.48・12月 −0.41・1月 −0.48・2月 −0.51・3月 −0.62・4月 −0.67℃"],
               ["日照率", "予報の天気ごと：晴 0.92・曇 0.21・雨 0.01"],
               ["欠けの補い", "日照の実況が欠けた時刻は、ほかの時刻の平均と同じ照り方だったとみなす"]],
              "最後の実況から予報の点へ直線でつなぐ（つなぎ目で段差が出ないように）。")
          + K.eq("アグリネットの値を入れるとき",

/* =========================================================================
   チェックの保存（端末ごと）。
   プライベートモードなどで保存できない端末では、その旨を画面に出す。
   チェックはその場限りになるだけで、読むのには困らない。
   ========================================================================= */
const STORE = "htf_tebiki_v1";
let canSave = true;

function readChecks(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    return (s && typeof s === "object") ? s : {};
  }catch(e){
    canSave = false;
    return {};
  }
}
function writeChecks(all){
  try{
    localStorage.setItem(STORE, JSON.stringify(all));
  }catch(e){
    canSave = false;
    const n = document.getElementById("nosave");
    if(n) n.hidden = false;
  }
}

const $ = s => document.querySelector(s);

/* ===== 一覧 ===== */
function card(m){
  // 手順書は「手順 A〜F」のように、最初と最後のまとまりの記号で数を見せる
  const meta = m.kind === "tejun"
    ? `手順 ${m.parts[0].label}〜${m.parts[m.parts.length - 1].label}・${m.time}・${m.updated} 更新`
    : m.kind === "kaisetsu"
      ? `全${m.chapters.length}章・${m.time}・${m.updated} 更新`
      : m.meta;
  const href = m.kind === "slide" ? m.href : `#${m.id}`;
  return `<a class="card k-${m.kind}" href="${href}">
      <span class="ic" aria-hidden="true">${m.icon}</span>
      <span class="tx"><span class="tt">${m.title}</span>
        <span class="sb">${m.sub}</span><span class="mt">${meta}</span></span>
      <span class="go" aria-hidden="true">›</span></a>`;
}
function drawShelf(){
  const tejun = MANUALS.filter(m => m.kind === "tejun");
  const kaisetsu = MANUALS.filter(m => m.kind === "kaisetsu");
  const slide = MANUALS.filter(m => m.kind === "slide");
  $("#cards").innerHTML =
      `<h2 class="shelf-h">作業の手順</h2><div class="cards">${tejun.map(card).join("")}</div>`
    + (kaisetsu.length
        ? `<h2 class="shelf-h">アプリの理屈<small>計算のしくみと式</small></h2>`
          + `<div class="cards">${kaisetsu.map(card).join("")}</div>`
        : "")
    + `<h2 class="shelf-h">スライドの本<small>みんなのページからも開けます</small></h2>`
    + `<div class="cards">${slide.map(card).join("")}</div>`;
}

/* ===== 手順書 ===== */
function stepRow(k, n, s){
  return `<label class="step">
      <input type="checkbox" data-k="${k}">
      ${n ? `<span class="n">${n}</span>` : ""}
      <span class="st"><span class="tx">${s.t}</span>
        ${s.d ? `<span class="d">${s.d}</span>` : ""}
        ${s.ok ? `<span class="ok">${s.ok}</span>` : ""}
        ${s.w ? `<span class="warn">${s.w}</span>` : ""}</span></label>`;
}
function partBox(cls, label, title, when, keys, inner){
  return `<details class="part ${cls}" data-keys="${keys.join(" ")}">
      <summary><span class="pk">${label}</span>
        <span class="pt"><b>${title}</b>${when ? `<small>${when}</small>` : ""}</span>
        <span class="pc"></span></summary>
      <div class="body">${inner}</div></details>`;
}
function drawDoc(m){
  const needKeys = m.need.map((_, i) => `n${i}`);
  let h = `<h2 class="dt">${m.icon} ${m.title}</h2>
    <div class="upd">${m.updated} 更新・${m.time}</div>
    <div class="why">${m.why}</div>
    <div class="prog"><span id="progt"></span><div class="bar"><i id="progb"></i></div></div>
    <div class="nosave" id="nosave" hidden>この端末ではチェックを覚えられません（プライベートモードなど）。読むのには困りません。</div>`;

  h += partBox("lst", "✓", "用意するもの", "はじめに1回そろえる", needKeys,
    m.need.map((s, i) => stepRow(`n${i}`, "", s)).join(""));

  for(const p of m.parts){
    const keys = p.steps.map((_, i) => `${p.key}${i}`);
    // 図があれば、手順の行より前に出す
    const fig = p.fig
      ? `<figure class="fig">${p.fig}${p.cap ? `<figcaption>${p.cap}</figcaption>` : ""}</figure>`
      : "";
    h += partBox("", p.label, p.title, p.when, keys,
      fig + p.steps.map((s, i) => stepRow(`${p.key}${i}`, i + 1, s)).join(""));
  }

  h += `<details class="part tip"><summary><span class="pk">!</span>
      <span class="pt"><b>つまずきやすいところ</b></span><span class="pc"></span></summary>
      <div class="body"><ul class="tips">${m.tips.map(t => `<li>${t}</li>`).join("")}</ul></div></details>`;
  h += `<div class="after"><h3>${m.afterTitle || "測った値の行き先"}</h3>${m.after}</div>`;
  h += `<button class="reset" id="reset" type="button">チェックを全部消す</button>`;

  $("#doc").innerHTML = h;
  if(!canSave) $("#nosave").hidden = false;
  applyChecks(m.id);

  $("#doc").onchange = ev => {
    const k = ev.target.dataset && ev.target.dataset.k;
    if(!k) return;
    const all = readChecks();
    const set = new Set(all[m.id] || []);
    if(ev.target.checked) set.add(k); else set.delete(k);
    all[m.id] = [...set];
    writeChecks(all);
    applyChecks(m.id);
  };
  $("#reset").onclick = () => {
    if(!confirm(`「${m.title}」のチェックを全部消します。よろしいですか？`)) return;
    const all = readChecks();
    delete all[m.id];
    writeChecks(all);
    applyChecks(m.id);
  };
}

/* ===== 解説書 =====
   章はたたんで並べる（スマホで目次の代わりになる）。最初の章だけ開いておく。
   チェックは無いので、端末には何も覚えさせない */
function drawKaisetsu(m){
  const appBtn = m.app
    ? `<a class="appbtn" href="${m.app}" target="_blank" rel="noopener">${m.appName || "アプリ"}を開く ›</a>`
    : "";
  let h = `<h2 class="dt">${m.icon} ${m.title}</h2>
    <div class="upd">${m.updated} 更新・${m.time}</div>
    <div class="why">${m.why}</div>
    <div class="legend" aria-label="色の意味">
      <span class="lg-pt">緑＝ポイント</span><span class="lg-eq">青＝式</span>
      <span class="lg-imp">赤＝ここが大事</span><span class="lg-as">黄＝前提と限界</span>
      <span class="lg-num">灰＝計算例</span></div>
    ${appBtn}
    <div class="kbtns"><button type="button" id="kOpen">全部ひらく</button>
      <button type="button" id="kClose">全部とじる</button></div>`;
  m.chapters.forEach((c, i) => {
    h += `<details class="part chap"${i === 0 ? " open" : ""}>
      <summary><span class="pk">${c.label}</span>
        <span class="pt"><b>${c.title}</b>${c.sum ? `<small>${c.sum}</small>` : ""}</span>
        <span class="pc"></span></summary>
      <div class="body">${c.html}</div></details>`;
  });
  if(m.after) h += `<div class="after"><h3>${m.afterTitle || "関連"}</h3>${m.after}</div>`;
  h += appBtn;
  $("#doc").innerHTML = h;
  $("#doc").onchange = null;
  const all = open => document.querySelectorAll("#doc details.chap").forEach(d => { d.open = open; });
  $("#kOpen").onclick = () => all(true);
  $("#kClose").onclick = () => all(false);
}

/* 保存してあるチェックを画面に反映し、まとまりごとの「済/全」と全体の進み具合を出す */
function applyChecks(id){
  const done = new Set(readChecks()[id] || []);
  document.querySelectorAll("#doc input[data-k]").forEach(el => {
    el.checked = done.has(el.dataset.k);
    el.closest(".step").classList.toggle("on", el.checked);
  });
  let all = 0, got = 0;
  document.querySelectorAll("#doc details.part[data-keys]").forEach(d => {
    const keys = d.dataset.keys.split(" ").filter(Boolean);
    const pc = d.querySelector(".pc");
    // 図だけのまとまりはチェックが無いので「図」と出す
    if(keys.length === 0){
      pc.textContent = "図";
      pc.classList.remove("done");
      return;
    }
    const n = keys.filter(k => done.has(k)).length;
    all += keys.length; got += n;
    pc.textContent = `${n}/${keys.length}`;
    pc.classList.toggle("done", n === keys.length);
  });
  $("#progt").textContent = `チェック ${got} / ${all}`;
  $("#progb").style.width = all ? `${got / all * 100}%` : "0";
}

/* ===== 画面の切り替え。URL の # で決める（#ec なら EC計の手順書） ===== */
function route(){
  const id = decodeURIComponent(location.hash.slice(1));
  const m = MANUALS.find(x => x.id === id && (x.kind === "tejun" || x.kind === "kaisetsu"));
  const back = $("#back");
  if(m){
    if(m.kind === "kaisetsu") drawKaisetsu(m); else drawDoc(m);
    $("#shelf").hidden = true; $("#doc").hidden = false;
    back.href = "#"; back.textContent = "‹ マニュアル一覧";
    document.title = `${m.title}｜マニュアル`;
  }else{
    drawShelf();
    $("#doc").hidden = true; $("#shelf").hidden = false;
    back.href = "../"; back.textContent = "‹ アプリ一覧";
    document.title = "マニュアル｜ハッピートマトファーム";
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
